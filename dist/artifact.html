<title>生物会考冲A</title>
<style>
/* 布局：手机底部标签栏 + 电脑左侧导航；内容列最宽 960px；做题页为沉浸式单列 */
:root {
  /* 纸与墨：略带叶绿的纸色，深绿墨水；红笔用于判错与成绩印章，荧光黄用于必背词 */
  --bg: #F4F7F1;
  --surface: #FFFFFF;
  --surface-2: #ECF1E8;
  --ink: #1B261F;
  --ink-2: #4B5A50;
  --ink-3: #78857C;
  --line: #D6DED2;
  --accent: #2B6B47;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEEE4;
  --ok: #1F8650;
  --ok-soft: #E0F2E7;
  --bad: #C2372A;
  --bad-soft: #FBE7E4;
  --warn: #A46910;
  --warn-soft: #FAEFD8;
  --hl: #FFE16B;
  --hl-ink: #1B261F;
  --shadow: 0 1px 2px rgba(27, 38, 31, 0.06), 0 4px 14px rgba(27, 38, 31, 0.06);

  /* 示意图配色 */
  --f-line: #2C3A31;
  --f-text: #1B261F;
  --f-muted: #6B776F;
  --f-cyto: #EAF4E3;
  --f-wall: #A9CC8F;
  --f-nuc: #CDBDEB;
  --f-chl: #5FA94E;
  --f-vac: #D5EBF7;
  --f-mito: #F3BB84;
  --f-red: #DE5A52;
  --f-blue: #4F7DC9;
  --f-bone: #F2E8CB;
  --f-mus: #E9A69C;
  --f-yel: #F5D461;
  --f-wat: #CFE7F4;
  --f-soil: #CDAE84;
  --f-gry: #DADFDA;
  --f-pink: #F7CACA;
  --f-wht: #FFFFFF;
  --f-leaf: #8CC47A;
  --f-brn: #A87B51;
  --f-pur: #B39DDB;
  --f-org: #F2A65A;
  --f-dark: #59645C;

  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Zen Hei", sans-serif;
  --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", "Songti TC", serif;
  --font-note: "Kaiti SC", "STKaiti", "KaiTi", "KaiTi_GB2312", "Noto Serif CJK SC", serif;
  --font-num: "DIN Alternate", "Bahnschrift", "Roboto Condensed", "Arial Narrow", -apple-system, "Segoe UI", sans-serif;
  --font-paper: "SimSun", "Songti SC", "STSong", "Noto Serif CJK SC", serif;

  --r: 10px;
  --r-sm: 7px;
  --tabbar-h: 60px;
  --side-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1310; --surface: #161D18; --surface-2: #1D2620; --ink: #E2EAE4; --ink-2: #A8B4AB; --ink-3: #7D8A81; --line: #2A342D;
    --accent: #72C192; --accent-ink: #0E1310; --accent-soft: #1B3224; --ok: #5DCB8C; --ok-soft: #153223; --bad: #F2806F; --bad-soft: #3A1D19;
    --warn: #E5B353; --warn-soft: #35290F; --hl: #5E4F0E; --hl-ink: #FFF4C2; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    --f-line: #CFDDD3; --f-text: #E2EAE4; --f-muted: #95A39A; --f-cyto: #22372A; --f-wall: #4E7A43; --f-nuc: #5A4B80; --f-chl: #3F8C39; --f-vac: #1E3949;
    --f-mito: #8A5B2E; --f-red: #D9625A; --f-blue: #6E98DE; --f-bone: #57503D; --f-mus: #8C4B44; --f-yel: #9C8526; --f-wat: #1F3C4C; --f-soil: #6B5638;
    --f-gry: #39423C; --f-pink: #6E4047; --f-wht: #1D2620; --f-leaf: #4A7A3E; --f-brn: #7D5A3A; --f-pur: #6B5A95; --f-org: #9A6630; --f-dark: #A9B5AC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1310; --surface: #161D18; --surface-2: #1D2620; --ink: #E2EAE4; --ink-2: #A8B4AB; --ink-3: #7D8A81; --line: #2A342D;
  --accent: #72C192; --accent-ink: #0E1310; --accent-soft: #1B3224; --ok: #5DCB8C; --ok-soft: #153223; --bad: #F2806F; --bad-soft: #3A1D19;
  --warn: #E5B353; --warn-soft: #35290F; --hl: #5E4F0E; --hl-ink: #FFF4C2; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  --f-line: #CFDDD3; --f-text: #E2EAE4; --f-muted: #95A39A; --f-cyto: #22372A; --f-wall: #4E7A43; --f-nuc: #5A4B80; --f-chl: #3F8C39; --f-vac: #1E3949;
  --f-mito: #8A5B2E; --f-red: #D9625A; --f-blue: #6E98DE; --f-bone: #57503D; --f-mus: #8C4B44; --f-yel: #9C8526; --f-wat: #1F3C4C; --f-soil: #6B5638;
  --f-gry: #39423C; --f-pink: #6E4047; --f-wht: #1D2620; --f-leaf: #4A7A3E; --f-brn: #7D5A3A; --f-pur: #6B5A95; --f-org: #9A6630; --f-dark: #A9B5AC;
  color-scheme: dark;
}

/* ---------- 基础 ---------- */
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
html[data-font="s"] { font-size: 15px; }
html[data-font="l"] { font-size: 18px; }
html[data-font="xl"] { font-size: 20px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
h2 { font-size: 1.08rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.hint { color: var(--ink-3); font-size: 0.85rem; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
mark.hl { background: linear-gradient(transparent 38%, var(--hl) 38%, var(--hl) 92%, transparent 92%); color: var(--hl-ink); padding: 0 1px; }
b.em { font-weight: 700; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.blank { display: inline-block; min-width: 5.5em; border-bottom: 1.5px solid var(--ink-2); margin: 0 0.25em; height: 1.1em; vertical-align: -0.15em; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
  min-height: 2.5rem; padding: 0.45rem 1rem; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer; font-size: 0.95rem; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); text-decoration: none; }
.btn .ic { width: 1.1em; height: 1.1em; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn.lg { min-height: 2.9rem; padding: 0.6rem 1.35rem; font-size: 1.02rem; }
.btn.sm { min-height: 2.1rem; padding: 0.3rem 0.75rem; font-size: 0.88rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0.2rem 0.35rem; color: var(--accent); cursor: pointer; font-size: 0.88rem; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.danger { color: var(--bad); }
.iconbtn {
  display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer; flex: none;
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.iconbtn .ic { width: 1.35rem; height: 1.35rem; }
.iconbtn.fav { font-size: 1.25rem; color: var(--ink-3); }
.iconbtn.fav.on { color: var(--warn); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.row { display: flex; align-items: center; gap: 0.5rem; }
.row.wrap { flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
.grow { flex: 1; }
.ic { width: 1.25rem; height: 1.25rem; flex: none; }

/* ---------- 外框 ---------- */
.shell { min-height: 100%; }
.side { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 0.25rem; padding: 0.35rem 0.5rem 0.35rem 1rem;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand-m { display: flex; align-items: center; gap: 0.45rem; color: var(--ink); font-family: var(--font-display); font-size: 1.12rem; }
.brand-m:hover { text-decoration: none; }
.logo { color: var(--accent); width: 1.6rem; height: 1.6rem; }
.page { padding: 1rem 1rem calc(var(--tabbar-h) + 1.5rem + env(safe-area-inset-bottom, 0px)); max-width: 980px; margin: 0 auto; display: grid; gap: 1.1rem; min-width: 0; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--line);
}
.tab-i { position: relative; display: grid; place-items: center; align-content: center; gap: 0.1rem; color: var(--ink-3); font-size: 0.72rem; text-decoration: none; }
.tab-i .ic { width: 1.45rem; height: 1.45rem; }
.tab-i.on { color: var(--accent); font-weight: 600; }
.tab-i:hover { text-decoration: none; }
.dotb { position: absolute; top: 0.55rem; left: calc(50% + 0.55rem); width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--bad); }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding: 0.75rem 1rem; border-radius: var(--r); font-size: 0.92rem; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-soft); color: var(--ink); margin: 0.75rem 1rem 0; }

@media (min-width: 900px) {
  .side {
    display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: var(--side-w);
    padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 0.85rem 1rem; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem 1.1rem; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .brand b { display: block; font-family: var(--font-display); font-size: 1.22rem; letter-spacing: 0.04em; }
  .brand small { display: block; color: var(--ink-3); font-size: 0.75rem; }
  .side-nav { display: grid; gap: 2px; }
  .side-nav hr { border: 0; border-top: 1px solid var(--line); margin: 0.6rem 0.5rem; }
  .nav-i { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.7rem; border-radius: var(--r-sm); color: var(--ink-2); }
  .nav-i:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
  .nav-i.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge { margin-left: auto; min-width: 1.4rem; padding: 0 0.4rem; border-radius: 1rem; background: var(--bad); color: var(--surface); font-size: 0.74rem; text-align: center; line-height: 1.35rem; }
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.7rem; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); cursor: pointer; font-size: 0.85rem; text-align: left; }
  .side-foot:hover { border-color: var(--accent); }
  .main { margin-left: var(--side-w); }
  .topbar, .tabbar { display: none; }
  .page { padding: 2rem 2.25rem 3rem; }
  .banner.warn { margin: 1rem 2.25rem 0; }
}

/* ---------- 通用块 ---------- */
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.ph-t { display: grid; gap: 0.35rem; min-width: 0; }
.ph .sub { color: var(--ink-2); max-width: 46em; font-size: 0.93rem; }
.crumb { display: flex; gap: 0.4rem; align-items: center; font-size: 0.85rem; color: var(--ink-3); flex-wrap: wrap; }
.crumb span { color: var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: grid; gap: 0.75rem; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.note { color: var(--ink-2); font-size: 0.88rem; display: grid; gap: 0.5rem; padding: 0 0.15rem; }
.note h3 { color: var(--ink); }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--ink-3); }
.empty { display: grid; gap: 0.75rem; justify-items: center; text-align: center; padding: 2.5rem 1rem; color: var(--ink-2); }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 3rem; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--warn); } .bar.good i { background: var(--ok); }
.good { color: var(--ok); } .mid { color: var(--warn); } .low { color: var(--bad); }
.tag { font-size: 0.72rem; padding: 0.05rem 0.4rem; border-radius: 0.3rem; background: var(--surface-2); color: var(--ink-2); }
.cols { display: grid; gap: 1.1rem; }
@media (min-width: 760px) { .cols { grid-template-columns: 1.15fr 1fr; align-items: start; } }

/* ---------- 首页 ---------- */
.hero {
  display: grid; gap: 1rem; padding: 1.35rem 1.25rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  background-image: radial-gradient(circle at 100% 0%, var(--accent-soft) 0, transparent 55%);
}
.hero-main { display: grid; gap: 0.6rem; min-width: 0; }
.hero-t { font-size: 1.55rem; }
.hero-s { color: var(--ink-2); max-width: 36em; }
.hero-s b { color: var(--ink); font-size: 1.1em; }
.cd { display: flex; align-items: center; gap: 0.6rem; }
.cd-n { font-family: var(--font-num); font-size: 3rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.cd-t { color: var(--ink-2); font-size: 0.9rem; line-height: 1.35; }
.cd.set { font-size: 0.9rem; }
@media (min-width: 700px) { .hero { grid-template-columns: 1fr auto; align-items: center; padding: 1.75rem 1.75rem; } .hero-side { border-left: 1px dashed var(--line); padding-left: 1.5rem; } }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { display: grid; gap: 0.3rem; align-content: start; padding: 0.85rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.kpi-l { font-size: 0.8rem; color: var(--ink-3); }
.kpi-v { font-size: 1.75rem; line-height: 1.1; }
.kpi-v small { font-size: 0.9rem; color: var(--ink-3); }
.kpi-n { font-size: 0.8rem; color: var(--ink-3); }
.kpis.sm .kpi-v { font-size: 1.4rem; }
.weak { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; }
.weak a { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 0.75rem; padding: 0.6rem 0.4rem; border-radius: var(--r-sm); color: var(--ink); }
.weak a:hover { background: var(--surface-2); text-decoration: none; }
.weak .bar { grid-column: 1 / -1; }
.w-t { display: grid; } .w-t small { color: var(--ink-3); font-size: 0.78rem; }
.w-s { font-size: 0.85rem; color: var(--ink-2); align-self: center; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
.quick a { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 0.6rem; padding: 0.7rem 0.75rem; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); align-items: center; }
.quick a:hover { text-decoration: none; outline: 1px solid var(--accent); }
.quick .ic { grid-row: 1 / 3; color: var(--accent); width: 1.5rem; height: 1.5rem; }
.quick small { color: var(--ink-3); font-size: 0.76rem; }

/* ---------- 章节列表 ---------- */
.book { display: grid; gap: 0.6rem; }
.book-h { font-family: var(--font-display); font-size: 1.25rem; padding-bottom: 0.3rem; border-bottom: 2px solid var(--ink); }
.unit { display: grid; gap: 0.35rem; }
.unit-h { font-size: 0.88rem; color: var(--ink-2); font-weight: 600; margin-top: 0.4rem; }
.chlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
.chlist a, .chlist .dis { display: grid; grid-template-columns: 3.4rem 1fr minmax(3rem, 7rem) 3rem; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--ink); }
.chlist a:hover { border-color: var(--accent); text-decoration: none; }
.chlist.hb a, .chlist.hb .dis { grid-template-columns: 3.4rem 1fr; }
.chlist .dis { opacity: 0.5; }
.c-no { font-size: 0.8rem; color: var(--ink-3); }
.c-t { display: grid; font-weight: 600; min-width: 0; }
.c-t small { font-weight: 400; color: var(--ink-3); font-size: 0.78rem; }
.c-acc { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
@media (max-width: 480px) { .chlist a { grid-template-columns: 1fr 3rem; } .chlist a .c-no { display: none; } .chlist a .bar { grid-column: 1 / -1; grid-row: 2; } .chlist.hb a { grid-template-columns: 1fr; } }

.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.actions.two { grid-template-columns: 1fr; }
@media (min-width: 700px) { .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); } .actions.two { grid-template-columns: 1.4fr 1fr; } }
.act-card { display: grid; gap: 0.2rem; text-align: left; padding: 0.9rem 1rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.act-card:hover { border-color: var(--accent); }
.act-card b { font-size: 1rem; }
.act-card small { color: var(--ink-3); font-size: 0.8rem; }
.act-card.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.act-card.primary small { color: var(--accent-ink); opacity: 0.85; }
.act-card:disabled { opacity: 0.45; cursor: not-allowed; }
.kplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem; }
.kplist button { width: 100%; display: grid; grid-template-columns: 1fr 3.2rem minmax(3rem, 6rem) 3rem; gap: 0.6rem; align-items: center; padding: 0.5rem 0.4rem; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; text-align: left; }
.kplist button:hover { background: var(--surface-2); }
.kp-n { font-size: 0.82rem; color: var(--ink-3); text-align: right; font-family: var(--font-num); }
@media (max-width: 480px) { .kplist button { grid-template-columns: 1fr 3rem 3rem; } .kplist .bar { display: none; } }

/* ---------- 专项 ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: grid; gap: 0.15rem; text-align: left; padding: 0.8rem 0.9rem; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.tile:hover { border-color: var(--accent); }
.tile small { color: var(--ink-3); font-size: 0.78rem; }
.tile:disabled { opacity: 0.45; cursor: not-allowed; }
.figgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
.fg-h { grid-column: 1 / -1; font-size: 0.88rem; color: var(--ink-2); margin-top: 0.4rem; }
.figtile { display: grid; gap: 0.4rem; padding: 0.6rem; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; text-align: left; }

.ft-img .lb .nm { display: none; }
.ft-t { font-size: 0.82rem; display: grid; } .ft-t small { color: var(--ink-3); }

/* ---------- 做题 ---------- */
.immersive { min-height: 100%; display: flex; flex-direction: column; }
.runbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.rb-t { flex: 1; display: grid; min-width: 0; line-height: 1.3; }
.rb-t b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-t small { color: var(--ink-3); font-size: 0.78rem; }
.timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.15rem; padding: 0.15rem 0.6rem; border-radius: var(--r-sm); background: var(--surface-2); }
.timer.warn { background: var(--bad-soft); color: var(--bad); }
.runbody { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 1rem 1rem 1.5rem; display: grid; gap: 1rem; align-content: start; min-width: 0; }
.runfoot {
  position: sticky; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 0.75rem;
  padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line);
}
.runfoot .btn { flex: 1; max-width: 13rem; }
.part-h { font-weight: 600; color: var(--ink-2); font-size: 0.92rem; }

.qcard { display: grid; gap: 0.85rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1rem 1.15rem; min-width: 0; }
@media (max-width: 480px) { .qcard { padding: 0.85rem 0.8rem 1rem; } .qcard .fig { margin: 0 -0.4rem; } .runbody { padding: 0.75rem 0.6rem 1.25rem; } }
.qhead { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-3); }
.qhead .fav { margin-left: auto; width: 2.2rem; height: 2.2rem; }
.qtype { font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: 0.1rem 0.55rem; border-radius: 0.35rem; }
.qtype.t-c { color: var(--warn); background: var(--warn-soft); }
.qdiff { color: var(--warn); letter-spacing: 1px; font-size: 0.7rem; }
.qdiff .dim { color: var(--line); }
.qpts { color: var(--ink-2); }
.qstem { font-size: 1.06rem; line-height: 1.75; }
.qnum { font-family: var(--font-num); font-weight: 700; margin-right: 0.35rem; }
.case-title b { font-weight: 600; }
.material { background: var(--surface-2); border-radius: var(--r-sm); padding: 0.75rem 0.9rem; font-size: 0.95rem; line-height: 1.75; overflow-x: auto; }
.material table, .p-mat table { border-collapse: collapse; margin: 0.5rem 0; font-size: 0.9rem; }
.material th, .material td, .p-mat th, .p-mat td { border: 1px solid var(--line); padding: 0.3rem 0.55rem; text-align: center; }
.material th, .p-mat th { background: var(--surface); font-weight: 600; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }
.opts.judge { grid-template-columns: 1fr 1fr; }
.opt {
  width: 100%; display: flex; align-items: flex-start; gap: 0.7rem; text-align: left;
  padding: 0.75rem 0.85rem; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface);
  cursor: pointer; line-height: 1.55; font-size: 1rem; min-height: 3rem;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.ol { flex: none; display: grid; place-items: center; width: 1.65rem; height: 1.65rem; border-radius: 50%; border: 1.5px solid var(--ink-3); font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin-top: -0.05rem; }
.ot { flex: 1; min-width: 0; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ol { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ol { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ol { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.mk { flex: none; font-weight: 800; font-size: 1.15rem; line-height: 1.4; }
.mk.ok { color: var(--ok); } .mk.bad { color: var(--bad); }
.opts.sm .opt { padding: 0.55rem 0.75rem; min-height: 2.6rem; font-size: 0.95rem; }
.fb { display: flex; align-items: center; gap: 0.5rem; font-weight: 650; padding: 0.55rem 0.8rem; border-radius: var(--r-sm); }
.fb-i { font-size: 1.2rem; }
.fb.ok { color: var(--ok); background: var(--ok-soft); }
.fb.bad { color: var(--bad); background: var(--bad-soft); }
.fb.neutral { color: var(--ink-2); background: var(--surface-2); }
/* 解析：仿老师批注，楷体正文 */
.ana { display: grid; gap: 0.45rem; padding: 0.8rem 0.95rem; border-radius: var(--r-sm); background: var(--surface-2); border: 1px dashed var(--line); }
.ana-h { font-family: var(--font-note); color: var(--bad); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.1em; }
.ana-b { font-family: var(--font-note); font-size: 1.06rem; line-height: 1.8; }
.ana-m { display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; font-size: 0.78rem; color: var(--ink-3); }
.subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
.sub { display: grid; gap: 0.55rem; padding-top: 0.85rem; border-top: 1px dashed var(--line); }
.sub-q { line-height: 1.7; }
.subno { font-weight: 650; margin-right: 0.15rem; }
.subpts { margin-left: 0.5rem; font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; }
.fillrow { display: flex; gap: 0.5rem; }
.fillin, .openin, textarea, input[type="text"], input[type="number"], input[type="date"], input[type="search"], .sel, select {
  width: 100%; padding: 0.55rem 0.7rem; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-height: 2.5rem;
}
.fillin:focus, .openin:focus, textarea:focus, input:focus, select:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; line-height: 1.6; }
.sfb { font-size: 0.9rem; padding: 0.4rem 0.7rem; border-radius: var(--r-sm); }
.sfb.ok { color: var(--ok); background: var(--ok-soft); }
.sfb.bad { color: var(--bad); background: var(--bad-soft); }
.sfb.part { color: var(--warn); background: var(--warn-soft); }
.sfb.neutral { background: var(--surface-2); }
.refans { display: grid; gap: 0.2rem; padding: 0.6rem 0.8rem; border-radius: var(--r-sm); border: 1px solid var(--ok); background: var(--ok-soft); font-size: 0.95rem; }
.ref-h { font-size: 0.78rem; color: var(--ok); font-weight: 650; }
.myans { padding: 0.5rem 0.75rem; background: var(--surface-2); border-radius: var(--r-sm); font-size: 0.95rem; }
.myans span { color: var(--ink-3); }
.kwhits { display: flex; flex-wrap: wrap; gap: 0.35rem; font-size: 0.82rem; color: var(--ink-3); align-items: center; }
.kw { padding: 0.05rem 0.45rem; border-radius: 1rem; border: 1px solid var(--line); }
.kw.hit { border-color: var(--ok); color: var(--ok); }
.selfgrade { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
.sub-ana { font-family: var(--font-note); font-size: 1rem; color: var(--ink-2); line-height: 1.75; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6rem, 1fr)); gap: 0.4rem; }
.sheet-sep { grid-column: 1 / -1; font-size: 0.8rem; color: var(--ink-3); margin-top: 0.3rem; }
.sq { height: 2.6rem; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--font-num); }
.sq.done { background: var(--accent-soft); border-color: var(--accent); }
.sq.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.sq.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.sq.cur { outline: 2.5px solid var(--ink); outline-offset: 1px; }
.sheet-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-3); margin-top: 0.75rem; }
.sheet-legend i { display: inline-block; width: 0.95rem; height: 0.95rem; vertical-align: -0.15rem; margin-right: 0.3rem; }
.summary { display: grid; gap: 0.75rem; text-align: center; }
.sum-big .num { font-size: 3rem; color: var(--accent); }
.sum-big small { color: var(--ink-3); }

/* 课堂投屏：放大 */
.classroom { max-width: 1180px; font-size: 1.45rem; }
.classroom .qstem { font-size: 1.6rem; }
.classroom .opt { font-size: 1.45rem; padding: 1rem 1.15rem; }
.classroom .ol { width: 2.3rem; height: 2.3rem; font-size: 1.15rem; }
.classroom .fig .figsvg { max-width: 760px !important; }
.classroom .ana-b { font-size: 1.4rem; }

/* ---------- 插图 ---------- */
.fig { margin: 0; display: grid; justify-items: center; gap: 0.35rem; overflow-x: auto; }
.figsvg { width: 100%; height: auto; display: block; }
.fig figcaption { font-size: 0.8rem; color: var(--ink-3); text-align: center; }
.figsvg text { font-family: var(--font-body); }
.figsvg .st, .figsvg .k { stroke: var(--f-line); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
.figsvg .st { fill: none; }
.figsvg .thin { stroke-width: 0.8; }
.figsvg .thick { stroke-width: 2.2; }
.figsvg .dash { stroke-dasharray: 4 3; }
.figsvg .c-cyto { fill: var(--f-cyto); } .figsvg .c-wall { fill: var(--f-wall); } .figsvg .c-nuc { fill: var(--f-nuc); }
.figsvg .c-chl { fill: var(--f-chl); } .figsvg .c-vac { fill: var(--f-vac); } .figsvg .c-mito { fill: var(--f-mito); }
.figsvg .c-red { fill: var(--f-red); } .figsvg .c-blue { fill: var(--f-blue); } .figsvg .c-bone { fill: var(--f-bone); }
.figsvg .c-mus { fill: var(--f-mus); } .figsvg .c-yel { fill: var(--f-yel); } .figsvg .c-wat { fill: var(--f-wat); }
.figsvg .c-soil { fill: var(--f-soil); } .figsvg .c-gry { fill: var(--f-gry); } .figsvg .c-pink { fill: var(--f-pink); }
.figsvg .c-wht { fill: var(--f-wht); } .figsvg .c-leaf { fill: var(--f-leaf); } .figsvg .c-brn { fill: var(--f-brn); }
.figsvg .c-pur { fill: var(--f-pur); } .figsvg .c-org { fill: var(--f-org); } .figsvg .c-dark { fill: var(--f-dark); }
.figsvg .c-line { fill: var(--f-line); } .figsvg .nf { fill: none; }
.figsvg .s-red { stroke: var(--f-red); } .figsvg .s-blue { stroke: var(--f-blue); } .figsvg .s-mut { stroke: var(--f-muted); }
.figsvg .ld { stroke: var(--f-muted); stroke-width: 0.9; }
.figsvg .dot { fill: var(--f-line); }
.figsvg .lb { fill: var(--f-text); font-size: 14px; }
.figsvg .lb .n { font-weight: 600; }
.figsvg .lb .nm { display: none; }
.fig.names .figsvg .lb .nm { display: inline; }
.figsvg .tx { fill: var(--f-text); font-size: 13px; }
.figsvg .tx.sm, .figsvg .tk { fill: var(--f-muted); font-size: 10.5px; }
.figsvg .tx.b { font-weight: 650; }
.figsvg .ar line, .figsvg .ar polyline { stroke: var(--f-line); stroke-width: 1.3; fill: none; }
.figsvg .ar polygon { fill: var(--f-line); stroke: none; }
.figsvg .ar.red line, .figsvg .ar.red polyline { stroke: var(--f-red); } .figsvg .ar.red polygon { fill: var(--f-red); }
.figsvg .ar.blue line, .figsvg .ar.blue polyline { stroke: var(--f-blue); } .figsvg .ar.blue polygon { fill: var(--f-blue); }
.figsvg .ar.mut line, .figsvg .ar.mut polyline { stroke: var(--f-muted); } .figsvg .ar.mut polygon { fill: var(--f-muted); }
.figsvg .ar.thin line, .figsvg .ar.thin polyline { stroke-width: 1; }
.figsvg .ar.thick line, .figsvg .ar.thick polyline { stroke-width: 2.2; }
.figsvg .bx rect { fill: var(--f-wht); stroke: var(--f-line); stroke-width: 1.2; }
.figsvg .bx.hl rect { fill: var(--f-cyto); }
.figsvg .bx .bt { fill: var(--f-text); font-size: 12px; }
.figsvg .ax line { stroke: var(--f-line); stroke-width: 1.1; }
.figsvg .ax .ar line { stroke-width: 1.1; }
.figsvg .curve { fill: none; stroke-width: 2; }
.zoom .fig .figsvg { max-width: 100% !important; }

/* ---------- 模考与成绩 ---------- */
.result { display: grid; grid-template-columns: auto 1fr; gap: 1.25rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
.res-main { display: grid; gap: 0.35rem; min-width: 0; }
.res-score .num { font-size: 3.2rem; line-height: 1; }
.res-score small { color: var(--ink-3); margin-left: 0.3rem; }
.res-s { color: var(--ink-2); font-size: 0.93rem; }
.stamp {
  width: 6.2rem; height: 6.2rem; border-radius: 50%; border: 3px double var(--bad); color: var(--bad);
  display: grid; place-items: center; align-content: center; transform: rotate(-12deg); font-family: var(--font-display);
}
.st-g { font-size: 2.6rem; line-height: 1; font-weight: 800; font-family: var(--font-num); }
.st-l { font-size: 0.8rem; letter-spacing: 0.3em; margin-left: 0.3em; }
@media (max-width: 480px) { .result { grid-template-columns: 1fr; justify-items: start; } .stamp { width: 5.2rem; height: 5.2rem; } }
.grade-A { color: var(--ok); } .grade-B { color: var(--accent); } .grade-C { color: var(--warn); } .grade-D { color: var(--bad); }
.stamp.grade-A, .stamp.grade-B, .stamp.grade-C, .stamp.grade-D { color: var(--bad); }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th, .tbl td { padding: 0.5rem 0.55rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; border-bottom: 1.5px solid var(--ink-3); }
.tbl .r { text-align: right; }
.tbl .lost { color: var(--bad); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
.hist li { display: flex; align-items: center; gap: 0.5rem; }
.hist a, .hist-b { flex: 1; display: flex; align-items: center; gap: 0.85rem; padding: 0.6rem 0.75rem; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); border: 0; cursor: pointer; text-align: left; min-width: 0; }
.hist a:hover, .hist-b:hover { text-decoration: none; outline: 1px solid var(--accent); }
.hist li.on .hist-b { outline: 1.5px solid var(--accent); }
.h-g { font-family: var(--font-num); font-size: 1.5rem; font-weight: 800; width: 1.8rem; text-align: center; }
.h-t { flex: 1; display: grid; min-width: 0; } .h-t small { color: var(--ink-3); font-size: 0.78rem; }
.h-s { font-size: 1.3rem; }
.chart-wrap { overflow-x: auto; }
.trend { width: 100%; min-width: 320px; height: auto; }
.trend .grid { stroke: var(--line); stroke-width: 1; }
.trend .gl { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 4; }
.trend .gt, .trend .tk { fill: var(--ink-3); font-size: 11px; font-family: var(--font-num); }
.trend .line { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.trend .area { fill: var(--accent-soft); opacity: 0.8; }
.trend .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.trend .pt.end { fill: var(--accent); }
.trend .pv { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-num); }

/* ---------- 错题本 ---------- */
.seg { display: flex; gap: 0.3rem; overflow-x: auto; padding: 0.25rem; background: var(--surface-2); border-radius: var(--r); }
.seg a { flex: 1; white-space: nowrap; text-align: center; padding: 0.45rem 0.75rem; border-radius: var(--r-sm); color: var(--ink-2); font-size: 0.9rem; }
.seg a.on { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--shadow); }
.seg a:hover { text-decoration: none; }
.wgroup { display: grid; gap: 0.4rem; }
.wg-h { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.wg-h small { color: var(--ink-3); font-weight: 400; }
.wlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }

.wq { flex: 1; display: grid; gap: 0.15rem; text-align: left; padding: 0.6rem 0.75rem; border: 0; background: none; cursor: pointer; min-width: 0; }
.wq-t { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wq-m { font-size: 0.76rem; color: var(--ink-3); }
.boxdots i { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--line); margin-right: 2px; }
.boxdots i.on { background: var(--ok); }

/* ---------- 手册 ---------- */
.tipcard { display: grid; gap: 0.2rem; padding: 1rem 1.1rem; border-radius: var(--r); background: var(--ink); color: var(--bg); }
.tipcard:hover { text-decoration: none; filter: brightness(1.1); }
.tipcard small { opacity: 0.8; }
.hbook { display: grid; gap: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.15rem 1.15rem 1.4rem; min-width: 0; }
.hb-h { display: grid; gap: 0.3rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--ink); }
.hb-h h2 { font-family: var(--font-display); font-size: 1.45rem; }
.hb-intro { color: var(--ink-2); }
.hb-sec { display: grid; gap: 0.5rem; min-width: 0; }
.hb-sec h3 { font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; }

.hb-sec.exp h3::before, .hb-sec.traps h3::before { display: none; }
.hb-sec ul, .hb-sec ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.3rem; }
.hb-tip { font-size: 0.92rem; padding: 0.45rem 0.7rem; background: var(--bad-soft); border-radius: var(--r-sm); }

.steps li::marker { font-weight: 700; color: var(--accent); }
.notes { color: var(--ink-2); font-size: 0.92rem; }

.hbt th[scope="row"] { font-weight: 600; white-space: nowrap; }
.hbt td, .hbt th { font-size: 0.88rem; }
.pager { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.92rem; }
.hb-tools { justify-content: flex-start; }
.prose { line-height: 1.8; }
.prose h3 { margin-top: 0.4rem; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.3rem; }

/* ---------- 老师组卷 ---------- */
.form .field, .field { display: grid; gap: 0.3rem; font-size: 0.9rem; }
.field > span { color: var(--ink-2); }
.field.check { display: flex; align-items: center; gap: 0.5rem; align-self: end; min-height: 2.5rem; }
.field.check input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
.grid3 { display: grid; gap: 0.75rem; grid-template-columns: 1fr; }

.scope { display: grid; gap: 0.6rem; }
@media (min-width: 760px) { .scope { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scope fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0.5rem 0.75rem 0.65rem; display: flex; flex-wrap: wrap; gap: 0.35rem 0.85rem; margin: 0; min-width: 0; }
.scope legend { padding: 0 0.3rem; }
.chk { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.88rem; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 1rem; height: 1rem; }
.gradeset label { display: inline-flex; align-items: center; gap: 0.35rem; }

function esc(s) {

/* 题库文本的轻量标记：
 *   **加点字**  ==荧光笔==  ____ 填空线  \n 换行
 * trusted=true 时允许题库作者写少量 HTML（表格等）；导入的题目一律先转义。 */
function fmt(s, trusted) {

       .replace(/_{4,}/g, '<span class="blank"></span>')

function sum(arr, f) { let s = 0; for (const x of arr) s += f ? f(x) : x; return s; }

  const m = new Map();
  for (const x of arr) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;

function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  const a = arr.slice(); const r = rand || Math.random;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickN(arr, n, rand) { return shuffle(arr, rand).slice(0, n); }

/* 以本地日期计的“天数编号”，用于错题间隔复习 */
function dayNo(d) {
  const x = d ? new Date(d) : new Date();
  return Math.floor(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) / 86400000);

}

}
function fmtDur(sec) {

/* 文本归一化：用于填空题判分与搜索 */
function norm(s) {
  return String(s == null ? "" : s)

/* ---------- 本地存储（任何异常都退回内存，不影响使用） ---------- */
const LS = {
  ok: true,
  mem: Object.create(null),
  probe() {
    try {
      const k = "__lbio_probe__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      this.ok = true;
    } catch (e) { this.ok = false; }
    return this.ok;
  },
  get(k, def) {
    if (this.ok) {
      try {
        const v = localStorage.getItem(k);
        if (v != null) return JSON.parse(v);
      } catch (e) { /* 读失败时退回内存 */ }
    }
    return k in this.mem ? this.mem[k] : def;
  },
  set(k, v) {
    this.mem[k] = v;
    if (!this.ok) return false;
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { this.ok = false; return false; }
  },
  del(k) {
    delete this.mem[k];
    try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
  },
  keys(prefix) {
    const out = new Set(Object.keys(this.mem).filter(k => k.startsWith(prefix)));
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) out.add(k);

    } catch (e) { /* 忽略 */ }
    return Array.from(out);

/* ---------- 题库注册表 ----------
 * 数据文件通过 BANK.setBooks / BANK.add / BANK.fig / BANK.handbook 注册内容。 */
const TYPE_NAME = { s: "单选题", j: "判断题", c: "非选择题" };
const CASE_NAME = { 识图: "识图作答", 实验: "实验探究", 资料: "资料分析", 综合: "综合应用" };

const BANK = {
  books: [], units: [], chapters: [],
  chMap: Object.create(null),
  qs: [], qMap: Object.create(null), byCh: Object.create(null),
  figs: Object.create(null), figList: [],
  hb: Object.create(null),
  tips: [],
  errors: [],

  setBooks(books) {
    this.books = books;
    let order = 0;
    for (const b of books) {
      for (const u of b.units) {
        u.book = b.id;
        this.units.push(u);
        for (const c of u.chapters) {
          c.book = b.id; c.bookName = b.name; c.unit = u.id; c.unitName = u.name;
          c.order = order++;
          c.full = `${u.name} ${c.no} ${c.name}`;
          c.short = `${b.short}·${c.name}`;
          this.chapters.push(c);
          this.chMap[c.id] = c;
          this.byCh[c.id] = [];
        }
      }
    }
  },

  add(chId, list) {
    if (!this.chMap[chId]) { this.errors.push(`未知章节 ${chId}`); return; }
    for (const q of list) {
      q.ch = chId;
      if (this.qMap[q.id]) { this.errors.push(`题号重复 ${q.id}`); continue; }
      if (q.t === "c") {
        q.p = sum(q.subs, s => s.p || 0);
      }
      this.qs.push(q);
      this.qMap[q.id] = q;
      this.byCh[chId].push(q);
    }
  },

  fig(id, def) {
    def.id = id;
    this.figs[id] = def;
    this.figList.push(def);
  },

  handbook(chId, def) { this.hb[chId] = def; },

  /* 自动生成识图训练题：每个标注结构一道“名称”题，有功能说明的再加一道“功能”题 */
  buildFigureDrills() {
    for (const f of this.figList) {
      if (!f.labels || f.drill === false || !f.ch || !this.chMap[f.ch]) continue;
      const labs = f.labels.filter(l => l.name);
      if (labs.length < 4) continue;
      for (const L of labs) {
        const others = labs.filter(x => x !== L && x.name !== L.name);
        const base = { ch: f.ch, d: 1, fig: f.id, kp: f.kp || f.title, tags: ["识图"], auto: true };
        const optsA = [L.name].concat(others.slice(0, 12).map(x => x.name));
        const qa = Object.assign({}, base, {
          id: `F:${f.id}:${L.n}:a`, t: "s",
          q: `识图：图中${circ(L.n)}所示的结构名称是`,
          o: uniq(optsA), a: 0, pool: true,
          e: `${circ(L.n)}是${L.name}${L.fn ? "，" + L.fn : ""}。`
        });
        this._addDrill(qa);
        if (L.fn) {
          const withFn = others.filter(x => x.fn !== L.fn);
          const qb = Object.assign({}, base, {
            id: `F:${f.id}:${L.n}:b`, t: "s", d: 2,
            q: `识图：图中具有“${L.fn}”作用的结构是`,
            o: [`${circ(L.n)} ${L.name}`].concat(withFn.map(x => `${circ(x.n)} ${x.name}`)),
            a: 0, pool: true,
            e: `${L.fn}的是${circ(L.n)}${L.name}。`
          });
          this._addDrill(qb);
        }
      }
    }
  },
  _addDrill(q) {
    if (this.qMap[q.id]) return;
    this.qs.push(q); this.qMap[q.id] = q; this.byCh[q.ch].push(q);
  },

  /* 加入导入的自定义题目（老师自己录入） */
  addCustom(list) {
    for (const q of list) {
      if (this.qMap[q.id] || !this.chMap[q.ch]) continue;
      q.custom = true;
      if (q.t === "c") q.p = sum(q.subs, s => s.p || 0);
      this.qs.push(q); this.qMap[q.id] = q; this.byCh[q.ch].push(q);

  },
  removeCustom() {
    this.qs = this.qs.filter(q => !q.custom);
    for (const k of Object.keys(this.qMap)) if (this.qMap[k].custom) delete this.qMap[k];
    for (const c of Object.keys(this.byCh)) this.byCh[c] = this.byCh[c].filter(q => !q.custom);
  },

  chOf(q) { return this.chMap[q.ch]; },
  bookOf(chId) { return this.books.find(b => b.id === this.chMap[chId].book); },
  stats() {
    const s = { all: 0, s: 0, j: 0, c: 0, fig: 0, auto: 0 };
    for (const q of this.qs) {
      if (q.custom) continue;
      s.all++;
      if (q.auto) s.auto++; else s[q.t]++;
    }
    s.fig = this.figList.length;
    return s;
  }
};

/* ---- src/app/figkit.js ---- */
/* =========================================================
 * 示意图绘制工具：用少量函数拼出 SVG 字符串。
 * 颜色全部走 CSS 变量（见 styles.css 的 --f-* 系列），深浅色主题自动适配。
 * 标注文字由“序号 + 名称”两段组成：做题时只显示序号，看答案/查手册时显示名称。
 * ========================================================= */
const FK = {
  /* 引线标注：(x1,y1) 在结构上，(x2,y2) 为文字端；side: r 右 / l 左 / t 上 / b 下 */
  co(n, x1, y1, x2, y2, name, side) {
    side = side || (x2 >= x1 ? "r" : "l");
    return `<g class="co"><line class="ld" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>` +
      `<circle class="dot" cx="${x1}" cy="${y1}" r="1.7"/>` +
      FK.lbl(n, x2, y2, name, side) + `</g>`;
  },
  /* 只有文字的标注 */
  lbl(n, x, y, name, side) {
    side = side || "r";
    let tx = x, ty = y + 4, anc = "start";
    if (side === "r") tx = x + 3;
    else if (side === "l") { tx = x - 3; anc = "end"; }
    else if (side === "t") { ty = y - 4; anc = "middle"; }
    else if (side === "b") { ty = y + 14; anc = "middle"; }
    else if (side === "c") { anc = "middle"; }
    const num = n === "" || n == null ? "" : `<tspan class="n">${circ(n)}</tspan>`;
    const nm = name ? `<tspan class="nm">${name}</tspan>` : "";
    return `<text class="lb" x="${tx}" y="${ty}" text-anchor="${anc}">${num}${nm}</text>`;
  },
  /* 普通文字 */
  txt(x, y, s, cls, anchor, size) {
    return `<text class="${cls || "tx"}" x="${x}" y="${y}" text-anchor="${anchor || "middle"}"${size ? ` font-size="${size}"` : ""}>${s}</text>`;
  },
  /* 带箭头的线段（箭头用多边形绘制，不依赖 marker，打印与隐藏切换都可靠） */
  arr(x1, y1, x2, y2, cls, head) {
    head = head || 7;
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const bx = x2 - head * Math.cos(ang), by = y2 - head * Math.sin(ang);
    const w = head * 0.55;
    const p1 = [bx + w * Math.sin(ang), by - w * Math.cos(ang)];
    const p2 = [bx - w * Math.sin(ang), by + w * Math.cos(ang)];
    const c = cls || "ar";
    return `<g class="${c}"><line x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/>` +
      `<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}"/></g>`;
  },
  /* 折线箭头：points 为 [[x,y],...]，最后一段带箭头 */
  parr(points, cls, head) {
    const c = cls || "ar";
    const n = points.length;
    let s = `<g class="${c}"><polyline fill="none" points="${points.slice(0, n - 1).map(p => p.join(",")).join(" ")} ${points[n - 1].join(",")}"/></g>`;
    const [x1, y1] = points[n - 2], [x2, y2] = points[n - 1];
    return s + FK.arr(x1, y1, x2, y2, c, head);
  },
  /* 文字方框（用于流程图、食物网、循环图） */
  box(x, y, w, h, s, cls) {
    return `<g class="bx ${cls || ""}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>` +
      `<text class="bt" x="${x + w / 2}" y="${y + h / 2 + 4.5}" text-anchor="middle">${s}</text></g>`;
  },
  /* 坐标轴（曲线图用）：返回轴线与刻度；fx/fy 为数据到坐标的映射 */
  axes(o) {
    const { x0, y0, w, h, xt, yt, xl, yl } = o;
    let s = `<g class="ax"><line x1="${x0}" y1="${y0}" x2="${x0 + w}" y2="${y0}"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 - h}"/>`;
    s += FK.arr(x0 + w - 8, y0, x0 + w + 6, y0, "ar thin", 6) + FK.arr(x0, y0 - h + 8, x0, y0 - h - 6, "ar thin", 6);
    (xt || []).forEach(t => {
      s += `<line x1="${t.x}" y1="${y0}" x2="${t.x}" y2="${y0 + 4}"/>` + FK.txt(t.x, y0 + 16, t.s, "tk");
    });
    (yt || []).forEach(t => {
      s += `<line x1="${x0 - 4}" y1="${t.y}" x2="${x0}" y2="${t.y}"/>` + FK.txt(x0 - 7, t.y + 4, t.s, "tk", "end");
    });
    if (xl) s += FK.txt(x0 + w + 4, y0 + 30, xl, "tk", "end");
    if (yl) s += FK.txt(x0 + 4, y0 - h - 12, yl, "tk", "start");
    return s + `</g>`;
  }
};

/* 组装完整 SVG */
function figSvg(f) {
  const vb = f.vb || "0 0 400 300";
  const [, , w] = vb.split(/\s+/).map(Number);
  return `<svg class="figsvg" viewBox="${vb}" role="img" aria-label="${esc(f.title || "")}" style="max-width:${f.maxw || Math.max(260, Math.min(w * 1.15, 560))}px">${f.body}</svg>`;
}

/* 题目/手册中的插图块。names=true 时显示结构名称 */
function figHtml(id, opts) {
  const f = BANK.figs[id];
  if (!f) return "";
  opts = opts || {};
  const names = opts.names ? " names" : "";
  return `<figure class="fig${names}" data-fig="${esc(id)}">${figSvg(f)}` +
    `<figcaption>${esc(f.title || "")}${opts.toggle && f.labels ? ` <button type="button" class="linkbtn no-print" data-act="toggleNames">${opts.names ? "隐藏名称" : "显示名称"}</button>` : ""}` +
    `${opts.zoom !== false ? ` <button type="button" class="linkbtn no-print" data-act="zoomFig" data-fig="${esc(id)}">放大</button>` : ""}</figcaption></figure>`;
}

  { id: "u1c1-004", t: "s", d: 1, kp: "生物的特征", q: "“一母生九子，连母十个样”说明生物具有", o: ["变异的特性", "遗传的特性", "繁殖的特性", "排出废物的特性"], a: 0, e: "亲子之间以及子代个体之间存在差异，体现的是变异。" },
  { id: "u1c1-005", t: "s", d: 1, kp: "生物的特征", q: "下列现象中，能体现“生物能排出体内产生的废物”的是", o: ["人在剧烈运动后大量出汗", "含羞草的叶受到触碰后合拢", "蘑菇从小长大", "母鸡孵出小鸡"], a: 0, e: "排汗可以排出体内的部分水、无机盐和尿素，属于排出废物。含羞草合拢体现对刺激作出反应，蘑菇长大体现生长，孵出小鸡体现繁殖。植物落叶也能带走一部分废物。" },
  { id: "u1c1-006", t: "s", d: 1, kp: "生物的特征", q: "鲸浮出水面换气时会喷出雾状的水柱，这说明", o: ["生物能进行呼吸", "生物的生活需要营养", "生物能生长和繁殖", "生物都有遗传和变异的特性"], a: 0, e: "鲸用肺呼吸，浮出水面呼气时，呼出气体中的水汽遇冷形成雾状水柱，说明生物能进行呼吸。" },
  { id: "u1c1-007", t: "s", d: 2, kp: "生物的特征", q: "下列关于生物特征的叙述，正确的是", o: ["生物都能进行呼吸", "生物都能自由运动", "生物都是由细胞构成的", "生物都要从外界摄取现成的有机物"], a: 0, e: "所有生物都能进行呼吸。植物一般不能自由运动；病毒没有细胞结构；绿色植物能通过光合作用自己制造有机物，只需从外界获取水、无机盐和二氧化碳等。", tags: ["易错"] },
  { id: "u1c1-008", t: "s", d: 1, kp: "生物的特征", q: "“春种一粒粟，秋收万颗子”主要体现了生物的哪一特征", o: ["生物能生长、发育和繁殖", "生物能对外界刺激作出反应", "生物的生活需要营养", "生物能排出体内产生的废物"], a: 0, e: "一粒种子长成植株并结出大量种子，体现了生长、发育和繁殖。" },
  { id: "u1c1-009", t: "s", d: 2, kp: "生物与非生物", q: "病毒没有细胞结构，但属于生物，最主要的理由是", o: ["病毒能在活细胞中繁殖产生新的病毒", "病毒能自由运动", "病毒个体非常微小", "病毒能进行光合作用"], a: 0, e: "病毒虽无细胞结构，但能利用活细胞内的物质制造出新的病毒（繁殖），具有生命现象，所以属于生物。", tags: ["易错"] },
  { id: "u1c1-010", t: "s", d: 1, kp: "生物与非生物", q: "智能机器人能扫地，还能对主人的声音作出回应，但它不属于生物，主要原因是", o: ["它不能生长和繁殖，没有新陈代谢", "它不会运动", "它不能对外界刺激作出反应", "它的体积太大"], a: 0, e: "判断是否为生物，要看是否具有生物的基本特征。机器人不需要营养、不呼吸、不能生长和繁殖，没有新陈代谢，所以不是生物。" },
  { id: "u1c1-011", t: "s", d: 1, kp: "生物的特征", q: "猎豹奋力追捕羚羊，这一现象说明", o: ["生物的生活需要营养", "生物能进行呼吸", "生物能生长和发育", "生物有遗传和变异的特性"], a: 0, e: "猎豹捕食羚羊是为了获取食物，说明生物的生活需要营养。" },
  { id: "u1c1-012", t: "s", d: 1, kp: "生物与非生物", q: "下列现象中，属于生命现象的是", o: ["蝌蚪发育成青蛙", "铁锅生锈", "钟乳石慢慢长大", "冰雪融化"], a: 0, e: "蝌蚪发育成青蛙体现了生物能生长和发育，是生命现象；其余都是非生物的自然现象。" },
  { id: "u1c1-013", t: "s", d: 1, kp: "生物的特征", q: "“龙生龙，凤生凤，老鼠的儿子会打洞”描述的是生物的", o: ["遗传现象", "变异现象", "生长现象", "繁殖现象"], a: 0, e: "后代与亲代相似，是遗传现象。" },
  { id: "u1c1-014", t: "s", d: 2, kp: "生物的特征", q: "含羞草的叶片受到触碰会合拢，人的手碰到烫的东西会立刻缩回。这两种现象共同说明", o: ["生物能对外界刺激作出反应", "生物都有神经系统", "生物能生长和繁殖", "生物的生活需要营养"], a: 0, e: "两者都是对外界刺激作出的反应。含羞草是植物，没有神经系统，但同样能对刺激作出反应。", tags: ["易错"] },
  { id: "u1c1-015", t: "s", d: 1, kp: "观察与调查", q: "下列关于观察的叙述，**错误**的是", o: ["观察时只能用肉眼，不能借助仪器", "观察要有明确的目的", "观察时要全面、细致、实事求是", "观察时要及时做好记录"], a: 0, e: "观察可以直接用肉眼，也可以借助放大镜、显微镜、照相机等仪器或工具。" },
  { id: "u1c1-016", t: "s", d: 1, kp: "观察与调查", q: "我国每十年进行一次全国人口普查，这主要运用的科学方法是", o: ["调查法", "实验法", "分类法", "比较法"], a: 0, e: "人口普查是对全国人口逐一进行调查，属于调查法中的全面调查（普查）。" },
  { id: "u1c1-017", t: "s", d: 2, kp: "观察与调查", q: "要了解一大片森林中松树的数量，由于范围太大，不可能逐一统计，常采用的方法是", o: ["抽样调查", "全面调查", "实验法", "模型法"], a: 0, e: "调查范围很大时，常从调查对象中选取一部分作为样本进行调查，再推算整体情况，这叫抽样调查。" },
  { id: "u1c1-018", t: "s", d: 1, kp: "观察与调查", q: "同学们调查校园里的生物，下列做法**不正确**的是", o: ["只记录自己喜欢的生物", "如实记录看到的生物", "不认识的生物也要记录下来", "注意安全，不伤害动植物"], a: 0, e: "调查时要如实记录，不能凭个人喜好取舍；不认识的生物可以先记下特征再查资料；同时注意安全，爱护生物和环境。" },
  { id: "u1c1-019", t: "s", d: 1, kp: "生物的归类", q: "把调查到的生物分为水生生物和陆生生物，依据的是", o: ["生物的生活环境", "生物的形态结构", "生物的用途", "生物的个体大小"], a: 0, e: "按生活环境可以把生物分为水生生物和陆生生物。" },
  { id: "u1c1-020", t: "s", d: 1, kp: "生物的归类", q: "把生物分为作物、家禽、家畜、宠物等，依据的是", o: ["生物的用途", "生物的形态结构", "生物的生活环境", "生物的繁殖方式"], a: 0, e: "按用途可以把生物分为作物、家禽、家畜、宠物等。" },
  { id: "u1c1-021", t: "s", d: 2, kp: "科学探究", q: "科学探究的一般过程是：①作出假设　②提出问题　③实施计划　④得出结论　⑤制订计划　⑥表达和交流。正确的顺序是", o: ["②①⑤③④⑥", "①②⑤③④⑥", "②⑤①③④⑥", "②①③⑤④⑥"], a: 0, e: "科学探究一般从发现并提出问题开始，再作出假设、制订计划、实施计划、得出结论，最后表达和交流。" },
  { id: "u1c1-022", t: "s", d: 1, kp: "科学探究", q: "在科学探究中，“作出假设”是指", o: ["根据已有知识和经验，对提出的问题作出尝试性的回答", "对实验结果的最终解释", "实验中观察到的现象", "实验结束后的总结"], a: 0, e: "假设是对问题的一种尝试性回答，需要通过实验来检验，它不一定正确。" },
  { id: "u1c1-023", t: "s", d: 2, kp: "科学探究", q: "某同学的实验结果与自己的假设不一致，他应该", o: ["检查实验过程，重新实验或作出新的假设", "修改实验数据，使其与假设一致", "放弃这个探究", "直接把假设当作结论"], a: 0, e: "实验结果与假设不符时，应实事求是，检查实验设计和操作，重复实验，或者修正假设后再探究，绝不能篡改数据。" },
  { id: "u1c1-024", t: "s", d: 2, kp: "科学探究", q: "设计对照实验时，除了要研究的条件不同外，其他条件都应", o: ["相同且适宜", "各不相同", "越多越好", "随意设置"], a: 0, e: "对照实验要控制单一变量：除实验变量外，其他条件都相同且适宜，这样实验结果的不同才能说明是由该变量引起的。" },
  { id: "u1c1-025", t: "s", d: 2, kp: "科学探究", q: "在探究实验中，实验材料要有一定的数量（如用多只动物、多粒种子），并且要重复实验，目的是", o: ["避免偶然性，减小实验误差", "使实验更热闹", "缩短实验时间", "节约实验材料"], a: 0, e: "只用一个样本或只做一次实验，结果可能受偶然因素影响；增加样本数量、重复实验并取平均值，可以减小误差，使结论更可靠。", tags: ["实验", "高频"] },
  { id: "u1c1-026", t: "s", d: 2, kp: "科学探究", q: "小明发现下大雨后，很多蚯蚓爬到了地面上。根据这一现象，最适合提出的探究问题是", o: ["土壤中的水分过多会影响蚯蚓的生活吗？", "蚯蚓喜欢在地面上生活。", "蚯蚓是益虫吗？", "雨后的空气很清新。"], a: 0, e: "提出的问题应该与观察到的现象相关，用疑问句表述，并且能通过探究来解决。“蚯蚓喜欢在地面上生活”是陈述句，属于假设或结论。", tags: ["情境"] },
  { id: "u1c1-027", t: "s", d: 2, kp: "科学探究", q: "下列研究活动中，主要运用了实验法的是", o: ["设置有光和无光两种环境，比较鼠妇的分布", "到公园记录鸟类的种类和数量", "用放大镜观察蚂蚁的触角", "查阅资料了解大熊猫的食性"], a: 0, e: "实验法要人为控制条件、设置对照。设置有光、无光两种环境研究鼠妇分布属于实验法；记录鸟类属于调查法；用放大镜看蚂蚁属于观察法；查阅资料属于文献法（资料分析）。" },
  { id: "u1c1-028", t: "s", d: 1, kp: "生物的特征", q: "植物的茎总是朝着有光的方向弯曲生长，这体现了", o: ["生物能对外界刺激作出反应", "生物能排出废物", "生物有遗传特性", "生物能进行呼吸"], a: 0, e: "植物的向光性是对光照刺激作出的反应。" },
  { id: "u1c1-029", t: "s", d: 2, kp: "生物的特征", q: "生石花外形像石头，下列能证明它是生物的事实是", o: ["它能开花、结出种子", "它的颜色和石块相近", "它长在岩石缝里", "它摸起来比较硬"], a: 0, e: "能开花、结种子说明它能繁殖，具有生物的特征；颜色、生长位置和硬度都不能作为判断是否为生物的依据。", tags: ["情境"] },
  { id: "u1c1-030", t: "s", d: 1, kp: "科学探究", q: "测量时多次测量后取平均值，主要是为了", o: ["减小误差", "增加工作量", "使数据更整齐", "得到想要的结果"], a: 0, e: "多次测量取平均值能减小偶然误差，使数据更接近真实值。" },
  { id: "u1c1-031", t: "s", d: 2, kp: "生物与非生物", q: "下列各组中，全部属于生物的一组是", o: ["蘑菇、病毒、珊瑚虫", "珊瑚、海带、蜗牛", "机器人、蚂蚁、小麦", "钟乳石、青蛙、细菌"], a: 0, e: "蘑菇是真菌，病毒、珊瑚虫都是生物。珊瑚（珊瑚礁）、机器人、钟乳石都不是生物。" },
  { id: "u1c1-032", t: "s", d: 2, kp: "生物的特征", q: "小狗从出生到长大，体形变大，并逐渐具有繁殖能力。这体现了生物能", o: ["生长、发育", "对刺激作出反应", "排出废物", "进行呼吸"], a: 0, e: "体形变大属于生长，逐渐具有繁殖能力属于发育。新教材把这一特征表述为“生物能生长、发育和繁殖”。" },

  /* 判断题 */
  { id: "u1c1-j01", t: "j", d: 1, kp: "生物与非生物", q: "能运动的物体都是生物。", a: false, e: "汽车、机器人能运动，但不是生物；很多植物不能自由运动，却是生物。" },
  { id: "u1c1-j02", t: "j", d: 1, kp: "生物的特征", q: "所有生物都是由细胞构成的。", a: false, e: "病毒没有细胞结构。除病毒以外，生物都是由细胞构成的。" },
  { id: "u1c1-j03", t: "j", d: 1, kp: "生物与非生物", q: "病毒没有细胞结构，但它属于生物。", a: true, e: "病毒能在活细胞中繁殖，具有生命现象。" },
  { id: "u1c1-j04", t: "j", d: 2, kp: "生物的特征", q: "植物没有神经系统，所以不能对外界刺激作出反应。", a: false, e: "植物也能对刺激作出反应，如向光生长、含羞草的叶受触碰后合拢。" },
  { id: "u1c1-j05", t: "j", d: 2, kp: "生物的特征", q: "绿色植物能自己制造有机物，所以不需要从外界获取任何物质。", a: false, e: "绿色植物制造有机物需要从外界吸收水、无机盐和二氧化碳，还需要光。" },
  { id: "u1c1-j06", t: "j", d: 1, kp: "观察与调查", q: "观察时如果看到的结果与书上不同，可以按书上的内容修改记录。", a: false, e: "观察要实事求是，如实记录，再分析原因。" },
  { id: "u1c1-j07", t: "j", d: 1, kp: "科学探究", q: "科学探究得出的结论一定与假设一致。", a: false, e: "假设只是尝试性的回答，实验结论可能支持假设，也可能否定假设。" },
  { id: "u1c1-j08", t: "j", d: 2, kp: "科学探究", q: "一组对照实验中，通常只有一个变量。", a: true, e: "对照实验遵循单一变量原则，才能说明结果差异是由这个变量引起的。" },
  { id: "u1c1-j09", t: "j", d: 1, kp: "生物的特征", q: "生物都能进行呼吸。", a: true, e: "呼吸是生物的基本特征之一。" },
  { id: "u1c1-j10", t: "j", d: 1, kp: "生物的特征", q: "植物落叶能带走体内的一部分废物。", a: true, e: "植物通过落叶可以排出部分代谢废物。" },

  /* 非选择题 */
  {
    id: "u1c1-c01", t: "c", ct: "资料", d: 1, kp: "生物的特征",
    title: "阅读资料，回答问题。",
    m: "资料一：含羞草的叶片受到触碰时，会迅速合拢下垂。\n资料二：校园里的小树苗，几年后长成了大树，春天开花，秋天结果。\n资料三：一只花猫生了四只小猫，小猫的毛色都和母猫相似，但彼此之间又有些差异。\n资料四：病毒没有细胞结构，只能寄生在活细胞里，利用细胞内的物质制造出新的病毒。",
    subs: [
      { t: "f", q: "资料一说明生物能____。", a: ["对外界刺激作出反应", "对刺激作出反应", "对外界刺激做出反应", "对刺激做出反应"], p: 2 },
      { t: "f", q: "资料二说明生物能____。", a: ["生长、发育和繁殖", "生长和繁殖", "生长发育繁殖"], p: 2 },
      { t: "s", q: "资料三中“小猫的毛色和母猫相似”“彼此之间又有些差异”分别体现了", o: ["遗传；变异", "变异；遗传", "遗传；遗传", "变异；变异"], a: 0, p: 2 },
      { t: "s", q: "资料四中的病毒属于生物，理由是", o: ["能繁殖产生新的病毒", "具有细胞结构", "能自由运动", "能进行光合作用"], a: 0, p: 2 }
    ],
    e: "判断是否为生物，要看它是否具有营养、呼吸、排出废物、对刺激作出反应、生长发育和繁殖、遗传和变异等生物的特征。"
  },
  {
    id: "u1c1-c02", t: "c", ct: "实验", d: 2, kp: "科学探究",
    title: "小明发现大雨过后，很多蚯蚓爬到了地面上。他设计了如下实验：在一个长方形纸盒的一侧铺上干燥的土壤，另一侧铺上湿润的土壤，在纸盒中央放入10条大小、活力相近的蚯蚓，盖上盖子，10分钟后统计两侧蚯蚓的数量。重复实验3次，结果湿润一侧平均有8条，干燥一侧平均有2条。",
    subs: [
      { t: "s", q: "小明提出的探究问题最可能是", o: ["土壤的湿度会影响蚯蚓的分布吗？", "蚯蚓喜欢潮湿的土壤。", "蚯蚓用什么器官呼吸？", "光照会影响蚯蚓的生活吗？"], a: 0, p: 2 },
      { t: "f", q: "该实验的变量是____。", a: ["土壤湿度", "土壤的湿度", "湿度", "水分", "土壤中的水分", "土壤含水量"], p: 2 },
      { t: "s", q: "实验中用10条蚯蚓而不用1条，并重复实验3次，目的是", o: ["避免偶然性，使结果更可靠", "节省实验时间", "便于观察蚯蚓的形态", "让蚯蚓互相作伴"], a: 0, p: 2 },

  { id: "u1c3-004", t: "s", d: 2, kp: "细胞分裂", q: "植物细胞分裂的最后阶段，在原来细胞的中央形成", o: ["新的细胞膜和细胞壁", "新的细胞核", "新的液泡", "新的叶绿体"], a: 0, e: "植物细胞分裂时，最后在细胞中央形成新的细胞膜和细胞壁；动物细胞则是细胞膜从中部向内凹陷，缢裂为两个细胞。", tags: ["易错"] },
  { id: "u1c3-005", t: "s", d: 2, kp: "细胞分裂", q: "人的体细胞中有46条染色体，一个体细胞连续分裂两次后，形成的每个新细胞中染色体数目是", o: ["46条", "23条", "92条", "184条"], a: 0, e: "细胞分裂时染色体先复制加倍，再平均分到两个新细胞中，所以新细胞与原细胞染色体的形态和数目都相同，仍是46条。", tags: ["高频", "易错"] },
  { id: "u1c3-006", t: "s", d: 2, kp: "细胞分裂", q: "细胞分裂时，染色体的变化最明显。保证新细胞和原细胞遗传物质相同的原因是", o: ["染色体先复制加倍，再平均分配到两个新细胞中", "染色体先减半，再加倍", "新细胞的染色体是重新合成的", "染色体只进入其中一个新细胞"], a: 0, e: "染色体复制加倍后平均分配，新细胞与原细胞的染色体形态、数目相同，遗传物质也相同。" },
  { id: "u1c3-007", t: "s", d: 2, kp: "细胞分裂", q: "染色体主要由哪两种物质组成", o: ["DNA和蛋白质", "DNA和糖类", "蛋白质和脂类", "水和无机盐"], a: 0, e: "染色体存在于细胞核中，主要由DNA和蛋白质组成，DNA是主要的遗传物质。" },
  { id: "u1c3-008", t: "s", d: 2, kp: "细胞分裂", q: "一个细胞连续分裂3次后，形成的细胞数目是", o: ["8个", "6个", "3个", "9个"], a: 0, e: "1个细胞分裂1次变2个，分裂n次变成2ⁿ个，分裂3次为2³=8个。" },
  { id: "u1c3-009", t: "s", d: 3, kp: "细胞分裂", q: "癌细胞与正常细胞相比，主要特点是", o: ["不断分裂而不分化，并能转移", "不能分裂", "只分化不分裂", "体积比正常细胞大很多倍"], a: 0, e: "癌细胞失去了正常的调控，不断分裂而不分化，还会侵入、转移到其他组织器官。" },
  { id: "u1c3-010", t: "s", d: 2, kp: "细胞分裂", q: "细胞不能无限长大，长到一定大小时就会进行", o: ["分裂", "分化", "死亡", "癌变"], a: 0, e: "细胞生长到一定程度会分裂成两个细胞。" },

  /* —— 细胞分化与组织 —— */
  { id: "u1c3-011", t: "s", d: 1, kp: "细胞分化", q: "细胞分化的结果是形成", o: ["组织", "器官", "系统", "更多的细胞"], a: 0, e: "细胞分化使细胞在形态、结构和功能上产生差异，形成了不同的组织。", tags: ["高频"] },
  { id: "u1c3-012", t: "s", d: 2, kp: "细胞分化", q: "下列关于细胞分化的叙述，正确的是", o: ["分化后的细胞在形态、结构和功能上出现差异", "分化使细胞数目增多", "分化后细胞的遗传物质发生改变", "分化使细胞体积增大"], a: 0, e: "细胞分化不改变遗传物质，也不增加细胞数目，而是使细胞形态、结构和功能发生差异性变化。" },
  { id: "u1c3-013", t: "s", d: 1, kp: "动物的组织", q: "人体的皮肤表皮、口腔上皮、消化道内表面主要由哪种组织构成", o: ["上皮组织", "肌肉组织", "神经组织", "结缔组织"], a: 0, e: "上皮组织由密集的上皮细胞构成，具有保护、分泌等功能，分布在体表和各种管腔的内表面。" },
  { id: "u1c3-014", t: "s", d: 1, kp: "动物的组织", q: "血液属于哪种组织", o: ["结缔组织", "上皮组织", "肌肉组织", "神经组织"], a: 0, e: "血液、骨、软骨、肌腱、脂肪等都属于结缔组织，具有支持、连接、保护、营养等功能。", tags: ["易错", "高频"] },
  { id: "u1c3-015", t: "s", d: 1, kp: "动物的组织", q: "能够接受刺激、产生和传导兴奋的组织是", o: ["神经组织", "肌肉组织", "上皮组织", "结缔组织"], a: 0, e: "神经组织主要由神经细胞构成，能接受刺激，产生和传导兴奋。" },
  { id: "u1c3-016", t: "s", d: 1, kp: "动物的组织", q: "心脏能有节律地收缩和舒张，主要是因为心脏壁中有大量的", o: ["肌肉组织", "神经组织", "上皮组织", "结缔组织"], a: 0, e: "肌肉组织主要由肌细胞构成，具有收缩、舒张功能，心脏壁主要由心肌构成。" },
  { id: "u1c3-017", t: "s", d: 2, kp: "动物的组织", q: "肌腱和骨属于", o: ["结缔组织", "肌肉组织", "上皮组织", "神经组织"], a: 0, e: "骨、软骨、肌腱、韧带、血液、脂肪等都属于结缔组织。肌腱虽连在肌肉两端，但不是肌肉组织。", tags: ["易错"] },
  { id: "u1c3-018", t: "s", d: 1, kp: "植物的组织", q: "植物根尖的分生区、茎中的形成层，主要由哪种组织构成", o: ["分生组织", "保护组织", "薄壁组织", "输导组织"], a: 0, e: "分生组织的细胞小、细胞核大、细胞质浓，具有很强的分裂能力，能不断产生新细胞。" },
  { id: "u1c3-019", t: "s", d: 1, kp: "植物的组织", q: "剥下的番茄果皮属于哪种组织", o: ["保护组织", "薄壁组织", "输导组织", "分生组织"], a: 0, e: "果皮、叶的表皮等位于植物体表面，起保护作用，属于保护组织。" },
  { id: "u1c3-020", t: "s", d: 2, kp: "植物的组织", q: "番茄的果肉细胞壁薄、液泡大，能储存营养物质。新教材把这种组织称为", o: ["薄壁组织", "保护组织", "分生组织", "机械组织"], a: 0, e: "新教材把储存营养物质的组织称为薄壁组织（旧称营养组织），如果肉、叶肉。含叶绿体的薄壁组织还能进行光合作用。" },
  { id: "u1c3-021", t: "s", d: 2, kp: "植物的组织", q: "橘子剥皮后，果肉表面有一些白色的“丝络”，它们属于", o: ["输导组织", "保护组织", "薄壁组织", "分生组织"], a: 0, e: "橘络中有导管和筛管，能运输水、无机盐和有机物，属于输导组织。", tags: ["情境"] },
  { id: "u1c3-022", t: "s", d: 2, kp: "植物的组织", q: "植物体内运输水和无机盐的导管、运输有机物的筛管，属于", o: ["输导组织", "分生组织", "保护组织", "薄壁组织"], a: 0, e: "导管和筛管属于输导组织，贯穿根、茎、叶等器官。" },

  /* —— 器官、系统、结构层次 —— */
  { id: "u1c3-023", t: "s", d: 1, kp: "动物体的结构层次", q: "人体的结构层次由小到大依次是", o: ["细胞→组织→器官→系统→人体", "细胞→器官→组织→系统→人体", "组织→细胞→器官→系统→人体", "细胞→组织→系统→器官→人体"], a: 0, e: "人和动物体的结构层次：细胞→组织→器官→系统→个体。" },
  { id: "u1c3-024", t: "s", d: 1, kp: "植物体的结构层次", q: "与动物体相比，植物体的结构层次中没有", o: ["系统", "器官", "组织", "细胞"], a: 0, e: "植物体的结构层次是细胞→组织→器官→植物体，没有系统。", tags: ["高频"] },
  { id: "u1c3-025", t: "s", d: 1, kp: "动物体的结构层次", q: "下列结构中，属于器官的是", o: ["胃", "血液", "肌肉细胞", "消化系统"], a: 0, e: "胃由上皮组织、肌肉组织、神经组织、结缔组织等构成，属于器官。血液是结缔组织，消化系统属于系统层次。" },
  { id: "u1c3-026", t: "s", d: 2, kp: "动物体的结构层次", q: "皮肤是人体最大的器官，它含有的组织**不包括**", o: ["输导组织", "上皮组织", "结缔组织", "神经组织"], a: 0, e: "皮肤由上皮组织（表皮）、结缔组织（真皮、血液）、神经组织（神经末梢）、肌肉组织等构成。输导组织是植物的组织。", tags: ["易错"] },
  { id: "u1c3-027", t: "s", d: 1, kp: "植物体的结构层次", q: "绿色开花植物的六大器官中，属于生殖器官的是", o: ["花、果实、种子", "根、茎、叶", "根、花、种子", "茎、叶、果实"], a: 0, e: "根、茎、叶属于营养器官，花、果实、种子属于生殖器官。" },
  { id: "u1c3-028", t: "s", d: 2, kp: "植物体的结构层次", q: "我们平时吃的花生、绿豆，属于植物的哪种器官", o: ["种子", "果实", "根", "茎"], a: 0, e: "花生仁、绿豆都是种子（花生壳是果皮，整个花生是果实）。", tags: ["易错"] },
  { id: "u1c3-029", t: "s", d: 2, kp: "植物体的结构层次", q: "一株番茄的结构层次可表示为", o: ["细胞→组织→器官→植物体", "细胞→器官→组织→植物体", "细胞→组织→器官→系统→植物体", "组织→细胞→器官→植物体"], a: 0, e: "番茄是植物，没有系统这一层次。" },
  { id: "u1c3-030", t: "s", d: 2, kp: "动物体的结构层次", q: "人体内能够共同完成消化和吸收功能的口腔、食道、胃、小肠等器官构成了", o: ["消化系统", "消化器官", "消化组织", "消化道细胞"], a: 0, e: "多个器官按照一定次序组合在一起，共同完成一种或几种生理功能，就构成了系统。" },
  { id: "u1c3-031", t: "s", d: 2, kp: "动物体的结构层次", q: "一棵桃树和一只小狗，在结构层次上的区别是", o: ["桃树没有系统", "小狗没有器官", "桃树没有组织", "小狗没有细胞"], a: 0, e: "植物体没有系统，动物体有系统。" },

  /* —— 单细胞生物 —— */
  { id: "u1c3-032", t: "s", d: 1, kp: "单细胞生物", q: "草履虫在水中旋转前进，依靠的是", o: ["纤毛的摆动", "伸缩泡的收缩", "鞭毛的摆动", "表膜的伸缩"], a: 0, e: "草履虫依靠纤毛的摆动在水中旋转前进。" },
  { id: "u1c3-033", t: "s", d: 1, kp: "单细胞生物", q: "草履虫进行呼吸（摄入氧、排出二氧化碳）的结构是", o: ["表膜", "口沟", "伸缩泡", "胞肛"], a: 0, e: "草履虫通过表膜摄入氧，排出二氧化碳。" },
  { id: "u1c3-034", t: "s", d: 2, kp: "单细胞生物", q: "草履虫体内多余的水分和含氮废物，主要通过哪个结构排出体外", o: ["收集管和伸缩泡", "口沟", "胞肛", "纤毛"], a: 0, e: "收集管把多余的水分和废物收集起来，送入伸缩泡，再由伸缩泡排出体外。胞肛排出的是不能消化的食物残渣。", tags: ["易错"] },
  { id: "u1c3-035", t: "s", d: 2, kp: "单细胞生物", q: "观察草履虫时，应从培养液的哪个部位吸取，原因是什么", o: ["表层，因为表层氧气多，草履虫多", "底层，因为底层食物多", "中层，因为中层温度适宜", "任意部位，草履虫分布均匀"], a: 0, e: "草履虫需要氧气，培养液表层含氧多，草履虫聚集在表层，从表层取样更容易找到。", tags: ["实验"] },
  { id: "u1c3-036", t: "s", d: 2, kp: "单细胞生物", q: "观察草履虫时，常在载玻片的培养液中放几丝棉花纤维，目的是", o: ["限制草履虫的运动，便于观察", "给草履虫提供食物", "增加氧气", "给草履虫保温"], a: 0, e: "草履虫运动很快，棉花纤维可以限制它的运动范围，便于观察。", tags: ["实验"] },
  { id: "u1c3-037", t: "s", d: 2, kp: "单细胞生物", q: "下列生物中，身体只由一个细胞构成的一组是", o: ["草履虫、衣藻、酵母菌", "草履虫、蘑菇、衣藻", "酵母菌、水绵、蚯蚓", "变形虫、海带、细菌"], a: 0, e: "草履虫、衣藻、酵母菌、变形虫、眼虫、细菌都是单细胞生物；蘑菇、水绵、海带、蚯蚓是多细胞生物。", tags: ["高频"] },
  { id: "u1c3-038", t: "s", d: 3, kp: "单细胞生物", q: "在载玻片两端各滴一滴草履虫培养液并连通，在左侧液滴边缘放少许食盐，草履虫的反应是", o: ["向右侧（远离食盐的一侧）移动", "向左侧（食盐一侧）移动", "停止不动", "立即死亡"], a: 0, e: "食盐对草履虫是有害刺激，草履虫会逃避有害刺激，向远离食盐的一侧移动。这说明单细胞生物也能对外界刺激作出反应，趋利避害。", tags: ["实验"] },
  { id: "u1c3-039", t: "s", d: 2, kp: "单细胞生物", q: "一只草履虫每天大约能吞食43000个细菌，这说明草履虫", o: ["对污水有一定的净化作用", "会传播疾病", "能进行光合作用", "是多细胞生物"], a: 0, e: "草履虫能吞食细菌，对污水有一定的净化作用；它还是鱼类的天然饵料。" },
  { id: "u1c3-040", t: "s", d: 2, kp: "单细胞生物", q: "关于单细胞生物的叙述，**错误**的是", o: ["单细胞生物不能独立完成生命活动", "整个身体只由一个细胞构成", "能够趋利避害，适应环境", "有的对人类有利，有的对人类有害"], a: 0, e: "单细胞生物虽然只由一个细胞构成，但能独立完成营养、呼吸、排泄、运动、生殖和调节等生命活动。" },
  { id: "u1c3-041", t: "s", d: 2, kp: "单细胞生物", q: "衣藻细胞中有叶绿体，它的营养方式是", o: ["能进行光合作用，自己制造有机物", "只能吞食细菌", "寄生在其他生物体内", "靠分解动植物遗体生活"], a: 0, e: "衣藻是单细胞藻类，含有叶绿体，能进行光合作用。" },
  { id: "u1c3-042", t: "s", d: 2, kp: "制作细胞模型", q: "用材料制作植物细胞模型时，最适合用来表示细胞壁的是", o: ["较硬的透明塑料盒", "柔软的保鲜膜", "一颗葡萄", "几粒绿豆"], a: 0, e: "细胞壁较坚韧，有支持作用，可以用较硬的盒子表示；保鲜膜薄而软，更适合表示细胞膜；葡萄可表示细胞核，绿豆可表示叶绿体。", tags: ["跨学科"] },
  { id: "u1c3-043", t: "s", d: 2, kp: "制作细胞模型", q: "评价一个动物细胞模型是否科学，下列说法中最应该指出的问题是", o: ["模型中有细胞壁和大液泡", "模型的颜色比较鲜艳", "模型用的是废旧材料", "模型做得比较大"], a: 0, e: "动物细胞没有细胞壁，一般也没有大液泡，模型首先要保证科学性；颜色、材料、大小属于美观和成本方面的问题。", tags: ["跨学科"] },

  /* 判断题 */
  { id: "u1c3-j01", t: "j", d: 1, kp: "细胞分裂", q: "细胞分裂时，细胞质先分裂，细胞核后分裂。", a: false, e: "细胞核先分裂。" },
  { id: "u1c3-j02", t: "j", d: 2, kp: "细胞分裂", q: "细胞分裂产生的新细胞与原细胞染色体的形态和数目相同。", a: true, e: "染色体复制加倍后平均分配到两个新细胞中。" },
  { id: "u1c3-j03", t: "j", d: 2, kp: "细胞分化", q: "细胞分化会使细胞的遗传物质发生改变。", a: false, e: "细胞分化只改变细胞的形态、结构和功能，遗传物质不变。" },
  { id: "u1c3-j04", t: "j", d: 1, kp: "动物的组织", q: "血液是一种流动的组织，属于结缔组织。", a: true, e: "血液由血浆和血细胞组成，属于结缔组织。" },
  { id: "u1c3-j05", t: "j", d: 1, kp: "植物体的结构层次", q: "植物体的结构层次中没有系统。", a: true, e: "植物体：细胞→组织→器官→植物体。" },
  { id: "u1c3-j06", t: "j", d: 2, kp: "动物体的结构层次", q: "皮肤是由上皮组织构成的组织。", a: false, e: "皮肤由多种组织构成，属于器官。" },
  { id: "u1c3-j07", t: "j", d: 1, kp: "单细胞生物", q: "单细胞生物只由一个细胞构成，不能独立生活。", a: false, e: "单细胞生物能独立完成各项生命活动。" },
  { id: "u1c3-j08", t: "j", d: 2, kp: "单细胞生物", q: "草履虫的伸缩泡能排出不能消化的食物残渣。", a: false, e: "食物残渣由胞肛排出，伸缩泡排出多余的水分和废物。" },

  { id: "u2c2-019", t: "s", d: 1, kp: "节肢动物", q: "动物界中种类最多、分布最广的类群是", o: ["节肢动物", "软体动物", "环节动物", "鱼"], a: 0, e: "节肢动物是动物界中种类最多的类群，其中昆虫的种类又最多。" },
  { id: "u2c2-020", t: "s", d: 1, kp: "节肢动物", q: "节肢动物的主要特征是", o: ["体表有坚韧的外骨骼，身体和附肢都分节", "身体柔软，有外套膜", "身体由相似的体节组成，有刚毛", "身体呈两侧对称，背腹扁平"], a: 0, e: "节肢动物体表有外骨骼，身体和附肢（如足、触角）都分节。", tags: ["高频"] },
  { id: "u2c2-021", t: "s", d: 2, kp: "节肢动物", q: "蝗虫的外骨骼**不具有**的作用是", o: ["随身体长大而长大", "保护内部柔软器官", "支持身体", "防止体内水分蒸发"], a: 0, e: "外骨骼能保护和支持内部柔软器官，防止水分蒸发，但不能随身体生长而长大，所以蝗虫在生长过程中有蜕皮现象。", tags: ["易错", "高频"] },
  { id: "u2c2-022", t: "s", d: 2, kp: "节肢动物", q: "把蝗虫的头部浸没在水中，它不会窒息死亡；而把它的胸部和腹部浸没在水中，它很快会死亡。这是因为", o: ["气门位于胸部和腹部", "蝗虫用头部呼吸", "蝗虫的口在腹部", "蝗虫怕水"], a: 0, e: "蝗虫的气门分布在胸部和腹部，是气体进出身体的门户，浸在水中气门被堵住，蝗虫就会窒息。", tags: ["实验"] },
  { id: "u2c2-023", t: "s", d: 2, kp: "节肢动物", q: "下列动物中，属于昆虫的是", o: ["蜜蜂", "蜘蛛", "虾", "蜈蚣"], a: 0, e: "昆虫身体分头、胸、腹三部分，一般有三对足、两对翅、一对触角。蜘蛛有四对足、无翅，虾属于甲壳类，蜈蚣属于多足类，它们都是节肢动物但不是昆虫。", tags: ["易错", "高频"] },
  { id: "u2c2-024", t: "s", d: 2, kp: "节肢动物", q: "昆虫的足和翅着生在身体的", o: ["胸部", "头部", "腹部", "头部和胸部"], a: 0, e: "昆虫的胸部有三对足，一般还有两对翅，是运动中心。" },
  { id: "u2c2-025", t: "s", d: 2, kp: "节肢动物", q: "蝗虫进行气体交换的场所是", o: ["气管", "气门", "鳃", "肺"], a: 0, e: "气门是气体进出的门户，真正进行气体交换的场所是体内的气管。", tags: ["易错"] },

  /* —— 鱼 —— */
  { id: "u2c2-026", t: "s", d: 1, kp: "鱼", q: "鱼在水中呼吸的器官是", o: ["鳃", "肺", "皮肤", "鳔"], a: 0, e: "鱼用鳃呼吸。鳃丝中密布毛细血管，所以新鲜的鳃呈鲜红色。" },
  { id: "u2c2-027", t: "s", d: 2, kp: "鱼", q: "鱼的口和鳃盖后缘交替张合，从鳃盖后缘流出的水与从口流入的水相比", o: ["氧气减少，二氧化碳增多", "氧气增多，二氧化碳减少", "氧气和二氧化碳都增多", "成分没有变化"], a: 0, e: "水流经鳃时，水中的氧气进入鳃丝的毛细血管，血液中的二氧化碳进入水中，所以流出的水氧气减少、二氧化碳增多。", tags: ["高频"] },
  { id: "u2c2-028", t: "s", d: 2, kp: "鱼", q: "鱼在水中游泳时，前进的动力主要来自", o: ["尾部和躯干部的摆动", "胸鳍和腹鳍的摆动", "背鳍的摆动", "鳃盖的张合"], a: 0, e: "鱼通过尾部和躯干部的左右摆动产生前进的动力，鳍起协调作用。" },
  { id: "u2c2-029", t: "s", d: 2, kp: "鱼", q: "鱼身体两侧各有一条侧线，它的作用是", o: ["感知水流、测定方向", "协助呼吸", "保持身体平衡", "产生前进的动力"], a: 0, e: "侧线能感知水流和测定方向，是鱼的感觉器官。" },
  { id: "u2c2-030", t: "s", d: 1, kp: "鱼", q: "下列动物中，真正属于鱼的是", o: ["鲨鱼", "鲸鱼", "鳄鱼", "鲍鱼"], a: 0, e: "鲨鱼用鳃呼吸、靠鳍游泳，属于鱼。鲸是哺乳动物，鳄鱼是爬行动物，鲍鱼是软体动物。", tags: ["易错", "高频"] },
  { id: "u2c2-031", t: "s", d: 2, kp: "鱼", q: "鱼的身体多呈流线型，体表有鳞片并覆有黏液，这些特点有利于", o: ["减小游泳时水的阻力", "进行呼吸", "感知水流", "保持体温恒定"], a: 0, e: "流线型体形和黏液都能减小游泳时水的阻力。" },

  /* —— 两栖、爬行 —— */
  { id: "u2c2-032", t: "s", d: 1, kp: "两栖动物", q: "青蛙属于两栖动物，下列关于其呼吸的叙述正确的是", o: ["幼体用鳃呼吸，成体用肺呼吸，皮肤可辅助呼吸", "幼体和成体都用肺呼吸", "幼体用肺呼吸，成体用鳃呼吸", "一生都只用皮肤呼吸"], a: 0, e: "两栖动物幼体（蝌蚪）生活在水中，用鳃呼吸；成体大多生活在陆地上，用肺呼吸，皮肤裸露湿润，可辅助呼吸。", tags: ["高频"] },
  { id: "u2c2-033", t: "s", d: 2, kp: "两栖动物", q: "大鲵俗称“娃娃鱼”，它属于", o: ["两栖动物", "鱼", "爬行动物", "哺乳动物"], a: 0, e: "大鲵幼体用鳃呼吸，成体用肺呼吸、皮肤辅助呼吸，属于两栖动物，是我国二级保护动物。", tags: ["易错"] },
  { id: "u2c2-034", t: "s", d: 2, kp: "爬行动物", q: "爬行动物是真正适应陆地生活的脊椎动物，最主要的原因是", o: ["生殖和发育摆脱了对水的依赖", "用肺呼吸", "体表有鳞片或甲", "能在陆地上爬行"], a: 0, e: "爬行动物在陆地上产卵，卵表面有坚韧的卵壳，生殖和发育摆脱了对水环境的依赖，所以成为真正的陆生脊椎动物。", tags: ["高频"] },
  { id: "u2c2-035", t: "s", d: 2, kp: "爬行动物", q: "蜥蜴体表覆盖角质的鳞片，主要作用是", o: ["减少体内水分的蒸发", "进行呼吸", "保持体温恒定", "帮助游泳"], a: 0, e: "角质的鳞片或甲既能保护身体，又能减少体内水分蒸发，适应干燥的陆地生活。" },
  { id: "u2c2-036", t: "s", d: 2, kp: "爬行动物", q: "扬子鳄是我国特有的珍稀动物，它属于", o: ["爬行动物", "两栖动物", "鱼", "哺乳动物"], a: 0, e: "扬子鳄体表有角质鳞片，用肺呼吸，在陆地产卵，属于爬行动物。" },

  /* —— 鸟、哺乳动物 —— */
  { id: "u2c2-037", t: "s", d: 2, kp: "鸟", q: "家鸽的呼吸方式是双重呼吸，这是指", o: ["每呼吸一次，在肺里进行两次气体交换", "肺和气囊都进行气体交换", "每呼吸两次，在肺里进行一次气体交换", "用肺和皮肤同时呼吸"], a: 0, e: "鸟体内有气囊辅助肺呼吸，吸气和呼气时肺内都进行气体交换。气囊本身不进行气体交换。", tags: ["易错", "高频"] },
  { id: "u2c2-038", t: "s", d: 2, kp: "鸟", q: "下列特征中，与鸟适于飞行生活**无关**的是", o: ["用喙啄取食物", "身体呈流线型", "骨骼轻薄，有的骨内部中空", "胸肌发达"], a: 0, e: "流线型可减小飞行阻力，骨骼轻可减轻体重，发达的胸肌能牵动两翼完成飞行动作；用喙取食与飞行无直接关系。" },
  { id: "u2c2-039", t: "s", d: 2, kp: "鸟", q: "鸟的胸骨上有高耸的龙骨突，它的作用是", o: ["附着发达的胸肌", "储存空气", "保护心脏", "减轻体重"], a: 0, e: "龙骨突上附着发达的胸肌，胸肌收缩牵动两翼扇动。" },
  { id: "u2c2-040", t: "s", d: 2, kp: "鸟", q: "鸟的直肠很短，能随时排出粪便，这有利于", o: ["减轻体重，适于飞行", "消化食物", "吸收营养", "保持体温"], a: 0, e: "直肠短、随时排便可以减轻体重，有利于飞行。" },
  { id: "u2c2-041", t: "s", d: 1, kp: "哺乳动物", q: "哺乳动物最主要的特征是", o: ["胎生、哺乳", "体表被毛", "用肺呼吸", "体温恒定"], a: 0, e: "胎生、哺乳是哺乳动物最主要、最独特的特征，大大提高了后代的成活率。体温恒定鸟类也有。", tags: ["高频"] },
  { id: "u2c2-042", t: "s", d: 2, kp: "哺乳动物", q: "鲸生活在海洋中，外形像鱼，但它属于哺乳动物，主要依据是", o: ["胎生、哺乳，用肺呼吸", "用鳃呼吸", "生活在水中", "体形庞大"], a: 0, e: "鲸用肺呼吸，胎生、哺乳，属于哺乳动物。", tags: ["易错"] },
  { id: "u2c2-043", t: "s", d: 2, kp: "哺乳动物", q: "家兔的牙齿分化为门齿和臼齿，没有犬齿，这与它的哪种食性相适应", o: ["植食性", "肉食性", "杂食性", "腐食性"], a: 0, e: "家兔是植食性动物，门齿切断植物，臼齿磨碎食物，没有犬齿；狼等肉食动物犬齿发达，用于撕裂食物。" },
  { id: "u2c2-044", t: "s", d: 2, kp: "哺乳动物", q: "下列动物中，属于恒温动物的一组是", o: ["家鸽和家兔", "鲫鱼和青蛙", "蜥蜴和蛇", "蚯蚓和蝗虫"], a: 0, e: "鸟类和哺乳动物体温恒定，属于恒温动物；其余都是变温动物。", tags: ["高频"] },
  { id: "u2c2-045", t: "s", d: 2, kp: "哺乳动物", q: "体温恒定对动物生存的意义是", o: ["减少了对外界环境的依赖，扩大了分布范围", "使动物能在水中生活", "使动物不需要食物", "使动物能飞行"], a: 0, e: "恒温动物能在寒冷等环境中保持体温，减少了对环境的依赖，扩大了生活和分布范围。" },
  { id: "u2c2-046", t: "s", d: 2, kp: "哺乳动物", q: "蝙蝠能在空中飞行，但它属于哺乳动物，理由是", o: ["胎生、哺乳，体表被毛", "有翼，能飞行", "用肺呼吸", "体温不恒定"], a: 0, e: "蝙蝠胎生、哺乳，体表被毛，是哺乳动物；它的“翼”是前肢间的皮膜。", tags: ["易错"] },

  /* —— 动物在生物圈中的作用 —— */
  { id: "u2c2-047", t: "s", d: 2, kp: "动物在生物圈中的作用", q: "苍耳果实表面有钩刺，常挂在动物的皮毛上被带到远处。这说明动物能", o: ["帮助植物传播种子", "帮助植物传粉", "维持生态平衡", "促进物质循环"], a: 0, e: "动物能帮助植物传播果实和种子，有利于植物扩大分布范围。" },
  { id: "u2c2-048", t: "s", d: 2, kp: "动物在生物圈中的作用", q: "在果园里放养蜜蜂可以提高果树的结果率，这是因为蜜蜂能", o: ["帮助果树传粉", "帮助果树传播种子", "给果树施肥", "消灭害虫"], a: 0, e: "蜜蜂采蜜时帮助植物传粉，提高结果率。" },
  { id: "u2c2-049", t: "s", d: 2, kp: "动物在生物圈中的作用", q: "动物作为消费者，摄取的有机物一部分通过呼吸作用分解成二氧化碳、水等物质，这说明动物能", o: ["促进生态系统的物质循环", "帮助植物传粉", "制造有机物", "帮助植物传播种子"], a: 0, e: "动物通过呼吸作用把有机物分解为无机物，粪便和遗体被分解者分解，促进了物质循环。" },
  { id: "u2c2-050", t: "s", d: 2, kp: "动物在生物圈中的作用", q: "某草原为保护羊群大量捕杀狼，结果野兔数量剧增，草场被破坏。这说明动物在", o: ["维持生态平衡中起着重要作用", "促进物质循环中作用不大", "传播种子中起重要作用", "生物圈中没有作用"], a: 0, e: "食物链中的各种生物相互制约，捕杀狼使兔失去天敌而大量繁殖，破坏了生态平衡。", tags: ["情境"] },
  { id: "u2c2-051", t: "s", d: 3, kp: "动物与人类", q: "科学家模仿蝙蝠的回声定位原理研制出了雷达，这属于", o: ["仿生", "克隆", "转基因", "发酵"], a: 0, e: "模仿生物的某些结构和功能来发明创造各种仪器设备，叫仿生。" },

  /* 判断题 */
  { id: "u2c2-j01", t: "j", d: 1, kp: "刺胞动物", q: "珊瑚虫和海蜇都属于刺胞动物。", a: true, e: "刺胞动物身体辐射对称，体表有刺细胞。" },
  { id: "u2c2-j02", t: "j", d: 2, kp: "扁形动物", q: "扁形动物有口有肛门。", a: false, e: "扁形动物有口无肛门；线虫动物才有口有肛门。" },
  { id: "u2c2-j03", t: "j", d: 1, kp: "环节动物", q: "蚯蚓用肺呼吸。", a: false, e: "蚯蚓靠湿润的体壁呼吸。" },
  { id: "u2c2-j04", t: "j", d: 2, kp: "节肢动物", q: "蜘蛛有四对足，属于昆虫。", a: false, e: "昆虫有三对足，蜘蛛不是昆虫，属于节肢动物中的蛛形类。" },
  { id: "u2c2-j05", t: "j", d: 2, kp: "节肢动物", q: "蝗虫的外骨骼不能随身体生长，所以有蜕皮现象。", a: true, e: "外骨骼限制身体生长，需要蜕皮。" },
  { id: "u2c2-j06", t: "j", d: 1, kp: "鱼", q: "鲸、鲨鱼、带鱼都属于鱼类。", a: false, e: "鲸是哺乳动物。" },
  { id: "u2c2-j07", t: "j", d: 2, kp: "两栖动物", q: "能在水中和陆地上生活的动物都是两栖动物。", a: false, e: "两栖动物指幼体在水中用鳃呼吸、成体用肺呼吸并能水陆两栖的动物；龟、鳄鱼、海豹等也能水陆生活，但不是两栖动物。" },
  { id: "u2c2-j08", t: "j", d: 2, kp: "爬行动物", q: "爬行动物的卵有坚韧的卵壳，生殖发育摆脱了对水的依赖。", a: true, e: "所以爬行动物是真正的陆生脊椎动物。" },
  { id: "u2c2-j09", t: "j", d: 2, kp: "鸟", q: "家鸽的肺和气囊都能进行气体交换。", a: false, e: "气囊只能贮存空气，辅助呼吸，不进行气体交换。" },
  { id: "u2c2-j10", t: "j", d: 1, kp: "哺乳动物", q: "胎生、哺乳大大提高了哺乳动物后代的成活率。", a: true, e: "这是哺乳动物最主要的特征。" },
  { id: "u2c2-j11", t: "j", d: 2, kp: "哺乳动物", q: "鸟类和哺乳动物都是恒温动物。", a: true, e: "体温恒定扩大了它们的分布范围。" },
  { id: "u2c2-j12", t: "j", d: 2, kp: "动物在生物圈中的作用", q: "动物能帮助植物传粉、传播种子。", a: true, e: "如蜜蜂传粉、松鼠储藏松子等。" },

  /* 非选择题 */
  {
    id: "u2c2-c01", t: "c", ct: "识图", d: 1, kp: "节肢动物", fig: "locust",

    subs: [
      { t: "s", q: "蝗虫的身体分为③④⑤三部分，它们依次是", o: ["头部、胸部、腹部", "头部、腹部、胸部", "胸部、头部、腹部", "头胸部、腹部、尾部"], a: 0, p: 2 },
      { t: "f", q: "蝗虫的运动中心是____（填序号），它上面着生三对足和两对翅。", a: ["④", "4", "④胸部", "胸部"], p: 2 },
      { t: "s", q: "图中⑧是气体进出蝗虫身体的门户，它的名称是", o: ["气门", "气管", "鳃", "肺"], a: 0, p: 2 },
      { t: "s", q: "蝗虫体表有坚韧的外骨骼，下列不是外骨骼作用的是", o: ["随身体生长而长大", "保护内部器官", "支持身体", "防止水分蒸发"], a: 0, p: 2 },
      { t: "s", q: "蝗虫属于节肢动物中的昆虫，下列动物与它同属昆虫的是", o: ["蝴蝶", "蜘蛛", "螃蟹", "蜈蚣"], a: 0, p: 2 }
    ],
    e: "昆虫的特征：身体分头、胸、腹三部分；一般有两对翅、三对足；有一对触角；体表有外骨骼。气门在胸部和腹部，气体交换在气管中进行。"
  },
  {
    id: "u2c2-c02", t: "c", ct: "识图", d: 2, kp: "鱼", fig: "fish",
    title: "下图是鲫鱼的外形示意图，请据图回答。",
    subs: [

/* =========================================================
 * 界面小部件：提示条、弹窗、确认框（不使用浏览器自带 alert/confirm）
 * ========================================================= */
const UI = {
  _toastTimer: 0,
  toast(msg, kind) {
    let el = $("#toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      document.body.appendChild(el);
    }
    el.className = "toast show " + (kind || "");
    el.textContent = msg;
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { el.className = "toast " + (kind || ""); }, 2200);
  },

  _modalStack: [],
  modal(html, opts) {
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "modal-wrap" + (opts.wide ? " wide" : "") + (opts.full ? " full" : "");
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">` +
      `${opts.title ? `<div class="modal-h"><h3>${esc(opts.title)}</h3><button type="button" class="iconbtn" data-act="closeModal" aria-label="关闭">✕</button></div>` : ""}` +
      `<div class="modal-b">${html}</div></div>`;
    wrap.addEventListener("click", e => {
      if (e.target === wrap && opts.dismiss !== false) UI.closeModal();
    });
    document.body.appendChild(wrap);
    this._modalStack.push({ el: wrap, onClose: opts.onClose });
    requestAnimationFrame(() => wrap.classList.add("show"));
    const f = wrap.querySelector("[autofocus], input, textarea, button.primary");
    if (f) setTimeout(() => { try { f.focus(); } catch (e) { /* 忽略 */ } }, 30);
    return wrap;
  },
  closeModal() {
    const top = this._modalStack.pop();
    if (!top) return;
    top.el.remove();
    if (top.onClose) top.onClose();
  },
  closeAll() { while (this._modalStack.length) this.closeModal(); },

  /* 页面内确认框：cb 在点击确认后执行 */
  confirm(text, okLabel, cb, opts) {
    opts = opts || {};
    const id = "cf" + uid();
    UI._confirmCb = cb;
    UI.modal(`<p class="confirm-text">${text}</p>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">取消</button>
      <button type="button" class="btn ${opts.danger ? "danger" : "primary"}" id="${id}" data-act="confirmOk">${esc(okLabel || "确定")}</button></div>`,
      { title: opts.title || "请确认" });
  },
  _confirmCb: null,

  /* 输入框弹窗：cb(value) */
  prompt(title, label, def, cb) {
    UI._promptCb = cb;
    UI.modal(`<label class="field"><span>${esc(label)}</span><input id="promptInput" type="text" value="${esc(def || "")}" maxlength="30" autofocus></label>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">取消</button>
      <button type="button" class="btn primary" data-act="promptOk">确定</button></div>`, { title });
  },
  _promptCb: null,

  /* 复制文字：在点击事件里调用；失败时选中文字让用户手动复制 */
  copy(text, fallbackEl) {
    const done = () => UI.toast("已复制");
    const fail = () => {
      if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
      UI.toast("请长按或按 Ctrl+C 手动复制");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fail);
      } else fail();
    } catch (e) { fail(); }
  },

  /* 下载文件（离线版可用；网页预览版会退回复制） */
  download(name, text, mime) {
    if (IS_ARTIFACT) return false;
    try {
      const blob = new Blob([text], { type: mime || "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return true;
    } catch (e) { return false; }
  },

  canPrint() { return !IS_ARTIFACT && typeof window.print === "function"; }
};
