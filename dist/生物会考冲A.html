/* =========================================================
 * 学习记录：多学生档案、做题记录、错题间隔复习、模考记录、设置
 * 存储键：
 *   lbio:profiles          学生档案列表与当前档案
 *   lbio:p:<id>            某个学生的做题数据
 *   lbio:settings          全局设置（主题、字号、考试日期、等第线……）
 *   lbio:papers            老师组好的试卷
 *   lbio:custom            老师导入的自定义题目
 * ========================================================= */
const SRS_GAP = [0, 2, 4];      // 错题第 1、2 次复习答对后，分别隔 2、4 天再考
const SRS_MASTER = 3;           // 间隔复习连续答对 3 次 → 移出错题本（记为已掌握）

const Store = {
  profiles: null,
  data: null,
  settings: null,
  _timer: 0,

  init() {
    LS.probe();
    this.settings = Object.assign({
      theme: "auto", font: "m", autoNext: false,
      examDate: "", grade: Object.assign({}, EXAM_SPEC.gradeDefault),
      teacherName: "", school: ""
    }, LS.get("lbio:settings", {}));
    if (!this.settings.grade || typeof this.settings.grade.A !== "number") {
      this.settings.grade = Object.assign({}, EXAM_SPEC.gradeDefault);
    }
    this.profiles = LS.get("lbio:profiles", null);
    if (!this.profiles || !this.profiles.list || !this.profiles.list.length) {
      this.profiles = { list: [{ id: "p1", name: "我" }], cur: "p1" };
      LS.set("lbio:profiles", this.profiles);
    }
    if (!this.profiles.list.some(p => p.id === this.profiles.cur)) this.profiles.cur = this.profiles.list[0].id;
    this.load();
  },

  emptyData() {
    return { v: 1, prog: {}, fav: [], exams: [], seq: {}, daily: null, streak: { last: 0, n: 0 }, log: {} };
  },
  load() {
    const d = LS.get("lbio:p:" + this.profiles.cur, null);
    this.data = Object.assign(this.emptyData(), d || {});
    if (!this.data.prog) this.data.prog = {};
  },
  save(now) {
    clearTimeout(this._timer);
    const go = () => LS.set("lbio:p:" + this.profiles.cur, this.data);
    if (now) go(); else this._timer = setTimeout(go, 250);
  },
  saveSettings() { LS.set("lbio:settings", this.settings); },
  curName() { const p = this.profiles.list.find(x => x.id === this.profiles.cur); return p ? p.name : "我"; },

  /* ---- 档案管理 ---- */
  addProfile(name) {
    const id = "p" + uid();
    this.profiles.list.push({ id, name: name || "学生" + (this.profiles.list.length + 1) });
    LS.set("lbio:profiles", this.profiles);
    return id;
  },
  switchProfile(id) {
    this.save(true);
    this.profiles.cur = id;
    LS.set("lbio:profiles", this.profiles);
    this.load();
  },
  renameProfile(id, name) {
    const p = this.profiles.list.find(x => x.id === id);
    if (p && name) { p.name = name; LS.set("lbio:profiles", this.profiles); }
  },
  deleteProfile(id) {
    if (this.profiles.list.length <= 1) return false;
    this.profiles.list = this.profiles.list.filter(x => x.id !== id);
    LS.del("lbio:p:" + id);
    if (this.profiles.cur === id) { this.profiles.cur = this.profiles.list[0].id; this.load(); }
    LS.set("lbio:profiles", this.profiles);
    return true;
  },

  /* ---- 做题记录 ----
   * rec: { a 作答次数, c 答对次数, f 首次是否答对, l 最近作答日, s 连对次数,
   *        in 是否在错题本, b 复习盒子, due 下次复习日, m 已掌握, sc 非选择题得分率 } */
  rec(qid) { return this.data.prog[qid] || null; },
  answer(qid, ok, ratio) {
    const today = dayNo();
    const r = this.data.prog[qid] || (this.data.prog[qid] = { a: 0, c: 0, f: ok ? 1 : 0, s: 0 });
    r.a++;
    r.l = today;
    if (ratio != null) r.sc = Math.round(ratio * 100);
    if (ok) {
      r.c++; r.s++;
      if (r.in) {
        if (!r.due || today >= r.due) {
          r.b = (r.b || 0) + 1;
          if (r.b >= SRS_MASTER) { r.in = 0; r.m = 1; r.due = 0; }
          else r.due = today + SRS_GAP[r.b];
        }
      }
    } else {
      r.s = 0; r.in = 1; r.m = 0; r.b = 0; r.due = today + 1;
    }
    this.data.log[today] = (this.data.log[today] || 0) + 1;
    this.trimLog();
    this.save();
    return r;
  },
  trimLog() {
    const keys = Object.keys(this.data.log);
    if (keys.length > 120) {
      keys.sort((a, b) => a - b).slice(0, keys.length - 120).forEach(k => delete this.data.log[k]);
    }
  },
  markMastered(qid) {
    const r = this.data.prog[qid];
    if (r) { r.in = 0; r.m = 1; r.due = 0; this.save(); }
  },
  restoreWrong(qid) {
    const r = this.data.prog[qid];
    if (r) { r.in = 1; r.m = 0; r.b = 0; r.due = dayNo(); this.save(); }
  },
  wrongList() { return Object.keys(this.data.prog).filter(id => this.data.prog[id].in && BANK.qMap[id]); },
  masteredList() { return Object.keys(this.data.prog).filter(id => this.data.prog[id].m && BANK.qMap[id]); },
  dueList() {
    const t = dayNo();
    return this.wrongList().filter(id => (this.data.prog[id].due || 0) <= t);
  },

  /* ---- 收藏 ---- */
  isFav(qid) { return this.data.fav.includes(qid); },
  toggleFav(qid) {
    const i = this.data.fav.indexOf(qid);
    if (i >= 0) this.data.fav.splice(i, 1); else this.data.fav.push(qid);
    this.save();
    return i < 0;
  },

  /* ---- 统计 ---- */
  chapterStat(chId) {
    const qs = (BANK.byCh[chId] || []).filter(q => !q.auto);
    let done = 0, a = 0, c = 0, wrong = 0;
    for (const q of qs) {
      const r = this.data.prog[q.id];
      if (r) { done++; a += r.a; c += r.c; if (r.in) wrong++; }
    }
    return { total: qs.length, done, a, c, acc: a ? c / a : null, wrong, cover: qs.length ? done / qs.length : 0 };
  },
  overall() {
    let done = 0, a = 0, c = 0;
    const total = BANK.qs.filter(q => !q.auto).length;
    for (const id in this.data.prog) {
      if (!BANK.qMap[id] || BANK.qMap[id].auto) continue;
      const r = this.data.prog[id]; done++; a += r.a; c += r.c;
    }
    return { total, done, a, c, acc: a ? c / a : null };
  },
  kpStats(chId) {
    const m = new Map();
    for (const q of BANK.byCh[chId] || []) {
      if (q.auto) continue;
      const k = q.kp || "其他";
      if (!m.has(k)) m.set(k, { kp: k, total: 0, done: 0, a: 0, c: 0 });
      const o = m.get(k); o.total++;
      const r = this.data.prog[q.id];
      if (r) { o.done++; o.a += r.a; o.c += r.c; }
    }
    return Array.from(m.values());
  },
  /* 薄弱章节：做过一定题量且正确率低的优先；其次覆盖率低的 */
  weakChapters(n) {
    const arr = BANK.chapters.map(ch => ({ ch, st: this.chapterStat(ch.id) }));
    const scored = arr.map(x => {
      const st = x.st;
      let score;
      if (st.a >= 5) score = (st.acc || 0) * 100 - 10;           // 有足够数据：按正确率
      else score = 60 + st.cover * 40;                            // 数据不足：按覆盖率
      return Object.assign(x, { score });
    });
    return scored.sort((a, b) => a.score - b.score).slice(0, n || 3);
  },
  streakTouch() {
    const t = dayNo();
    const s = this.data.streak || (this.data.streak = { last: 0, n: 0 });
    if (s.last === t) return;
    s.n = s.last === t - 1 ? s.n + 1 : 1;
    s.last = t;
    this.save();
  },
  todayCount() { return this.data.log[dayNo()] || 0; },

  /* ---- 顺序练习进度 ---- */
  getSeq(key) { return this.data.seq[key] || 0; },
  setSeq(key, i) { this.data.seq[key] = i; this.save(); },

  /* ---- 模考记录 ---- */
  addExam(rec) {
    this.data.exams.unshift(rec);
    if (this.data.exams.length > 50) this.data.exams.length = 50;
    this.save(true);
  },

  /* ---- 等第 ---- */
  grade(score) {
    const g = this.settings.grade;
    if (score >= g.A) return "A";
    if (score >= g.B) return "B";
    if (score >= g.C) return "C";
    return "D";
  },

  /* ---- 老师：试卷、自定义题 ---- */
  papers() { return LS.get("lbio:papers", []); },
  savePapers(list) { LS.set("lbio:papers", list.slice(0, 40)); },
  customs() { return LS.get("lbio:custom", []); },
  saveCustoms(list) { LS.set("lbio:custom", list); },

  /* ---- 备份与恢复 ---- */
  exportAll() {
    const out = { app: APP_NAME, ver: APP_VERSION, at: Date.now(), profiles: this.profiles, settings: this.settings, data: {} };
    this.save(true);
    for (const p of this.profiles.list) out.data[p.id] = LS.get("lbio:p:" + p.id, null);
    out.papers = this.papers();
    out.custom = this.customs();
    return out;
  },
  importAll(obj) {
    if (!obj || obj.app !== APP_NAME || !obj.profiles || !obj.data) throw new Error("这不是本程序导出的备份数据");
    LS.set("lbio:profiles", obj.profiles);
    for (const id in obj.data) if (obj.data[id]) LS.set("lbio:p:" + id, obj.data[id]);
    if (obj.settings) LS.set("lbio:settings", obj.settings);
    if (Array.isArray(obj.papers)) LS.set("lbio:papers", obj.papers);
    if (Array.isArray(obj.custom)) LS.set("lbio:custom", obj.custom);
    this.init();
  },
  resetCurrent() {
    this.data = this.emptyData();
    this.save(true);
  }
};

/* ---- src/app/engine.js ---- */
/* =========================================================
 * 做题引擎：会话管理、题目渲染、判分
 * 会话模式：
 *   instant  练习：选完立即判对错并给解析
 *   exam     模考：作答时不显示对错，交卷后统一判分
 *   review   回看：显示自己的答案、正确答案与解析
 *   class    课堂投屏：大字号，一键显示答案
 * ========================================================= */
const Engine = {
  sess: null,

  /* opts: { kind, title, ids, mode, seqKey, start, back, exam } */
  start(opts) {
    const ids = opts.ids.filter(id => BANK.qMap[id]);
    if (!ids.length) { UI.toast("这里暂时没有可做的题目"); return false; }
    this.sess = {
      id: uid(), kind: opts.kind || "practice", title: opts.title || "练习",
      ids, idx: clamp(opts.start || 0, 0, ids.length - 1), mode: opts.mode || "instant",
      seed: opts.seed || newSeed(), perm: {}, ans: {}, seqKey: opts.seqKey || "",
      back: opts.back || "#practice", startedAt: Date.now(), exam: opts.exam || null,
      names: {}, reveal: {}
    };
    Store.streakTouch();
    return true;
  },

  q() { return BANK.qMap[this.sess.ids[this.sess.idx]]; },

  /* ---------- 选项顺序 ---------- */
  perm(key, q) {
    const s = this.sess;
    if (s && s.perm[key]) return s.perm[key];
    const n = q.o.length;
    let order;
    const r = rng(((s ? s.seed : 7) ^ hashStr(key)) >>> 0);
    if (q.pool) {
      const others = shuffle(Array.from({ length: n }, (_, i) => i).filter(i => i !== q.a), r).slice(0, 3);
      order = shuffle([q.a].concat(others), r);
    } else if (!q.ns) {
      order = shuffle(Array.from({ length: n }, (_, i) => i), r);
    } else {
      order = Array.from({ length: n }, (_, i) => i);
    }
    if (s) s.perm[key] = order;
    return order;
  },

  ans(qid) {
    const s = this.sess;
    return s.ans[qid] || (s.ans[qid] = { sel: null, ok: null, subs: [], done: false });
  },

  /* ---------- 判分 ---------- */
  checkFill(sub, val) {
    const raw = String(val || "").trim();
    if (!raw) return false;
    const stripNum = t => t.replace(/^[\[［【(（]?\s*([①-⑳]|\d{1,2})\s*[\]］】)）]?/, "");
    const cands = [norm(raw), norm(stripNum(raw))];
    const accepts = (sub.a || []).map(String);
    if (sub.set) {
      const parts = x => norm(x.replace(/[、，,和及与+\s]+/g, "|")).split("|").filter(Boolean).sort().join("|");
      const mine = norm(raw.replace(/[、，,和及与+\s]+/g, "|")).split("|").filter(Boolean).sort().join("|");
      return accepts.some(a => parts(a) === mine);
    }
    return accepts.some(a => {
      const na = norm(a);
      if (cands.includes(na)) return true;
      /* 只要求填序号时，接受 ③ 或 3 */
      const ci = CIRCLED.indexOf(a.trim());
      if (ci >= 0 && (cands.includes(String(ci + 1)) || cands.includes(norm(CIRCLED[ci])))) return true;
      return false;
    });
  },
  kwHit(sub, val) {
    if (!sub.kw || !sub.kw.length) return null;
    const v = norm(val);
    return sub.kw.map(k => ({ k, hit: String(k).split("/").some(x => v.includes(norm(x))) }));
  },

  /* 非选择题得分（已判的小题合计） */
  caseScore(q, A) {
    let got = 0, max = 0, pending = 0;
    q.subs.forEach((sub, i) => {
      max += sub.p || 0;
      const a = A.subs[i];
      if (!a || a.sc == null) pending++;
      else got += a.sc;
    });
    return { got, max, pending };
  },

  /* 记录一道题的结果到学习档案 */
  record(q, A) {
    if (A.recorded) return;
    if (q.t === "c") {
      const { got, max } = this.caseScore(q, A);
      const ratio = max ? got / max : 0;
      Store.answer(q.id, ratio >= 0.8, ratio);
    } else {
      Store.answer(q.id, !!A.ok);
    }
    A.recorded = true;
  },

  /* ---------- 渲染 ---------- */
  metaLine(q) {
    const ch = BANK.chOf(q);
    if (!ch) return "";
    return `<div class="ana-m"><span>考点：${esc(q.kp || "—")}</span><span>教材：${esc(ch.bookName)} ${esc(ch.unitName)} ${esc(ch.no)} ${esc(ch.name)}</span></div>`;
  },
  diffStars(d) {
    d = d || 1;
    return `<span class="qdiff" title="难度">${"●".repeat(d)}<span class="dim">${"●".repeat(3 - d)}</span></span>`;
  },
  typeLabel(q) {
    if (q.t === "c") return CASE_NAME[q.ct] || "非选择题";
    if (q.auto) return "识图训练";
    return TYPE_NAME[q.t] || "题目";
  },

  /* 渲染当前题（或指定题）。num 为题号文字 */
  renderQ(qid, num, opts) {
    opts = opts || {};
    const q = BANK.qMap[qid];
    if (!q) return `<div class="qcard"><p>题目不存在（可能已被删除）。</p></div>`;
    const s = this.sess;
    const mode = s ? s.mode : "instant";
    const A = this.ans(qid);
    const trusted = !q.custom;
    const fav = Store.isFav(qid);
    let h = `<article class="qcard mode-${mode}" data-qid="${esc(qid)}">`;
    h += `<header class="qhead"><span class="qtype t-${q.t}${q.ct ? " ct-" + q.ct : ""}">${this.typeLabel(q)}</span>${this.diffStars(q.d)}` +
      `${q.t === "c" ? `<span class="qpts">${q.p} 分</span>` : ""}` +
      `<span class="qch">${esc(BANK.chOf(q) ? BANK.chOf(q).name : "")}</span>` +
      `${q.custom ? `<span class="tag">自定义</span>` : ""}` +
      `<button type="button" class="iconbtn fav${fav ? " on" : ""}" data-act="fav" data-qid="${esc(qid)}" aria-label="${fav ? "取消收藏" : "收藏"}" title="${fav ? "取消收藏" : "收藏"}">${fav ? "★" : "☆"}</button></header>`;
    if (q.t === "c") h += this.renderCase(q, A, num, mode, trusted);
    else h += this.renderChoice(q, A, num, mode, trusted);
    h += `</article>`;
    return h;
  },

  showAnswer(mode, A) {
    return mode === "review" || (mode === "instant" && A.done) || (mode === "class" && A.reveal);
  },

  renderChoice(q, A, num, mode, trusted) {
    const showAns = this.showAnswer(mode, A);
    let h = `<div class="qstem">${num ? `<span class="qnum">${num}</span>` : ""}${fmt(q.q, trusted)}</div>`;
    const sess = this.sess;
    if (q.fig) h += figHtml(q.fig, { names: showAns && sess && sess.names[q.id], toggle: showAns });
    if (q.t === "s") {
      const order = this.perm(q.id, q);
      h += `<ol class="opts">`;
      order.forEach((oi, k) => {
        let cls = "opt";
        if (A.sel === k) cls += " sel";
        if (showAns) {
          if (oi === q.a) cls += " right";
          else if (A.sel === k) cls += " wrong";
        }
        const dis = showAns || mode === "review" ? " disabled" : "";
        h += `<li><button type="button" class="${cls}" data-act="pick" data-k="${k}"${dis}><span class="ol">${LETTERS[k]}</span><span class="ot">${fmt(q.o[oi], trusted)}</span>` +
          `${showAns && oi === q.a ? `<span class="mk ok" aria-label="正确答案">✓</span>` : ""}${showAns && A.sel === k && oi !== q.a ? `<span class="mk bad" aria-label="你的选择">✗</span>` : ""}</button></li>`;
      });
      h += `</ol>`;
    } else if (q.t === "j") {
      h += `<div class="opts judge">`;
      [[true, "正确", "√"], [false, "错误", "×"]].forEach(([v, label, sym]) => {
        let cls = "opt";
        if (A.sel === v) cls += " sel";
        if (showAns) {
          if (v === q.a) cls += " right";
          else if (A.sel === v) cls += " wrong";
        }
        const dis = showAns || mode === "review" ? " disabled" : "";
        h += `<button type="button" class="${cls}" data-act="judge" data-v="${v ? 1 : 0}"${dis}><span class="ol">${sym}</span><span class="ot">${label}</span></button>`;
      });
      h += `</div>`;
    }
    if (showAns) h += this.feedback(q, A, mode);
    return h;
  },

  feedback(q, A, mode) {
    let fb = "";
    if (A.sel != null) {
      fb = A.ok ? `<div class="fb ok"><span class="fb-i">✓</span>回答正确</div>`
        : `<div class="fb bad"><span class="fb-i">✗</span>回答错误，正确答案是 ${this.rightLetter(q)}</div>`;
    } else if (mode === "review" || mode === "class") {
      fb = `<div class="fb neutral">${mode === "review" ? "未作答，" : ""}正确答案是 ${this.rightLetter(q)}</div>`;
    }
    return fb + this.analysis(q);
  },
  rightLetter(q) {
    if (q.t === "j") return q.a ? "“正确”" : "“错误”";
    const order = this.perm(q.id, q);
    return LETTERS[order.indexOf(q.a)];
  },
  analysis(q) {
    return `<div class="ana"><div class="ana-h">解析</div><div class="ana-b">${fmt(q.e || "（暂无解析）", !q.custom)}</div>${this.metaLine(q)}</div>`;
  },

  renderCase(q, A, num, mode, trusted) {
    const sess = this.sess;
    let h = `<div class="qstem case-title">${num ? `<span class="qnum">${num}</span>` : ""}${q.title ? `<b>${fmt(q.title, trusted)}</b>` : ""}</div>`;
    if (q.m) h += `<div class="material">${fmt(q.m, trusted)}</div>`;
    const anyShown = mode === "review" || q.subs.some((_, i) => A.subs[i] && A.subs[i].done) || (mode === "class" && A.reveal);
    if (q.fig) h += figHtml(q.fig, { names: sess && sess.names[q.id], toggle: anyShown });
    h += `<ol class="subs">`;
    q.subs.forEach((sub, i) => { h += this.renderSub(q, sub, i, A, mode, trusted); });
    h += `</ol>`;
    const sc = this.caseScore(q, A);
    const allDone = q.subs.every((_, i) => A.subs[i] && A.subs[i].done);
    if (mode === "instant" && allDone) {
      h += `<div class="fb ${sc.got >= sc.max * 0.8 ? "ok" : "bad"}"><span class="fb-i">${sc.got >= sc.max * 0.8 ? "✓" : "✗"}</span>本题得分 ${fmtPts(sc.got)} / ${sc.max}</div>`;
      if (q.e) h += this.analysis(q);
      else h += `<div class="ana">${this.metaLine(q)}</div>`;
    } else if (mode === "review") {
      h += `<div class="fb neutral">本题得分 ${fmtPts(sc.got)} / ${sc.max}</div>`;
      if (q.e) h += this.analysis(q); else h += `<div class="ana">${this.metaLine(q)}</div>`;
    } else if (mode === "class" && A.reveal && q.e) {
      h += this.analysis(q);
    }
    return h;
  },

  renderSub(q, sub, i, A, mode, trusted) {
    const a = A.subs[i] || {};
    const key = `${q.id}#${i}`;
    const showAns = mode === "review" || (mode === "instant" && a.done) || (mode === "class" && A.reveal);
    let h = `<li class="sub" data-si="${i}"><div class="sub-q"><span class="subno">（${i + 1}）</span>${fmt(sub.q, trusted)}<span class="subpts">${sub.p || 0}分</span></div>`;
    if (sub.t === "s") {
      const order = this.perm(key, sub);
      h += `<ol class="opts sm">`;
      order.forEach((oi, k) => {
        let cls = "opt";
        if (a.sel === k) cls += " sel";
        if (showAns) {
          if (oi === sub.a) cls += " right";
          else if (a.sel === k) cls += " wrong";
        }
        h += `<li><button type="button" class="${cls}" data-act="subPick" data-si="${i}" data-k="${k}"${showAns ? " disabled" : ""}><span class="ol">${LETTERS[k]}</span><span class="ot">${fmt(sub.o[oi], trusted)}</span></button></li>`;
      });
      h += `</ol>`;
    } else if (sub.t === "j") {
      h += `<div class="opts judge sm">`;
      [[true, "正确", "√"], [false, "错误", "×"]].forEach(([v, label, sym]) => {
        let cls = "opt";
        if (a.sel === v) cls += " sel";
        if (showAns) { if (v === sub.a) cls += " right"; else if (a.sel === v) cls += " wrong"; }
        h += `<button type="button" class="${cls}" data-act="subJudge" data-si="${i}" data-v="${v ? 1 : 0}"${showAns ? " disabled" : ""}><span class="ol">${sym}</span><span class="ot">${label}</span></button>`;
      });
      h += `</div>`;
    } else if (sub.t === "f") {
      const val = a.val != null ? a.val : "";
      h += `<div class="fillrow"><input type="text" class="fillin" id="fill-${esc(q.id)}-${i}" data-si="${i}" value="${esc(val)}" placeholder="在此填写答案" autocomplete="off"${showAns ? " disabled" : ""}>` +
        `${!showAns && mode === "instant" ? `<button type="button" class="btn sm" data-act="subFill" data-si="${i}">确定</button>` : ""}</div>`;
    } else if (sub.t === "o") {
      const val = a.val != null ? a.val : "";
      h += `<textarea class="openin" id="open-${esc(q.id)}-${i}" data-si="${i}" rows="2" placeholder="写下你的答案（可只写要点）"${showAns ? " disabled" : ""}>${esc(val)}</textarea>`;
      if (!showAns && mode === "instant") h += `<div class="row-end"><button type="button" class="btn sm" data-act="subOpen" data-si="${i}">看参考答案并自评</button></div>`;
    }
    if (showAns) h += this.subFeedback(q, sub, a, i, mode, A);
    h += `</li>`;
    return h;
  },

  subFeedback(q, sub, a, i, mode, A) {
    let h = "";
    const pts = sub.p || 0;
    if (sub.t === "s" || sub.t === "j") {
      const right = sub.t === "j" ? (sub.a ? "“正确”" : "“错误”") : LETTERS[this.perm(`${q.id}#${i}`, sub).indexOf(sub.a)];
      h += a.sel == null ? `<div class="sfb neutral">正确答案：${right}</div>`
        : a.ok ? `<div class="sfb ok">✓ 正确（+${fmtPts(a.sc)}分）</div>` : `<div class="sfb bad">✗ 错误，正确答案：${right}</div>`;
    } else if (sub.t === "f") {
      const ref = (sub.a || [])[0] || "";
      if (a.ok) h += `<div class="sfb ok">✓ 正确（+${fmtPts(a.sc)}分）　参考答案：${esc(ref)}</div>`;
      else {
        h += `<div class="sfb bad">${a.val ? "✗ 与参考答案不一致" : "未作答"}　参考答案：<b>${esc(ref)}</b></div>`;
        if (a.val && mode === "instant" && !(A && A.recorded)) h += `<div class="row-end"><button type="button" class="linkbtn" data-act="subOverride" data-si="${i}">我的意思一样，判为正确</button></div>`;
      }
    } else if (sub.t === "o") {
      h += `<div class="refans"><div class="ref-h">参考答案</div><div>${fmt(sub.a, true)}</div></div>`;
      const hits = this.kwHit(sub, a.val || "");
      if (hits && a.val) {
        h += `<div class="kwhits">要点：${hits.map(x => `<span class="kw ${x.hit ? "hit" : ""}">${x.hit ? "✓" : "○"} ${esc(String(x.k).split("/")[0])}</span>`).join("")}</div>`;
      }
      if (mode === "instant") {
        if (a.sc == null) {
          h += `<div class="selfgrade"><span>对照参考答案，给自己打分：</span>` + selfOpts(pts).map(v =>
            `<button type="button" class="btn sm" data-act="subSelf" data-si="${i}" data-v="${v}">${fmtPts(v)}分</button>`).join("") + `</div>`;
        } else {
          h += `<div class="sfb ${a.sc >= pts ? "ok" : a.sc > 0 ? "part" : "bad"}">自评得分：${fmtPts(a.sc)} / ${pts}${A && A.recorded ? "" : `　<button type="button" class="linkbtn" data-act="subSelfReset" data-si="${i}">重新自评</button>`}</div>`;
        }
      } else if (mode === "review" && a.sc != null) {
        h += `<div class="sfb ${a.sc >= pts ? "ok" : a.sc > 0 ? "part" : "bad"}">得分：${fmtPts(a.sc)} / ${pts}</div>`;
      }
    }
    if (sub.e) h += `<div class="sub-ana">${fmt(sub.e, true)}</div>`;
    return h;
  }
};

function fmtPts(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function selfOpts(p) {
  if (p <= 1) return [0, p];
  if (p === 2) return [0, 1, 2];
  return uniq([0, Math.round(p / 3), Math.round((p * 2) / 3), p]);
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---- src/app/exam.js ---- */
/* =========================================================
 * 组卷与模考：按湖南省试卷结构（25道单选×2分 + 非选择题50分，60分钟）抽题
 * 老师组卷也复用这里的选题逻辑。
 * ========================================================= */
const CASE_ORDER = { 识图: 0, 资料: 1, 实验: 2, 综合: 3 };

function permFor(seed, key, q) {
  const n = q.o.length;
  const r = rng((seed ^ hashStr(key)) >>> 0);
  if (q.pool) {
    const others = shuffle(Array.from({ length: n }, (_, i) => i).filter(i => i !== q.a), r).slice(0, 3);
    return shuffle([q.a].concat(others), r);
  }
  if (q.ns) return Array.from({ length: n }, (_, i) => i);
  return shuffle(Array.from({ length: n }, (_, i) => i), r);
}

const Exam = {
  /* 题目“新鲜度”：没做过的优先，做错过的其次 */
  freshness(q) {
    const r = Store.rec(q.id);
    if (!r) return 1;
    if (r.in) return 0.6;
    return Math.max(0, 0.4 - r.a * 0.1);
  },

  /* 均衡抽取 n 道：同一章不扎堆，难度大致 6:3:1 */
  pickBalanced(pool, n, rand, opts) {
    opts = opts || {};
    if (n <= 0 || !pool.length) return [];
    const diffMix = opts.diffMix || { 1: 0.6, 2: 0.3, 3: 0.1 };
    const scored = pool.map(q => ({ q, s: rand() + (opts.fresh !== false ? this.freshness(q) * 0.8 : 0) }))
      .sort((a, b) => b.s - a.s).map(x => x.q);
    const chs = uniq(pool.map(q => q.ch));
    const chCap = Math.max(1, Math.ceil(n / chs.length) + 1);
    const dCap = { 1: Math.ceil(n * diffMix[1]) + 1, 2: Math.ceil(n * diffMix[2]) + 1, 3: Math.ceil(n * diffMix[3]) + 1 };
    const out = [], chCount = {}, dCount = {}, used = new Set();
    const tryPass = (useCh, useD) => {
      for (const q of scored) {
        if (out.length >= n) break;
        if (used.has(q.id)) continue;
        const d = q.d || 1;
        if (useCh && (chCount[q.ch] || 0) >= chCap) continue;
        if (useD && (dCount[d] || 0) >= dCap[d]) continue;
        out.push(q); used.add(q.id);
        chCount[q.ch] = (chCount[q.ch] || 0) + 1;
        dCount[d] = (dCount[d] || 0) + 1;
      }
    };
    tryPass(true, true);
    if (out.length < n) tryPass(true, false);
    if (out.length < n) tryPass(false, false);
    return out;
  },

  mcqPool(chIds, opts) {
    const set = new Set(chIds);
    return BANK.qs.filter(q => q.t === "s" && set.has(q.ch) && !q.auto && (!opts || opts.custom !== false || !q.custom));
  },
  casePool(chIds) {
    const set = new Set(chIds);
    return BANK.qs.filter(q => q.t === "c" && set.has(q.ch));
  },

  /* 按册分配题量（全册范围时按考试比例，否则按题量比例） */
  pickMcq(chIds, n, rand, opts) {
    const pool = this.mcqPool(chIds, opts);
    if (!pool.length) return [];
    const books = groupBy(pool, q => BANK.chMap[q.ch].book);
    const allBooks = books.size === 4 && chIds.length === BANK.chapters.length;
    const quota = {};
    if (allBooks && n === EXAM_SPEC.mcqCount) Object.assign(quota, EXAM_SPEC.bookQuota);
    else {
      const total = pool.length;
      let assigned = 0;
      const entries = Array.from(books.entries());
      entries.forEach(([b, arr], i) => {
        const k = i === entries.length - 1 ? n - assigned : Math.round((arr.length / total) * n);
        quota[b] = Math.max(0, k); assigned += quota[b];
      });
    }
    let out = [];
    for (const [b, arr] of books) out = out.concat(this.pickBalanced(arr, Math.min(arr.length, quota[b] || 0), rand, opts));
    if (out.length < n) {
      const used = new Set(out.map(q => q.id));
      out = out.concat(this.pickBalanced(pool.filter(q => !used.has(q.id)), n - out.length, rand, opts));
    }
    return out.slice(0, n);
  },

  /* 非选择题凑满目标分值，尽量覆盖 识图/实验/资料 三类 */
  pickCases(chIds, target, rand, opts) {
    opts = opts || {};
    const pool = this.casePool(chIds);
    if (!pool.length || target <= 0) return [];
    const minN = opts.minN || 1, maxN = opts.maxN || 99;
    let best = null, bestGap = Infinity;
    for (let attempt = 0; attempt < 400; attempt++) {
      const sh = shuffle(pool.map(q => ({ q, s: rand() + this.freshness(q) * 0.6 })).sort((a, b) => b.s - a.s).map(x => x.q), rand);
      const picked = [], seenCt = new Set();
      let tot = 0;
      for (const ct of ["识图", "实验", "资料"]) {
        const c = sh.find(q => q.ct === ct && !picked.includes(q) && tot + q.p <= target);
        if (c) { picked.push(c); seenCt.add(ct); tot += c.p; }
      }
      for (const q of sh) {
        if (tot >= target || picked.length >= maxN) break;
        if (picked.includes(q)) continue;
        if (tot + q.p <= target) { picked.push(q); tot += q.p; }
      }
      const gap = target - tot;
      if (gap === 0 && picked.length >= minN && picked.length <= maxN) { best = picked; break; }
      if (gap >= 0 && gap < bestGap) { bestGap = gap; best = picked; }
    }
    return best || [];
  },

  sortByBook(list) {
    return list.slice().sort((a, b) => (BANK.chMap[a.ch].order - BANK.chMap[b.ch].order) || (a.d || 1) - (b.d || 1));
  },

  /* 生成一套完整模拟卷 */
  makeMock(opts) {
    opts = opts || {};
    const seed = opts.seed || newSeed();
    const rand = rng(seed);
    const chIds = opts.chIds || BANK.chapters.map(c => c.id);
    const mcqN = opts.mcqN != null ? opts.mcqN : EXAM_SPEC.mcqCount;
    const casePts = opts.casePts != null ? opts.casePts : EXAM_SPEC.casePoints;
    const mcq = this.sortByBook(this.pickMcq(chIds, mcqN, rand, opts));
    const cases = this.sortByBook(this.pickCases(chIds, casePts, rand,
      opts.full ? { minN: EXAM_SPEC.caseCountMin, maxN: EXAM_SPEC.caseCountMax } : {}));
    return { seed, mcq: mcq.map(q => q.id), cases: cases.map(q => q.id) };
  },

  /* ---------- 模考流程 ---------- */
  timer: 0,
  startMock(kind) {
    const full = kind !== "mcq";
    const m = this.makeMock({ full, mcqN: EXAM_SPEC.mcqCount, casePts: full ? EXAM_SPEC.casePoints : 0 });
    if (m.mcq.length < 5) { UI.toast("题库中的选择题不足，暂时无法组卷"); return; }
    const minutes = full ? EXAM_SPEC.minutes : 25;
    const ok = Engine.start({
      kind: "exam", mode: "exam", title: full ? "全真模拟（60分钟）" : "选择题限时练（25分钟）",
      ids: m.mcq.concat(m.cases), seed: m.seed, back: "#exam",
      exam: { kind, mcqN: m.mcq.length, mcqPt: EXAM_SPEC.mcqPoint, minutes, deadline: Date.now() + minutes * 60000 }
    });
    if (ok) { Persist.saveSess(); go("#run"); }
  },

  remain() {
    const s = Engine.sess;
    if (!s || !s.exam) return 0;
    return Math.max(0, Math.round((s.exam.deadline - Date.now()) / 1000));
  },
  tick() {
    const el = $("#examTimer");
    if (!el || !Engine.sess || Engine.sess.mode !== "exam") return;
    const r = this.remain();
    el.textContent = fmtDur(r);
    el.classList.toggle("warn", r <= 600);
    if (r <= 0) { clearInterval(this.timer); UI.toast("时间到，已自动交卷"); this.submit(true); }
  },
  startTimer() {
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 1000);
    this.tick();
  },

  unanswered() {
    const s = Engine.sess;
    let n = 0;
    for (const id of s.ids) {
      const q = BANK.qMap[id], A = s.ans[id];
      if (q.t === "c") {
        if (!A || q.subs.some((sub, i) => { const a = A.subs[i]; return !a || (a.sel == null && !a.val); })) n++;
      } else if (!A || A.sel == null) n++;
    }
    return n;
  },

  /* 交卷：客观题自动判分；主观小题进入自评 */
  submit(force) {
    const s = Engine.sess;
    if (!s || s.mode !== "exam") return;
    clearInterval(this.timer);
    s.exam.usedSec = Math.round((Math.min(Date.now(), s.exam.deadline) - s.startedAt) / 1000);
    for (const id of s.ids) {
      const q = BANK.qMap[id];
      const A = Engine.ans(id);
      if (q.t === "s") {
        const order = Engine.perm(id, q);
        A.ok = A.sel != null && order[A.sel] === q.a;
        A.done = true;
      } else if (q.t === "j") {
        A.ok = A.sel === q.a; A.done = true;
      } else if (q.t === "c") {
        q.subs.forEach((sub, i) => {
          const a = A.subs[i] || (A.subs[i] = {});
          a.done = true;
          if (sub.t === "s") {
            const order = Engine.perm(`${id}#${i}`, sub);
            a.ok = a.sel != null && order[a.sel] === sub.a; a.sc = a.ok ? sub.p : 0;
          } else if (sub.t === "j") {
            a.ok = a.sel === sub.a; a.sc = a.ok ? sub.p : 0;
          } else if (sub.t === "f") {
            a.ok = Engine.checkFill(sub, a.val); a.sc = a.ok ? sub.p : 0;
          } else if (sub.t === "o") {
            if (!a.val || !String(a.val).trim()) { a.sc = 0; a.ok = false; }
            else a.sc = null;   // 待自评
          }
        });
        A.done = true;
      }
    }
    s.mode = "grading";
    Persist.saveSess();
    if (this.pendingSelf().length) go("#grade");
    else this.finish();
  },

  pendingSelf() {
    const s = Engine.sess;
    const out = [];
    if (!s) return out;
    for (const id of s.ids) {
      const q = BANK.qMap[id];
      if (q.t !== "c") continue;
      const A = s.ans[id];
      q.subs.forEach((sub, i) => {
        const a = A && A.subs[i];
        if (sub.t === "o" && a && a.sc == null) out.push({ q, i, sub, a });
        else if (sub.t === "f" && a && !a.ok && a.val && String(a.val).trim()) out.push({ q, i, sub, a, fill: true });
      });
    }
    return out;
  },

  finish() {
    const s = Engine.sess;
    if (!s) return;
    let mcqGot = 0, mcqMax = 0, caseGot = 0, caseMax = 0;
    const byCh = {}, wrong = [];
    for (const id of s.ids) {
      const q = BANK.qMap[id];
      const A = Engine.ans(id);
      let got, max;
      if (q.t === "c") {
        q.subs.forEach((sub, i) => { const a = A.subs[i]; if (a && a.sc == null) a.sc = 0; });
        const cs = Engine.caseScore(q, A);
        got = cs.got; max = cs.max; caseGot += got; caseMax += max;
        if (got < max * 0.8) wrong.push(id);
      } else {
        max = s.exam.mcqPt; got = A.ok ? max : 0; mcqGot += got; mcqMax += max;
        if (!A.ok) wrong.push(id);
      }
      const b = byCh[q.ch] || (byCh[q.ch] = { got: 0, max: 0 });
      b.got += got; b.max += max;
      Engine.record(q, A);
    }
    const total = mcqGot + caseGot;
    const maxAll = mcqMax + caseMax;
    const score100 = maxAll ? Math.round((total / maxAll) * 1000) / 10 : 0;
    const rec = {
      id: s.id, at: Date.now(), kind: s.exam.kind, title: s.title, dur: s.exam.usedSec,
      score: total, max: maxAll, score100, grade: Store.grade(score100),
      mcq: { got: mcqGot, max: mcqMax }, cases: { got: caseGot, max: caseMax },
      byCh, wrong, ids: s.ids, ans: s.ans, perm: s.perm, seed: s.seed
    };
    Store.addExam(rec);
    s.mode = "review";
    s.resultId = rec.id;
    Persist.clearSess();
    go("#result/" + rec.id);
  },

  reviewRecord(rec, startId) {
    Engine.sess = {
      id: rec.id, kind: "exam", title: rec.title + " · 回看", ids: rec.ids, idx: Math.max(0, startId ? rec.ids.indexOf(startId) : 0),
      mode: "review", seed: rec.seed, perm: rec.perm || {}, ans: rec.ans || {}, back: "#result/" + rec.id,
      startedAt: rec.at, exam: { mcqN: rec.ids.filter(id => BANK.qMap[id] && BANK.qMap[id].t !== "c").length }, names: {}, reveal: {}
    };
    go("#run");
  }
};

/* 进行中的练习/模考保存在本机，刷新或切到后台再回来都能继续 */
const Persist = {
  key() { return "lbio:sess:" + Store.profiles.cur; },
  saveSess() {
    const s = Engine.sess;
    if (!s || s.mode === "review" || s.mode === "class") return;
    LS.set(this.key(), { at: Date.now(), s });
  },
  clearSess() { LS.del(this.key()); },
  peek() {
    const v = LS.get(this.key(), null);
    if (!v || !v.s || Date.now() - v.at > 3 * 86400000) return null;
    if (!v.s.ids || !v.s.ids.some(id => BANK.qMap[id])) return null;
    return v;
  },
  resume() {
    const v = this.peek();
    if (!v) return false;
    Engine.sess = v.s;
    Engine.sess.names = Engine.sess.names || {};
    Engine.sess.reveal = Engine.sess.reveal || {};
    return true;
  }
};

 * 页面：外框、首页、章节练习、专项突破、做题、模考、错题本
 * 每个视图函数返回 { html, title, immersive?, after? }
 * ========================================================= */
const NAV = [
  { h: "#home", t: "首页", i: "home", tab: true },
  { h: "#practice", t: "章节练习", tt: "练习", i: "practice", tab: true },
  { h: "#special", t: "专项突破", i: "target" },
  { h: "#exam", t: "模拟考试", tt: "模考", i: "exam", tab: true },
  { h: "#wrong", t: "错题本", tt: "错题", i: "wrong", tab: true, badge: () => Store.dueList().length },
  { h: "#hb", t: "开卷速查手册", tt: "手册", i: "book", tab: true },
  { sep: true },
  { h: "#teacher", t: "老师组卷", i: "teacher" },
  { h: "#class", t: "课堂投屏", i: "screen" },
  { h: "#search", t: "搜索题目", i: "search" },
  { h: "#me", t: "我的与设置", i: "user" }
];

function shell(view, route) {
  if (view.immersive) return `<div class="immersive">${view.html}</div>`;
  const cur = "#" + route.split("/")[0];
  const active = h => cur === h || (h === "#practice" && ["#ch", "#kp"].includes(cur)) || (h === "#hb" && ["#hbc", "#tips"].includes(cur)) ||

  const side = NAV.map(n => n.sep ? `<hr>` :
    `<a href="${n.h}" class="nav-i${active(n.h) ? " on" : ""}">${icon(n.i)}<span>${n.t}</span>${n.badge && n.badge() ? `<span class="badge">${n.badge()}</span>` : ""}</a>`).join("");
  const tabs = NAV.filter(n => n.tab).map(n =>
    `<a href="${n.h}" class="tab-i${active(n.h) ? " on" : ""}">${icon(n.i)}<span>${n.tt || n.t}</span>${n.badge && n.badge() ? `<span class="dotb"></span>` : ""}</a>`).join("");
  return `<div class="shell">
  <aside class="side no-print">
    <a class="brand" href="#home">${icon("leaf", "logo")}<span><b>${APP_NAME}</b><small>湖南八年级生物学会考</small></span></a>
    <nav class="side-nav">${side}</nav>
    <button type="button" class="side-foot" data-act="profiles">${icon("user")}<span>当前学生：${esc(Store.curName())}</span></button>
  </aside>
  <div class="main">
    <header class="topbar no-print">
      <a class="brand-m" href="#home">${icon("leaf", "logo")}<b>${APP_NAME}</b></a>
      <span class="grow"></span>
      <a class="iconbtn" href="#search" aria-label="搜索">${icon("search")}</a>

function pageHead(title, sub, extra) {
  return `<div class="ph"><div class="ph-t"><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${extra ? `<div class="ph-x">${extra}</div>` : ""}</div>`;
}
function bar(ratio, cls) {
  const w = Math.round(clamp(ratio || 0, 0, 1) * 100);
  return `<span class="bar ${cls || ""}"><i style="width:${w}%"></i></span>`;
}
function accText(acc) { return acc == null ? "—" : Math.round(acc * 100) + "%"; }
function accCls(acc) { return acc == null ? "" : acc >= 0.85 ? "good" : acc >= 0.7 ? "mid" : "low"; }

/* ---------- 每日一练 ---------- */
const Daily = {
  get() {
    const d = Store.data.daily;
    if (d && d.day === dayNo()) return d;
    return null;
  },
  make() {
    const today = dayNo();
    const ids = [];
    const due = shuffle(Store.dueList()).slice(0, 5);
    ids.push(...due);
    const weak = Store.weakChapters(4).map(w => w.ch.id);
    const rand = rng(newSeed());
    const pool = BANK.qs.filter(q => weak.includes(q.ch) && q.t !== "c" && !ids.includes(q.id));
    const unseen = pool.filter(q => !Store.rec(q.id));
    ids.push(...pickN(unseen.length >= 10 - ids.length ? unseen : pool, 10 - ids.length, rand).map(q => q.id));
    if (ids.length < 10) {
      const rest = BANK.qs.filter(q => q.t !== "c" && !ids.includes(q.id));
      ids.push(...pickN(rest, 10 - ids.length, rand).map(q => q.id));
    }
    Store.data.daily = { day: today, ids, done: false };
    Store.save();
    return Store.data.daily;
  }
};

/* 答题卡 */
function sheetHtml() {
  const s = Engine.sess;
  let h = `<div class="sheet">`;
  s.ids.forEach((id, i) => {
    const q = BANK.qMap[id];
    const A = s.ans[id];
    let cls = "sq";
    if (i === s.idx) cls += " cur";
    if (A) {
      if (s.mode === "exam") {
        const started = q.t === "c" ? A.subs.some(a => a && (a.sel != null || a.val)) : A.sel != null;
        if (started) cls += " done";
      } else if (q.t === "c") {
        const sc = Engine.caseScore(q, A);
        if (q.subs.every((_, k) => A.subs[k] && A.subs[k].done)) cls += sc.got >= sc.max * 0.8 ? " ok" : " bad";
        else if (A.subs.some(a => a && a.done)) cls += " done";
      } else if (A.done) cls += A.ok ? " ok" : " bad";
    }
    if (s.exam && i === s.exam.mcqN) h += `<div class="sheet-sep">非选择题</div>`;
    h += `<button type="button" class="${cls}" data-act="jump" data-i="${i}">${i + 1}</button>`;
  });
  h += `</div><div class="sheet-legend">${s.mode === "exam" ? `<span><i class="sq done"></i>已作答</span><span><i class="sq"></i>未作答</span>` : `<span><i class="sq ok"></i>答对</span><span><i class="sq bad"></i>答错</span><span><i class="sq"></i>未做</span>`}</div>`;
  if (s.mode === "exam") h += `<div class="row-end"><button type="button" class="btn primary" data-act="submitExam">交卷</button></div>`;
  return h;
}

/* 练习结束小结 */
function runSummaryHtml() {
  const s = Engine.sess;
  let done = 0, ok = 0;
  for (const id of s.ids) {
    const q = BANK.qMap[id], A = s.ans[id];
    if (!A) continue;
    if (q.t === "c") {
      if (q.subs.every((_, k) => A.subs[k] && A.subs[k].done)) { done++; const sc = Engine.caseScore(q, A); if (sc.got >= sc.max * 0.8) ok++; }
    } else if (A.done) { done++; if (A.ok) ok++; }
  }
  const wrongIds = s.ids.filter(id => { const q = BANK.qMap[id], A = s.ans[id]; if (!A) return false; if (q.t === "c") { const sc = Engine.caseScore(q, A); return q.subs.every((_, k) => A.subs[k] && A.subs[k].done) && sc.got < sc.max * 0.8; } return A.done && !A.ok; });
  return `<div class="summary"><div class="sum-big"><span class="num">${ok}</span><small>/ ${done} 题答对</small></div>
    <p>${done < s.ids.length ? `还有 ${s.ids.length - done} 题没做。` : ""}${wrongIds.length ? `做错的 ${wrongIds.length} 题已放进错题本，过一天再复习效果最好。` : done ? "全部正确，继续保持。" : ""}</p>
    <div class="row-end">${wrongIds.length ? `<button type="button" class="btn" data-act="redoWrongNow">马上重做错题</button>` : ""}<button type="button" class="btn primary" data-act="leaveRun">返回</button></div></div>`;
}

function viewGrade() {

    return { html: h, title: "自评", immersive: true };
  }
  h += `<p class="hint">评分标准：要点答全、用词准确得满分；意思对但不完整酌情给分。实际考试中，专业名词写错字也会扣分。</p>`;
  for (const it of items) {

    h += `<article class="qcard"><div class="qstem"><span class="qnum">${num}.</span>（${i + 1}）${fmt(sub.q, !q.custom)} <span class="subpts">${sub.p}分</span></div>
      <div class="myans"><span>你的答案：</span>${esc(a.val || "（未作答）")}</div>
      <div class="refans"><div class="ref-h">参考答案</div><div>${it.fill ? esc((sub.a || []).join(" 或 ")) : fmt(sub.a, true)}</div></div>`;
    if (it.fill) {
      h += `<div class="selfgrade"><span>意思相同吗？</span><button type="button" class="btn sm" data-act="gradeFill" data-qid="${esc(q.id)}" data-si="${i}" data-v="1">相同，判对</button><button type="button" class="btn sm" data-act="gradeFill" data-qid="${esc(q.id)}" data-si="${i}" data-v="0">不对</button></div>`;
    } else {
      const hits = Engine.kwHit(sub, a.val || "");
      if (hits) h += `<div class="kwhits">要点：${hits.map(x => `<span class="kw ${x.hit ? "hit" : ""}">${x.hit ? "✓" : "○"} ${esc(String(x.k).split("/")[0])}</span>`).join("")}</div>`;
      h += `<div class="selfgrade"><span>给自己打分：</span>${selfOpts(sub.p).map(v => `<button type="button" class="btn sm" data-act="gradeSelf" data-qid="${esc(q.id)}" data-si="${i}" data-v="${v}">${fmtPts(v)}分</button>`).join("")}</div>`;
    }

  }
  h += `<div class="row-end"><button type="button" class="btn" data-act="finishExam">剩下的按0分处理，直接看成绩</button></div></div>`;
  return { html: h, title: "自评", immersive: true };
}

  </section>`;

function trendSvg(list) {
  const W = 560, H = 190, x0 = 34, y0 = 160, w = 500, hgt = 140;
  const fx = i => x0 + (list.length === 1 ? w / 2 : (i * w) / (list.length - 1));
  const fy = v => y0 - (clamp(v, 0, 100) / 100) * hgt;
  const g = Store.settings.grade;
  let s = `<div class="chart-wrap"><svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="模考成绩走势">`;
  [0, 50, 100].forEach(v => { s += `<line class="grid" x1="${x0}" x2="${x0 + w}" y1="${fy(v)}" y2="${fy(v)}"/><text class="tk" x="${x0 - 6}" y="${fy(v) + 4}" text-anchor="end">${v}</text>`; });
  [["A", g.A], ["B", g.B], ["C", g.C]].forEach(([k, v]) => { s += `<line class="gl" x1="${x0}" x2="${x0 + w}" y1="${fy(v)}" y2="${fy(v)}"/><text class="gt" x="${x0 + w + 4}" y="${fy(v) + 4}">${k}</text>`; });
  const pts = list.map((e, i) => `${fx(i).toFixed(1)},${fy(e.score100).toFixed(1)}`).join(" ");
  if (list.length > 1) s += `<polygon class="area" points="${fx(0)},${y0} ${pts} ${fx(list.length - 1)},${y0}"/><polyline class="line" points="${pts}"/>`;
  list.forEach((e, i) => {
    const lastPt = i === list.length - 1;
    s += `<circle class="${lastPt ? "pt end" : "pt"}" cx="${fx(i)}" cy="${fy(e.score100)}" r="${lastPt ? 5 : 3.5}"/>`;
    if (lastPt) s += `<text class="pv" x="${fx(i)}" y="${fy(e.score100) - 10}" text-anchor="middle">${fmtPts(e.score100)}</text>`;
  });
  return s + `</svg></div>`;
}

/* ---------- 错题本 ---------- */
function viewWrong(tab) {
  tab = tab || "due";
  const due = Store.dueList(), all = Store.wrongList(), mastered = Store.masteredList(), fav = Store.data.fav.filter(id => BANK.qMap[id]);
  const tabs = [["due", `今日待复习 ${due.length}`], ["all", `全部错题 ${all.length}`], ["done", `已掌握 ${mastered.length}`], ["fav", `收藏 ${fav.length}`]];
  let h = pageHead("错题本", "做错的题自动收进来。错题要隔天再做对，连续3次答对才算真正掌握，会自动移到“已掌握”。");
  h += `<div class="seg" role="tablist">${tabs.map(([k, t]) => `<a role="tab" href="#wrong/${k}" class="${tab === k ? "on" : ""}">${t}</a>`).join("")}</div>`;
  const list = tab === "due" ? due : tab === "all" ? all : tab === "done" ? mastered : fav;
  if (tab === "due") {
    h += due.length ? `<div class="banner info"><span>今天有 ${due.length} 道错题到了复习时间。</span><button type="button" class="btn primary sm" data-act="reviewDue">开始复习</button></div>`
      : `<div class="empty"><p>今天没有到期的错题。</p>${all.length ? `<p class="muted">错题本里还有 ${all.length} 道题，按计划会在后面几天提醒你复习。想现在练也可以：</p><button type="button" class="btn" data-act="wrongAll">全部错题重做一遍</button>` : `<p class="muted">去做几道题吧，做错的题会自动收进这里。</p>`}</div>`;
  }
  if (tab === "all" && all.length) h += `<div class="row wrap"><button type="button" class="btn primary" data-act="wrongAll">全部重做（${all.length}）</button></div>`;
  if (tab === "fav" && fav.length) h += `<div class="row wrap"><button type="button" class="btn primary" data-act="favAll">练习收藏的题（${fav.length}）</button></div>`;
  if (list.length) {
    const groups = groupBy(list.map(id => BANK.qMap[id]), q => q.ch);
    const chs = Array.from(groups.keys()).sort((a, b) => BANK.chMap[a].order - BANK.chMap[b].order);
    for (const ch of chs) {
      const qs = groups.get(ch);
      h += `<section class="wgroup"><div class="wg-h"><h3>${esc(BANK.chMap[ch].bookName)} · ${esc(BANK.chMap[ch].name)} <small>${qs.length} 题</small></h3>
        ${tab !== "done" ? `<button type="button" class="linkbtn" data-act="wrongCh" data-ch="${ch}" data-tab="${tab}">练这一组</button>` : ""}</div><ul class="wlist">`;
      for (const q of qs) {
        const r = Store.rec(q.id) || {};
        const box = r.b || 0;
        h += `<li><button type="button" class="wq" data-act="openQ" data-qid="${esc(q.id)}"><span class="wq-t">${esc(stripText(q.t === "c" ? (q.title || q.m || "") : q.q)).slice(0, 70)}</span>
          <span class="wq-m">${Engine.typeLabel(q)}${tab === "all" || tab === "due" ? ` · 复习进度 <span class="boxdots">${[0, 1, 2].map(k => `<i class="${k < box ? "on" : ""}"></i>`).join("")}</span>` : ""}${r.a ? ` · 做过 ${r.a} 次，对 ${r.c} 次` : ""}</span></button>
          ${tab === "all" || tab === "due" ? `<button type="button" class="linkbtn" data-act="markMastered" data-qid="${esc(q.id)}">已掌握</button>` : tab === "done" ? `<button type="button" class="linkbtn" data-act="restoreWrong" data-qid="${esc(q.id)}">放回错题本</button>` : `<button type="button" class="linkbtn" data-act="unfav" data-qid="${esc(q.id)}">取消收藏</button>`}</li>`;
      }
      h += `</ul></section>`;
    }
  } else if (tab !== "due") {
    h += `<div class="empty"><p>${tab === "done" ? "还没有已掌握的错题。" : tab === "fav" ? "还没有收藏题目。做题时点题目右上角的 ☆ 可以收藏。" : "错题本是空的。"}</p></div>`;
  }
  return { html: h, title: "错题本" };
}
function stripText(s) { return String(s || "").replace(/<[^>]+>/g, "").replace(/\*\*|==/g, "").replace(/_{4,}/g, "____"); }

function viewNotFound() {
  return { html: `<div class="empty"><p>页面不存在。</p><a class="btn primary" href="#home">回到首页</a></div>`, title: "未找到" };
}

function paperTotal(p) { return p.mcq.length * p.mcqPt + sum(p.cases, id => (BANK.qMap[id] && BANK.qMap[id].p) || 0); }

function optLayout(opts) {
  const len = Math.max(...opts.map(o => stripText(o).length));
  return len <= 6 ? "o4" : len <= 15 ? "o2" : "o1";
}

function paperHtml(p, opts) {
  opts = opts || {};
  const total = paperTotal(p);
  let n = 0;
  let h = `<section class="paper">
    <header class="p-head"><h1 class="p-title">${esc(p.title)}</h1>
    <p class="p-sub">（满分 ${total} 分，考试时间 ${p.minutes} 分钟）</p>
    <p class="p-info">学校__________　班级__________　姓名__________　考号__________</p></header>`;
  if (p.mcq.length) {
    h += `<p class="p-sec">一、选择题（本大题共 ${p.mcq.length} 小题，每小题 ${p.mcqPt} 分，共 ${p.mcq.length * p.mcqPt} 分。在每小题给出的四个选项中，只有一项是符合题目要求的）</p><ol class="p-qs">`;
    for (const id of p.mcq) {
      const q = BANK.qMap[id]; n++;
      if (!q) continue;
      const order = permFor(p.seed, id, q);
      const ops = order.map(i => q.o[i]);
      h += `<li class="p-q"><div class="p-stem"><span class="p-n">${n}.</span>${fmt(q.q, !q.custom)}（　　）</div>${q.fig ? figHtml(q.fig, { zoom: false }) : ""}
        <div class="p-opts ${optLayout(ops)}">${ops.map((o, k) => `<span>${LETTERS[k]}. ${fmt(o, !q.custom)}</span>`).join("")}</div>
        ${opts.edit ? `<span class="p-edit no-print"><button type="button" class="linkbtn" data-act="swapQ" data-qid="${esc(id)}">换一题</button><button type="button" class="linkbtn" data-act="dropQ" data-qid="${esc(id)}">删除</button></span>` : ""}</li>`;
    }
    h += `</ol>`;
  }
  if (p.cases.length) {
    const cp = sum(p.cases, id => (BANK.qMap[id] && BANK.qMap[id].p) || 0);
    h += `<p class="p-sec">${p.mcq.length ? "二" : "一"}、非选择题（本大题共 ${p.cases.length} 小题，共 ${cp} 分）</p><ol class="p-qs">`;
    for (const id of p.cases) {
      const q = BANK.qMap[id]; n++;
      if (!q) continue;
      h += `<li class="p-q case"><div class="p-stem"><span class="p-n">${n}.</span>（${q.p}分）${q.title ? fmt(q.title, !q.custom) : ""}</div>`;
      if (q.m) h += `<div class="p-mat">${fmt(q.m, !q.custom)}</div>`;
      if (q.fig) h += figHtml(q.fig, { zoom: false });
      h += `<ol class="p-subs">`;
      q.subs.forEach((sub, i) => {
        h += `<li><span class="p-sn">（${i + 1}）</span>${fmt(sub.q, !q.custom)}`;
        if (sub.t === "s") {
          const order = permFor(p.seed, `${id}#${i}`, sub);
          const ops = order.map(k => sub.o[k]);
          h += `（　　）<div class="p-opts ${optLayout(ops)}">${ops.map((o, k) => `<span>${LETTERS[k]}. ${fmt(o, !q.custom)}</span>`).join("")}</div>`;
        } else if (sub.t === "j") h += `（　　）`;
        else if (sub.t === "f" && !/_{4,}/.test(sub.q)) h += `<span class="blank"></span>`;
        else if (sub.t === "o") h += `<div class="p-lines"><i></i><i></i></div>`;
        h += `</li>`;
      });
      h += `</ol>${opts.edit ? `<span class="p-edit no-print"><button type="button" class="linkbtn" data-act="swapQ" data-qid="${esc(id)}">换一题</button><button type="button" class="linkbtn" data-act="dropQ" data-qid="${esc(id)}">删除</button></span>` : ""}</li>`;
    }
    h += `</ol>`;
  }
  h += `<p class="p-foot">本卷题目选自“${APP_NAME}”原创题库，供练习使用。</p></section>`;
  return h;
}

function paperKeyHtml(p) {
  let h = `<section class="paper key"><header class="p-head"><h1 class="p-title">${esc(p.title)} · 参考答案与解析</h1></header>`;
  if (p.mcq.length) {
    h += `<p class="p-sec">一、选择题（每小题 ${p.mcqPt} 分）</p><table class="keytbl"><tbody>`;
    const rows = [];
    for (let i = 0; i < p.mcq.length; i += 10) rows.push(p.mcq.slice(i, i + 10).map((id, k) => ({ id, n: i + k + 1 })));
    for (const r of rows) {
      h += `<tr>${r.map(x => `<th>${x.n}</th>`).join("")}</tr><tr>${r.map(x => {
        const q = BANK.qMap[x.id]; if (!q) return "<td>—</td>";
        const order = permFor(p.seed, x.id, q); return `<td>${LETTERS[order.indexOf(q.a)]}</td>`;
      }).join("")}</tr>`;
    }
    h += `</tbody></table><ol class="p-ana">`;
    p.mcq.forEach((id, k) => { const q = BANK.qMap[id]; if (q) h += `<li><b>${k + 1}.</b> ${fmt(q.e || "", !q.custom)}</li>`; });
    h += `</ol>`;
  }
  if (p.cases.length) {
    h += `<p class="p-sec">${p.mcq.length ? "二" : "一"}、非选择题</p><ol class="p-ana">`;
    p.cases.forEach((id, k) => {
      const q = BANK.qMap[id]; if (!q) return;
      h += `<li><b>${p.mcq.length + k + 1}.</b>（${q.p}分）<ol class="p-subans">`;
      q.subs.forEach((sub, i) => {
        let ans;
        if (sub.t === "s") { const order = permFor(p.seed, `${id}#${i}`, sub); ans = LETTERS[order.indexOf(sub.a)]; }
        else if (sub.t === "j") ans = sub.a ? "正确" : "错误";
        else if (sub.t === "f") ans = esc((sub.a || []).join(" 或 "));
        else ans = fmt(sub.a, true);
        h += `<li>（${i + 1}）${ans}（${sub.p}分）${sub.e ? `<span class="muted">　${fmt(sub.e, true)}</span>` : ""}</li>`;
      });
      h += `</ol>${q.e ? `<p class="muted">${fmt(q.e, !q.custom)}</p>` : ""}</li>`;
    });
    h += `</ol>`;
  }
  h += `</section>`;
  return h;
}

function viewSearch() {
  const h = pageHead("搜索题目", "输入关键词，在题干、选项、解析和速查手册中查找。开卷考试前用它练习“快速定位知识点”也很有效。") +

  return { html: h, title: "搜索", after() { const el = $("#searchInput"); if (el && Search.last) { el.value = Search.last; Search.run(Search.last); } } };
}
const Search = {
  last: "", timer: 0,
  run(kw) {
    this.last = kw;
    const box = $("#searchRes");
    if (!box) return;
    const k = norm(kw);
    if (k.length < 1) { box.innerHTML = ""; return; }
    const hits = [];
    for (const q of BANK.qs) {
      if (q.auto) continue;
      const text = q.t === "c" ? [q.title, q.m].concat(q.subs.map(s => s.q + " " + (Array.isArray(s.a) ? s.a.join(" ") : s.a))).join(" ") : [q.q].concat(q.o || []).join(" ");
      const all = norm(stripText(text + " " + (q.e || "") + " " + (q.kp || "")));
      if (all.includes(k)) hits.push(q);
      if (hits.length >= 80) break;
    }
    const hb = [];
    for (const ch of BANK.chapters) {
      const d = BANK.hb[ch.id];
      if (!d) continue;
      for (const s of d.secs || []) {
        const t = norm(stripText([s.h].concat(s.pts || [], s.tip || []).join(" ")));
        if (t.includes(k)) hb.push({ ch, s });
      }
    }
    let h = "";
    if (hb.length) {
      h += `<h3 class="sr-h">速查手册 ${hb.length} 处</h3><ul class="sr-list">${hb.slice(0, 20).map(x => `<li><a href="#hbc/${x.ch.id}"><b>${esc(stripText(x.s.h))}</b><small>${esc(x.ch.bookName)} · ${esc(x.ch.name)}</small></a></li>`).join("")}</ul>`;
    }
    h += `<h3 class="sr-h">题目 ${hits.length >= 80 ? "80+" : hits.length} 道</h3>`;
    if (!hits.length) h += `<p class="muted">没有找到包含“${esc(kw)}”的题目。</p>`;
    else {
      h += `<div class="row"><button type="button" class="btn sm" data-act="searchPractice">把这些题做一遍</button></div><ul class="sr-list">`;
      h += hits.slice(0, 50).map(q => `<li><button type="button" data-act="openQ" data-qid="${esc(q.id)}"><b>${esc(stripText(q.t === "c" ? (q.title || q.m) : q.q).slice(0, 80))}</b><small>${Engine.typeLabel(q)} · ${esc(BANK.chOf(q).name)}</small></button></li>`).join("");
      h += `</ul>`;
    }
    this.hits = hits.map(q => q.id);
    box.innerHTML = h;
  }
};

/* 解析从 Excel 粘贴的题目 */
function parseImport(text) {
  const out = [], errs = [];
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  const findCh = s => {
    s = String(s || "").trim();
    if (BANK.chMap[s]) return s;
    const n = norm(s);
    const c = BANK.chapters.find(c => norm(c.name) === n) || BANK.chapters.find(c => n && (norm(c.name).includes(n) || n.includes(norm(c.name))));
    return c ? c.id : null;
  };
  lines.forEach((line, i) => {
    let cols = line.split("\t");
    if (cols.length < 4) cols = line.split(/[,，]/);
    cols = cols.map(c => c.trim());
    const [chS, typeS, stem, A, B, C, D, ansS, exp] = cols;
    if (i === 0 && /章节|题干/.test(line)) return;
    const ch = findCh(chS);
    if (!ch) { errs.push(`第${i + 1}行：找不到章节“${chS || ""}”`); return; }
    if (!stem) { errs.push(`第${i + 1}行：题干为空`); return; }
    const isJudge = /判断/.test(typeS || "");
    const id = "X:" + uid() + i;
    if (isJudge) {
      const a = /^(对|√|✓|正确|T|true|是|Y)$/i.test(ansS || "") ? true : /^(错|×|✗|错误|F|false|否|N)$/i.test(ansS || "") ? false : null;
      if (a == null) { errs.push(`第${i + 1}行：判断题答案应为“对”或“错”`); return; }
      out.push({ id, ch, t: "j", d: 2, kp: "自定义", q: stem, a, e: exp || "" });
    } else {
      const opts = [A, B, C, D].filter(x => x != null && x !== "");
      const ai = LETTERS.indexOf(String(ansS || "").trim().toUpperCase());
      if (opts.length < 2 || ai < 0 || ai >= opts.length) { errs.push(`第${i + 1}行：选项或答案不完整`); return; }
      out.push({ id, ch, t: "s", d: 2, kp: "自定义", q: stem, o: opts, a: ai, e: exp || "" });
    }
  });
  return { out, errs };
}

/* ---- src/app/main.js ---- */
/* =========================================================
 * 路由、事件分发、启动
 * ========================================================= */
let ROUTE = "home";

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function route() {
  const h = decodeURIComponent((location.hash || "#home").slice(1));
  const [name, a, b] = h.split("/");
  switch (name) {
    case "": case "home": return viewHome();
    case "practice": return viewPractice();
    case "ch": return viewChapter(a);
    case "special": return viewSpecial();
    case "run": return viewRun();
    case "grade": return viewGrade();
    case "result": return viewResult(a);
    case "exam": return viewExam();
    case "wrong": return viewWrong(a);
    case "hb": return viewHandbook();
    case "hbc": return viewHbChapter(a);
    case "tips": return viewTips();
    case "teacher": return viewTeacher();
    case "paper": return viewPaper(a);
    case "class": return viewClass();
    case "search": return viewSearch();
    case "me": return viewMe();
    case "about": return viewAbout();
    default: return viewNotFound();
  }
}

function render() {
  const h = decodeURIComponent((location.hash || "#home").slice(1));
  ROUTE = h || "home";
  if (!h.startsWith("run")) clearInterval(Exam.timer);
  let view;
  try { view = route(); }
  catch (err) {
    console.error(err);
    view = { html: `<div class="empty"><p>页面出错了：${esc(err.message)}</p><a class="btn primary" href="#home">回到首页</a></div>`, title: "出错" };
  }
  const app = $("#app");
  const keepScroll = app.dataset.route === ROUTE;
  const y = window.scrollY;
  app.innerHTML = shell(view, ROUTE);
  app.dataset.route = ROUTE;
  document.title = `${view.title ? view.title + " · " : ""}${APP_NAME}`;
  window.scrollTo(0, keepScroll ? y : 0);
  if (view.after) view.after();
}

/* 只重绘当前题目（作答时不跳动页面） */
function rerunQuestion() {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function applyTheme() {
  const st = Store.settings;
  const root = document.documentElement;
  if (st.theme === "light" || st.theme === "dark") root.setAttribute("data-theme", st.theme);
  else root.removeAttribute("data-theme");
  root.setAttribute("data-font", st.font || "m");
}

/* ---------- 开始各种练习 ---------- */
function startPractice(opts) {
  if (Engine.start(Object.assign({ mode: "instant" }, opts))) { Persist.saveSess(); go("#run"); }
}
function chQs(chId, filter) {
  return BANK.byCh[chId].filter(filter || (() => true));
}
function orderedChQs(chId) {
  /* 顺序练习：先单选判断（自动识图题放后面），再非选择题 */
  /* 识图训练题不放进顺序练习，单独在“识图训练”里做 */
  const qs = BANK.byCh[chId].filter(q => !q.auto);
  const rank = q => q.t === "c" ? 1 : 0;
  return qs.slice().sort((a, b) => rank(a) - rank(b));
}

/* ---------- 事件处理 ---------- */
const ACT = {
  closeModal() { UI.closeModal(); },
  confirmOk() { const cb = UI._confirmCb; UI._confirmCb = null; UI.closeModal(); if (cb) cb(); },
  promptOk() { const v = ($("#promptInput") || {}).value; const cb = UI._promptCb; UI._promptCb = null; UI.closeModal(); if (cb) cb((v || "").trim()); },

  /* 首页 */
  daily() {
    let d = Daily.get();
    if (!d || d.done) d = Daily.make();
    startPractice({ kind: "daily", title: "每日一练", ids: d.ids, back: "#home" });
  },
  reviewDue() {
    const ids = shuffle(Store.dueList());
    startPractice({ kind: "review", title: "复习到期错题", ids, back: "#wrong" });
  },
  resume() {
    if (Persist.resume()) go(Engine.sess.mode === "grading" ? "#grade" : "#run");
  },
  dropResume() { UI.confirm("放弃这次未完成的练习/模考？已经做过的题目记录会保留。", "放弃", () => { Persist.clearSess(); Engine.sess = null; render(); }); },

  /* 章节 */
  chSeq(el) {
    const ch = el.dataset.ch;
    const ids = orderedChQs(ch).map(q => q.id);
    let start = Store.getSeq("ch:" + ch);
    if (start >= ids.length) start = 0;
    startPractice({ kind: "seq", title: BANK.chMap[ch].name + " · 顺序练习", ids, start, seqKey: "ch:" + ch, back: "#ch/" + ch });
  },
  chRandom(el) {
    const ch = el.dataset.ch;
    const ids = pickN(chQs(ch, q => q.t !== "c"), 10).map(q => q.id);
    startPractice({ title: BANK.chMap[ch].name + " · 随机10题", ids, back: "#ch/" + ch });
  },
  chUnseen(el) {
    const ch = el.dataset.ch;
    const ids = chQs(ch, q => !q.auto && !Store.rec(q.id)).map(q => q.id);
    if (!ids.length) { UI.toast("本章题目都做过了，试试随机练习或错题"); return; }
    startPractice({ title: BANK.chMap[ch].name + " · 未做过的题", ids, back: "#ch/" + ch });
  },
  chWrong(el) {
    const ch = el.dataset.ch;
    const ids = chQs(ch, q => { const r = Store.rec(q.id); return r && r.in; }).map(q => q.id);
    startPractice({ kind: "review", title: BANK.chMap[ch].name + " · 错题", ids, back: "#ch/" + ch });
  },
  chCase(el) {
    const ch = el.dataset.ch;
    startPractice({ title: BANK.chMap[ch].name + " · 非选择题", ids: chQs(ch, q => q.t === "c").map(q => q.id), back: "#ch/" + ch });
  },
  chFig(el) {
    const ch = el.dataset.ch;
    startPractice({ title: BANK.chMap[ch].name + " · 识图训练", ids: shuffle(chQs(ch, q => q.auto)).map(q => q.id), back: "#ch/" + ch });
  },
  kp(el) {
    const ch = el.dataset.ch, kp = el.dataset.kp;
    startPractice({ title: kp, ids: chQs(ch, q => (q.kp || "其他") === kp).map(q => q.id), back: "#ch/" + ch });
  },

  /* 专项 */
  spCase(el) {
    const ct = el.dataset.ct;
    const ids = shuffle(BANK.qs.filter(q => q.t === "c" && q.ct === ct)).map(q => q.id);
    startPractice({ title: CASE_NAME[ct] + "专练", ids, back: "#special" });
  },
  spJudge() { startPractice({ title: "易错判断题", ids: pickN(BANK.qs.filter(q => q.t === "j"), 20).map(q => q.id), back: "#special" }); },
  spTag(el) {
    const t = el.dataset.tag;
    const pool = BANK.qs.filter(q => q.tags && q.tags.includes(t) && q.t !== "c");
    startPractice({ title: (t === "情境" ? "生活情境题" : t + "题"), ids: pickN(pool, 20).map(q => q.id), back: "#special" });
  },
  spMix() { startPractice({ title: "全册随机20题", ids: pickN(BANK.qs.filter(q => q.t === "s" && !q.auto), 20).map(q => q.id), back: "#special" }); },
  spFig(el) {
    const f = el.dataset.fig;
    const qs = BANK.qs.filter(q => q.fig === f);
    const ids = shuffle(qs.filter(q => q.auto)).concat(qs.filter(q => !q.auto)).map(q => q.id);
    startPractice({ title: BANK.figs[f].title, ids, back: "#special" });
  },

  /* 做题 */
  pick(el) {
    const s = Engine.sess; if (!s) return;
    const qid = s.ids[s.idx], q = BANK.qMap[qid], A = Engine.ans(qid);
    const k = Number(el.dataset.k);
    if (s.mode === "exam") { A.sel = A.sel === k ? null : k; Persist.saveSess(); rerunQuestion(); return; }
    if (s.mode !== "instant" || A.done) return;
    A.sel = k; A.ok = Engine.perm(qid, q)[k] === q.a; A.done = true;
    Engine.record(q, A);
    Persist.saveSess();
    if (A.ok && Store.settings.autoNext && s.idx < s.ids.length - 1) {
      rerunQuestion();
      setTimeout(() => { if (Engine.sess === s && s.ids[s.idx] === qid) ACT.next(); }, 650);
      return;
    }
    rerunQuestion();
  },
  judge(el) {
    const s = Engine.sess; if (!s) return;
    const qid = s.ids[s.idx], q = BANK.qMap[qid], A = Engine.ans(qid);
    const v = el.dataset.v === "1";
    if (s.mode === "exam") { A.sel = A.sel === v ? null : v; Persist.saveSess(); rerunQuestion(); return; }
    if (s.mode !== "instant" || A.done) return;
    A.sel = v; A.ok = v === q.a; A.done = true;
    Engine.record(q, A);
    Persist.saveSess();
    rerunQuestion();
  },
  subPick(el) { subAnswer(el, "s"); },
  subJudge(el) { subAnswer(el, "j"); },
  subFill(el) { subAnswer(el, "f"); },
  subOpen(el) {
    const s = Engine.sess; const qid = s.ids[s.idx]; const A = Engine.ans(qid);
    const i = Number(el.dataset.si);
    const box = $(`#open-${cssEsc(qid)}-${i}`);
    const a = A.subs[i] || (A.subs[i] = {});
    a.val = box ? box.value : "";
    a.done = true; a.sc = null;
    Persist.saveSess();
    rerunQuestion();
  },
  subSelf(el) {
    const s = Engine.sess; const qid = s.ids[s.idx]; const q = BANK.qMap[qid]; const A = Engine.ans(qid);
    const i = Number(el.dataset.si);
    const a = A.subs[i];
    a.sc = Number(el.dataset.v); a.ok = a.sc >= (q.subs[i].p || 0);
    afterSub(q, A);
  },
  subSelfReset(el) {
    const s = Engine.sess; const qid = s.ids[s.idx]; const A = Engine.ans(qid);
    const a = A.subs[Number(el.dataset.si)]; if (a) { a.sc = null; rerunQuestion(); }
  },
  subOverride(el) {
    const s = Engine.sess; const qid = s.ids[s.idx]; const q = BANK.qMap[qid]; const A = Engine.ans(qid);
    const i = Number(el.dataset.si); const a = A.subs[i];
    if (A.recorded) return;
    a.ok = true; a.sc = q.subs[i].p || 0;
    afterSub(q, A);
  },
  fav(el) {
    const on = Store.toggleFav(el.dataset.qid);
    UI.toast(on ? "已收藏" : "已取消收藏");
    if (ROUTE.startsWith("run")) rerunQuestion(); else render();
  },
  unfav(el) { Store.toggleFav(el.dataset.qid); render(); },
  next() {
    const s = Engine.sess; if (!s) return;
    commitCase();
    if (s.idx < s.ids.length - 1) {
      s.idx++;
      if (s.seqKey) Store.setSeq(s.seqKey, s.idx);
      Persist.saveSess();
      render();
    }
  },
  prev() {
    const s = Engine.sess; if (!s || s.idx === 0) return;
    commitCase();
    s.idx--; Persist.saveSess(); render();
  },
  jump(el) {
    const s = Engine.sess; UI.closeAll();
    commitCase();
    s.idx = Number(el.dataset.i);
    if (s.seqKey) Store.setSeq(s.seqKey, s.idx);
    Persist.saveSess(); render();
  },
  sheet() { UI.modal(sheetHtml(), { title: "答题卡" }); },
  quit() {
    const s = Engine.sess;
    if (!s) { go("#home"); return; }
    commitCase();
    if (s.mode === "exam") {
      UI.confirm("模考还没交卷。现在退出会保留进度，回到首页可以继续；计时不会暂停。", "先退出", () => { Persist.saveSess(); go(s.back || "#exam"); });
      return;
    }
    if (s.mode === "review" || s.mode === "class") { const b = s.back; Engine.sess = null; go(b || "#home"); return; }
    if (s.seqKey) {
      const q = BANK.qMap[s.ids[s.idx]], A = s.ans[s.ids[s.idx]];
      const done = A && (q.t === "c" ? q.subs.every((_, i) => A.subs[i] && A.subs[i].done) : A.done);
      Store.setSeq(s.seqKey, done ? s.idx + 1 : s.idx);
    }
    UI.modal(runSummaryHtml(), { title: "本次练习", onClose: null });
  },
  finishRun() {
    const s = Engine.sess;
    commitCase();
    if (s && s.seqKey) Store.setSeq(s.seqKey, s.ids.length);
    if (s && s.kind === "daily" && Store.data.daily) { Store.data.daily.done = true; Store.save(); }
    UI.modal(runSummaryHtml(), { title: "本次练习" });
  },
  leaveRun() {
    const s = Engine.sess;
    UI.closeAll();
    Persist.clearSess();
    const back = s ? s.back : "#home";
    Engine.sess = null;
    go(back || "#home");
  },
  redoWrongNow() {
    const s = Engine.sess;
    const ids = s.ids.filter(id => { const q = BANK.qMap[id], A = s.ans[id]; if (!A) return false; if (q.t === "c") { const sc = Engine.caseScore(q, A); return sc.got < sc.max * 0.8; } return A.done && !A.ok; });
    UI.closeAll();
    startPractice({ kind: "review", title: "重做错题", ids, back: s.back });
  },
  toggleNames(el) {
    const s = Engine.sess;
    const card = el.closest(".qcard");
    if (s && card) { s.names[card.dataset.qid] = !s.names[card.dataset.qid]; rerunQuestion(); return; }
    const fig = el.closest(".fig"); if (fig) { fig.classList.toggle("names"); el.textContent = fig.classList.contains("names") ? "隐藏名称" : "显示名称"; }
  },
  zoomFig(el) {
    const id = el.dataset.fig;
    const f = BANK.figs[id];
    const card = el.closest(".qcard");
    const s = Engine.sess;
    const showNames = !card ? true : !!(s && s.names[card.dataset.qid]);
    UI.modal(`<div class="zoom">${figHtml(id, { names: showNames, zoom: false, toggle: true })}</div>`, { title: f.title, wide: true });
  },
  classReveal() {
    const s = Engine.sess; const A = Engine.ans(s.ids[s.idx]); A.reveal = !A.reveal; rerunQuestion();
  },

  /* 模考 */
  startMock(el) { Exam.startMock(el.dataset.kind || "full"); },
  submitExam() {
    UI.closeAll();
    const n = Exam.unanswered();
    UI.confirm(n ? `还有 <b>${n}</b> 题没有作答，确定交卷吗？` : "全部题目都已作答，确定交卷吗？", "交卷", () => Exam.submit());
  },
  gradeSelf(el) {
    const s = Engine.sess; const A = s.ans[el.dataset.qid]; const i = Number(el.dataset.si);
    A.subs[i].sc = Number(el.dataset.v);
    Persist.saveSess();
    if (!Exam.pendingSelf().length) Exam.finish(); else render();
  },
  gradeFill(el) {
    const s = Engine.sess; const q = BANK.qMap[el.dataset.qid]; const A = s.ans[el.dataset.qid]; const i = Number(el.dataset.si);
    const a = A.subs[i];
    if (el.dataset.v === "1") { a.ok = true; a.sc = q.subs[i].p; }
    else { a.val = ""; a.sc = 0; }   // 标记为已处理
    Persist.saveSess();
    if (!Exam.pendingSelf().length) Exam.finish(); else render();
  },
  finishExam() { Exam.finish(); },
  reviewExam(el) {
    const rec = Store.data.exams.find(e => e.id === el.dataset.id);
    if (rec) Exam.reviewRecord(rec);
  },
  redoExamWrong(el) {

    if (rec) startPractice({ kind: "review", title: "重做模考错题", ids: rec.wrong, back: "#result/" + rec.id });
  },

  /* 错题本 */
  wrongAll() { startPractice({ kind: "review", title: "全部错题", ids: shuffle(Store.wrongList()), back: "#wrong/all" }); },
  favAll() { startPractice({ title: "收藏的题", ids: Store.data.fav.filter(id => BANK.qMap[id]), back: "#wrong/fav" }); },
  wrongCh(el) {
