BANK.add("u3c2", [
  /* —— 水的利用与散失 —— */
  { id: "u3c2-001", t: "s", d: 1, kp: "蒸腾作用", q: "植物根吸收的水分，绝大部分用于", o: ["蒸腾作用", "光合作用", "呼吸作用", "构成细胞"], a: 0, e: "植物吸收的水分约99%通过蒸腾作用散失到大气中，只有少部分用于光合作用等生命活动。", tags: ["高频"] },
  { id: "u3c2-002", t: "s", d: 1, kp: "蒸腾作用", q: "植物进行蒸腾作用的主要器官是", o: ["叶", "根", "茎", "花"], a: 0, e: "蒸腾作用主要通过叶片上的气孔进行，叶是蒸腾作用的主要器官。" },
  { id: "u3c2-003", t: "s", d: 2, kp: "蒸腾作用", q: "下列关于蒸腾作用意义的叙述，**错误**的是", o: ["为植物制造有机物提供原料", "促进根从土壤中吸收水分", "促进水和无机盐在体内的运输", "降低叶片温度，避免叶片被灼伤"], a: 0, e: "蒸腾作用能拉动水和无机盐的吸收与运输、降低叶温，还能增加大气湿度、参与水循环；制造有机物是光合作用。", tags: ["高频"] },
  { id: "u3c2-004", t: "s", d: 2, kp: "蒸腾作用", q: "“大树底下好乘凉”，主要是因为树木能进行", o: ["蒸腾作用", "光合作用", "呼吸作用", "吸收作用"], a: 0, e: "蒸腾作用散失水分时会带走热量，降低周围温度，增加空气湿度；树冠遮阴也有作用。", tags: ["情境"] },
  { id: "u3c2-005", t: "s", d: 2, kp: "蒸腾作用", q: "移栽植物时剪去部分枝叶，选择阴天或傍晚进行，主要是为了", o: ["降低蒸腾作用，减少水分散失", "降低光合作用", "降低呼吸作用", "促进根的生长"], a: 0, e: "移栽时根受损吸水能力下降，减少叶片、避开强光可以降低蒸腾作用，减少水分散失，提高成活率。", tags: ["高频"] },
  { id: "u3c2-006", t: "s", d: 1, kp: "气孔", q: "植物体内的水分以水蒸气状态散失到大气中的“门户”是", o: ["气孔", "保卫细胞", "导管", "筛管"], a: 0, e: "气孔是植物蒸腾失水的“门户”，也是气体交换的“窗口”。" },
  { id: "u3c2-007", t: "s", d: 2, kp: "气孔", q: "气孔的张开和闭合由什么控制", o: ["保卫细胞", "表皮细胞", "叶肉细胞", "叶脉"], a: 0, e: "气孔由一对半月形的保卫细胞围成，保卫细胞吸水膨胀时气孔张开，失水收缩时气孔闭合。" },
  { id: "u3c2-008", t: "s", d: 2, kp: "气孔", q: "把新鲜的叶片放入70℃左右的热水中，发现叶片下表面产生的气泡比上表面多，说明", o: ["叶片下表皮的气孔比上表皮多", "叶片下表皮的细胞比上表皮多", "叶片上表皮没有气孔", "下表皮的叶绿体多"], a: 0, e: "热水使叶片内气体受热膨胀从气孔逸出，下表面气泡多，说明下表皮气孔数目多。", tags: ["实验"] },
  { id: "u3c2-009", t: "s", d: 2, kp: "叶片的结构", q: "叶片的正面（上表面）一般比背面颜色深，原因是", o: ["靠近上表皮的栅栏组织细胞含叶绿体多", "上表皮细胞含叶绿体多", "上表皮细胞颜色深", "海绵组织在上面"], a: 0, e: "栅栏组织靠近上表皮，细胞排列整齐，含叶绿体较多；海绵组织靠近下表皮，含叶绿体较少。表皮细胞一般不含叶绿体。", tags: ["易错"] },
  { id: "u3c2-010", t: "s", d: 2, kp: "叶片的结构", q: "叶片的表皮细胞无色透明，这有利于", o: ["光线透过，使叶肉细胞进行光合作用", "保护叶片", "减少水分散失", "运输有机物"], a: 0, e: "表皮细胞无色透明，光线可以透过，照射到叶肉细胞，有利于光合作用。" },
  { id: "u3c2-011", t: "s", d: 2, kp: "物质的运输", q: "植物体内运输水和无机盐的结构及方向是", o: ["导管，自下而上", "筛管，自上而下", "导管，自上而下", "筛管，自下而上"], a: 0, e: "导管位于木质部，把根吸收的水和无机盐自下而上运输；筛管位于韧皮部，把叶制造的有机物运输到其他器官。", tags: ["高频"] },
  { id: "u3c2-012", t: "s", d: 2, kp: "物质的运输", q: "把带叶的芹菜叶柄插入稀释的红墨水中，放在阳光下，一段时间后切开叶柄，被染红的是", o: ["导管", "筛管", "形成层", "表皮"], a: 0, e: "红墨水随水分在导管中向上运输，所以导管被染红。阳光下蒸腾作用强，运输更快。", tags: ["实验"] },
  { id: "u3c2-013", t: "s", d: 3, kp: "物质的运输", q: "在树干上环剥一圈树皮，一段时间后，切口上方会形成节瘤。这是因为", o: ["树皮中的筛管被切断，有机物在切口上方积累", "导管被切断，水分积累", "树木的呼吸作用增强", "细菌感染"], a: 0, e: "筛管在树皮（韧皮部）中，向下运输有机物。环剥切断了筛管，有机物在切口上方积累，形成节瘤；时间长了根得不到有机物会死亡。", tags: ["易错"] },
  { id: "u3c2-014", t: "s", d: 2, kp: "物质的运输", q: "给移栽的大树“打针输液”补充水和无机盐，针头应插入树干的", o: ["木质部（导管）", "韧皮部（筛管）", "树皮表面", "髓"], a: 0, e: "水和无机盐由导管运输，导管位于木质部，所以针头要插入木质部。", tags: ["情境"] },
  { id: "u3c2-015", t: "s", d: 3, kp: "物质的运输", q: "根毛细胞能从土壤中吸水的条件是", o: ["根毛细胞液浓度大于土壤溶液浓度", "根毛细胞液浓度小于土壤溶液浓度", "两者浓度相等", "与浓度无关"], a: 0, e: "细胞液浓度大于周围溶液浓度时细胞吸水，反之失水。盐碱地、施肥过多时，土壤溶液浓度高，植物会失水萎蔫。" },

  /* —— 光合作用 —— */
  { id: "u3c2-016", t: "s", d: 1, kp: "光合作用的概念", q: "光合作用的原料是", o: ["二氧化碳和水", "有机物和氧气", "二氧化碳和氧气", "水和无机盐"], a: 0, e: "光合作用：二氧化碳＋水 →（光能，叶绿体）有机物（储存能量）＋氧气。", tags: ["高频"] },
  { id: "u3c2-017", t: "s", d: 1, kp: "光合作用的概念", q: "绿色植物进行光合作用的场所是", o: ["叶绿体", "线粒体", "细胞核", "液泡"], a: 0, e: "叶绿体是光合作用的场所；线粒体是呼吸作用的场所。" },
  { id: "u3c2-018", t: "s", d: 1, kp: "光合作用的概念", q: "光合作用的产物是", o: ["有机物和氧气", "二氧化碳和水", "有机物和二氧化碳", "氧气和水"], a: 0, e: "光合作用把二氧化碳和水转化成储存能量的有机物（主要是淀粉），并释放氧气。" },
  { id: "u3c2-019", t: "s", d: 2, kp: "光合作用的概念", q: "光合作用过程中的能量转化是", o: ["光能转化为储存在有机物中的化学能", "化学能转化为光能", "化学能转化为热能", "热能转化为化学能"], a: 0, e: "光合作用把光能转化为化学能，储存在制造的有机物中。" },
  { id: "u3c2-020", t: "s", d: 1, kp: "光合作用的实验", q: "“绿叶在光下制造有机物”实验中，把天竺葵放在黑暗处一昼夜，目的是", o: ["把叶片中原有的淀粉运走耗尽", "让叶片吸收更多二氧化碳", "降低叶片温度", "使叶片的气孔张开"], a: 0, e: "暗处理使叶片中原有的淀粉被运走和消耗，排除对实验结果的干扰，保证检验到的淀粉是实验过程中新制造的。", tags: ["高频", "实验"] },
  { id: "u3c2-021", t: "s", d: 2, kp: "光合作用的实验", q: "“绿叶在光下制造有机物”实验中，用黑纸片把叶片的一部分从上下两面遮盖起来，目的是", o: ["形成见光与不见光的对照", "防止叶片被晒伤", "减少水分散失", "便于识别叶片"], a: 0, e: "遮光部分与见光部分形成对照，实验变量是光。", tags: ["实验"] },
  { id: "u3c2-022", t: "s", d: 2, kp: "光合作用的实验", q: "把叶片放入盛有酒精的小烧杯中隔水加热，目的是", o: ["使叶片中的叶绿素溶解到酒精中（脱色）", "杀死叶片细胞", "使淀粉溶解", "使叶片变软"], a: 0, e: "酒精能溶解叶绿素，脱色后便于观察碘液染色的颜色变化。酒精易燃，所以要隔水加热。", tags: ["实验", "高频"] },
  { id: "u3c2-023", t: "s", d: 2, kp: "光合作用的实验", q: "酒精脱色时要“隔水加热”，原因是", o: ["酒精易燃，直接加热容易引起燃烧", "让叶片受热均匀", "节约酒精", "加快叶绿素溶解"], a: 0, e: "酒精的燃点低，直接加热可能着火，所以把小烧杯放在盛水的大烧杯中加热。", tags: ["实验", "易错"] },
  { id: "u3c2-024", t: "s", d: 2, kp: "光合作用的实验", q: "滴加碘液后，叶片见光部分变蓝，遮光部分不变蓝。这说明", o: ["光是光合作用的必要条件，淀粉是光合作用的产物", "叶绿体是光合作用的场所", "光合作用产生了氧气", "二氧化碳是光合作用的原料"], a: 0, e: "变蓝说明有淀粉，见光部分产生淀粉而遮光部分没有，说明光合作用需要光，产物有淀粉。", tags: ["高频"] },
  { id: "u3c2-025", t: "s", d: 2, kp: "光合作用的实验", q: "“绿叶在光下制造有机物”实验的正确步骤是：①滴加碘液　②暗处理　③隔水加热脱色　④观察颜色　⑤部分遮光　⑥清水漂洗　⑦光照几小时", o: ["②⑤⑦③⑥①④", "⑤②⑦③①⑥④", "②⑦⑤③⑥①④", "②⑤⑦⑥③①④"], a: 0, fig: "starchexp", e: "暗处理→部分遮光→光照→摘叶去纸片后酒精脱色→清水漂洗→滴碘液→观察。", tags: ["实验", "高频"] },
  { id: "u3c2-026", t: "s", d: 2, kp: "光合作用的实验", q: "将金鱼藻放在盛满清水的试管中，在阳光下会产生气泡。收集气体后用带火星的卫生香检验，卫生香复燃，说明光合作用产生了", o: ["氧气", "二氧化碳", "水蒸气", "氮气"], a: 0, e: "氧气能使带火星的卫生香（木条）复燃。", tags: ["实验"] },
  { id: "u3c2-027", t: "s", d: 3, kp: "光合作用的实验", q: "把两盆同样的天竺葵分别放在两个密闭的玻璃罩内，甲罩内放一杯氢氧化钠溶液，乙罩内放一杯清水，光照后检验叶片中的淀粉。这个实验探究的是", o: ["二氧化碳是否是光合作用的原料", "光是否是光合作用的条件", "水是否是光合作用的原料", "光合作用是否产生氧气"], a: 0, e: "氢氧化钠溶液能吸收二氧化碳，甲罩内缺少二氧化碳，乙罩内有二氧化碳，变量是二氧化碳。结果甲叶片不变蓝，乙变蓝。", tags: ["实验"] },
  { id: "u3c2-028", t: "s", d: 3, kp: "光合作用的实验", q: "银边天竺葵叶片边缘呈白色（不含叶绿体）。经暗处理、光照后，用碘液检验，叶片边缘不变蓝，中间绿色部分变蓝。这说明", o: ["叶绿体是光合作用的场所", "光是光合作用的条件", "二氧化碳是光合作用的原料", "光合作用产生氧气"], a: 0, e: "银边与绿色部分的区别是有无叶绿体，只有含叶绿体的部分产生淀粉，说明光合作用需要叶绿体。", tags: ["实验"] },
  { id: "u3c2-029", t: "s", d: 2, kp: "光合作用的意义", q: "绿色植物被称为生物圈中的“生产者”，主要是因为它能", o: ["通过光合作用制造有机物", "进行呼吸作用", "进行蒸腾作用", "吸收水和无机盐"], a: 0, e: "绿色植物通过光合作用制造有机物，不仅满足自身需要，也为其他生物提供食物和能量。" },
  { id: "u3c2-030", t: "s", d: 2, kp: "光合作用的意义", q: "绿色植物在维持生物圈碳—氧平衡中起重要作用，是因为它通过光合作用", o: ["吸收二氧化碳，释放氧气", "吸收氧气，释放二氧化碳", "吸收水分，释放水蒸气", "分解有机物，释放能量"], a: 0, e: "绿色植物通过光合作用不断消耗大气中的二氧化碳，释放氧气，维持碳—氧平衡。", tags: ["高频"] },
  { id: "u3c2-031", t: "s", d: 2, kp: "光合作用的应用", q: "种植农作物时要“合理密植”，主要目的是", o: ["充分利用光照，提高光合作用效率", "增强呼吸作用", "节约种子", "减少病虫害"], a: 0, e: "合理密植使植株叶片充分接受光照，又不互相遮挡，能提高单位面积产量。", tags: ["高频"] },
  { id: "u3c2-032", t: "s", d: 2, kp: "光合作用的应用", q: "在蔬菜大棚中适当增加二氧化碳浓度（施“气肥”），能提高产量，原因是", o: ["二氧化碳是光合作用的原料", "二氧化碳能抑制呼吸作用", "二氧化碳能促进蒸腾作用", "二氧化碳能杀死害虫"], a: 0, e: "二氧化碳是光合作用的原料，适当提高其浓度可以增强光合作用，制造更多有机物。", tags: ["情境"] },
  { id: "u3c2-033", t: "s", d: 2, kp: "光合作用的概念", q: "叶片中能进行光合作用的细胞主要是", o: ["叶肉细胞", "表皮细胞", "导管细胞", "筛管细胞"], a: 0, e: "叶肉细胞含大量叶绿体，是进行光合作用的主要细胞；保卫细胞也含少量叶绿体。" },
  { id: "u3c2-034", t: "s", d: 3, kp: "光合作用的概念", q: "17世纪，海尔蒙特把一棵2.5千克的柳树苗种在装有干燥土壤的木桶里，只浇雨水，5年后柳树增重了约80千克，土壤只减少了约0.1千克。他认为柳树增加的质量主要来自水。现在看来，柳树增加的质量还主要来自", o: ["空气中的二氧化碳", "土壤中的有机物", "木桶", "阳光本身"], a: 0, e: "海尔蒙特忽略了空气。柳树通过光合作用利用二氧化碳和水制造有机物，增加的质量主要来自水和二氧化碳。", tags: ["易错"] },

  /* —— 呼吸作用 —— */
  { id: "u3c2-035", t: "s", d: 1, kp: "呼吸作用的概念", q: "呼吸作用的实质是", o: ["分解有机物，释放能量", "合成有机物，储存能量", "吸收二氧化碳，释放氧气", "吸收水分，散失水分"], a: 0, e: "呼吸作用：有机物＋氧 → 二氧化碳＋水＋能量，实质是分解有机物、释放能量，供生命活动利用。", tags: ["高频"] },
  { id: "u3c2-036", t: "s", d: 1, kp: "呼吸作用的概念", q: "植物进行呼吸作用的主要场所是", o: ["线粒体", "叶绿体", "液泡", "细胞核"], a: 0, e: "呼吸作用主要在线粒体中进行。" },
  { id: "u3c2-037", t: "s", d: 2, kp: "呼吸作用的概念", q: "下列关于植物呼吸作用的叙述，正确的是", o: ["所有活细胞时刻都在进行呼吸作用", "只在白天进行", "只在夜间进行", "只有叶片细胞才进行"], a: 0, e: "呼吸作用不需要光，植物所有活细胞无论白天黑夜都在进行。", tags: ["易错", "高频"] },
  { id: "u3c2-038", t: "s", d: 2, kp: "呼吸作用的实验", q: "把萌发的种子放进瓶中，密封一夜后，将燃烧的蜡烛放入瓶中，蜡烛立即熄灭。这说明萌发的种子", o: ["进行呼吸作用消耗了氧气", "进行呼吸作用产生了二氧化碳", "进行光合作用产生了氧气", "进行蒸腾作用产生了水"], a: 0, e: "氧气能支持燃烧。蜡烛熄灭，说明瓶中氧气被萌发的种子呼吸消耗了。", tags: ["实验", "高频"] },
  { id: "u3c2-039", t: "s", d: 2, kp: "呼吸作用的实验", q: "将萌发种子所在瓶中的气体通入澄清石灰水，石灰水变浑浊，说明种子呼吸作用", o: ["产生了二氧化碳", "消耗了氧气", "产生了水", "释放了热量"], a: 0, e: "二氧化碳能使澄清石灰水变浑浊。", tags: ["实验", "高频"] },
  { id: "u3c2-040", t: "s", d: 2, kp: "呼吸作用的实验", q: "把萌发的种子装在保温瓶中，插入温度计，一段时间后温度升高。这说明种子的呼吸作用", o: ["释放热量", "消耗氧气", "产生二氧化碳", "产生水"], a: 0, e: "呼吸作用释放的能量一部分以热能形式散失，所以温度升高。煮熟的种子不能进行呼吸作用，可以作对照。", tags: ["实验"] },
  { id: "u3c2-041", t: "s", d: 2, kp: "呼吸作用的实验", q: "在探究种子呼吸作用的实验中，常用煮熟的种子作对照，原因是", o: ["煮熟的种子已经死亡，不能进行呼吸作用", "煮熟的种子更容易观察", "煮熟的种子含水多", "煮熟的种子呼吸作用更强"], a: 0, e: "煮熟的种子细胞已死亡，不能进行呼吸作用，与萌发的种子形成对照。", tags: ["实验"] },
  { id: "u3c2-042", t: "s", d: 2, kp: "呼吸作用的应用", q: "农田被水淹后要及时排涝，主要是为了", o: ["保证根进行正常的呼吸作用", "促进根吸收水分", "减少蒸腾作用", "促进光合作用"], a: 0, e: "土壤长期积水缺氧，根无法正常呼吸，会造成烂根，因此要及时排涝。中耕松土也是为了促进根的呼吸。", tags: ["高频"] },
  { id: "u3c2-043", t: "s", d: 2, kp: "呼吸作用的应用", q: "储藏粮食时，要保持低温和干燥，主要目的是", o: ["抑制呼吸作用，减少有机物的消耗", "促进呼吸作用", "抑制光合作用", "防止水分蒸发"], a: 0, e: "低温、干燥都能抑制种子的呼吸作用，减少有机物消耗，延长储藏时间。", tags: ["高频"] },
  { id: "u3c2-044", t: "s", d: 2, kp: "呼吸作用的应用", q: "夜间适当降低蔬菜大棚内的温度，可以提高产量，原因是", o: ["降低呼吸作用，减少有机物消耗", "促进光合作用", "降低蒸腾作用", "促进根吸水"], a: 0, e: "夜间植物不进行光合作用，只进行呼吸作用；适当降温可减弱呼吸作用，减少有机物消耗，有利于有机物积累。", tags: ["情境"] },
  { id: "u3c2-045", t: "s", d: 2, kp: "呼吸作用的应用", q: "卧室里夜间不宜摆放过多的绿色植物，原因是", o: ["夜间植物进行呼吸作用，消耗氧气、释放二氧化碳", "夜间植物进行光合作用，释放二氧化碳", "植物会产生有毒气体", "植物蒸腾作用使空气太潮湿"], a: 0, e: "夜间没有光，植物不进行光合作用，只进行呼吸作用，会与人争夺氧气。", tags: ["情境"] },
  { id: "u3c2-046", t: "s", d: 2, kp: "呼吸作用的应用", q: "新鲜水果用保鲜袋包裹后放入冰箱，可以延长保存时间，主要原因是", o: ["低温和缺氧抑制了呼吸作用", "低温促进了光合作用", "保鲜袋增加了氧气", "冰箱中的光照抑制了腐败"], a: 0, e: "低温和减少氧气都能抑制水果的呼吸作用，减少有机物消耗；低温也能抑制微生物的繁殖。" },

  /* —— 光合作用与呼吸作用的关系 —— */
  { id: "u3c2-047", t: "s", d: 2, kp: "光合作用与呼吸作用", q: "下列关于光合作用和呼吸作用的比较，**错误**的是", o: ["两者都需要光", "光合作用在叶绿体中进行，呼吸作用主要在线粒体中进行", "光合作用合成有机物，呼吸作用分解有机物", "光合作用储存能量，呼吸作用释放能量"], a: 0, e: "光合作用需要光，呼吸作用有光无光都能进行。", tags: ["高频"] },
  { id: "u3c2-048", t: "s", d: 3, kp: "光合作用与呼吸作用", q: "白天光照充足时，植物叶片与外界进行气体交换的情况是", o: ["吸收的二氧化碳多于释放的，释放的氧气多于吸收的", "只吸收氧气，释放二氧化碳", "只进行呼吸作用", "不进行气体交换"], a: 0, e: "白天光合作用强度大于呼吸作用强度，整体表现为吸收二氧化碳、释放氧气；但呼吸作用同时也在进行。", tags: ["易错"] },
  { id: "u3c2-049", t: "s", d: 3, kp: "光合作用与呼吸作用", q: "一株植物在一天中积累有机物最多的时刻，大约在", o: ["傍晚（日落前后）", "清晨（日出前后）", "正午", "午夜"], a: 0, e: "白天光合作用强于呼吸作用，有机物不断积累，直到傍晚光合作用强度降到等于呼吸作用强度时，积累量最多。", tags: ["易错"] },
  { id: "u3c2-050", t: "s", d: 2, kp: "光合作用与呼吸作用", q: "光合作用和呼吸作用的关系是", o: ["相互依存，光合作用为呼吸作用提供有机物和氧，呼吸作用释放的能量供生命活动利用", "两者完全对立，互不相关", "只有光合作用对植物有用", "只有呼吸作用对植物有用"], a: 0, e: "两者相互依存：没有光合作用制造的有机物，呼吸作用就没有原料；没有呼吸作用释放的能量，植物的生命活动就无法进行。" },

  /* —— 植物在自然界中的作用 —— */
  { id: "u3c2-051", t: "s", d: 2, kp: "植物在自然界中的作用", q: "森林被称为“绿色水库”，主要是因为森林能", o: ["涵养水源，保持水土", "制造大量氧气", "吸收有毒气体", "降低噪声"], a: 0, e: "森林的枯枝落叶和土壤能截留、储存雨水，减少地表径流，起到涵养水源、保持水土的作用。" },
  { id: "u3c2-052", t: "s", d: 2, kp: "植物在自然界中的作用", q: "绿色植物通过蒸腾作用参与生物圈的水循环，主要表现为", o: ["提高大气湿度，增加降水", "减少降水", "降低土壤湿度", "吸收地下水使地下水位升高"], a: 0, e: "蒸腾作用把大量水分散失到大气中，提高大气湿度，增加降水，参与水循环。" },
  { id: "u3c2-053", t: "s", d: 2, kp: "植物在自然界中的作用", q: "我国的植树节是", o: ["3月12日", "4月22日", "6月5日", "5月22日"], a: 0, e: "3月12日是我国植树节；4月22日是世界地球日，6月5日是世界环境日，5月22日是国际生物多样性日。" },
  { id: "u3c2-054", t: "s", d: 2, kp: "植物在自然界中的作用", q: "下列做法中，**不利于**保护植被的是", o: ["在草原上大量放牧", "退耕还林还草", "植树造林", "封山育林"], a: 0, e: "过度放牧会使草场退化、沙化；退耕还林还草、植树造林、封山育林都有利于保护植被。" },
  { id: "u3c2-055", t: "s", d: 3, kp: "栽培植物", q: "同学们栽培绿豆芽，想探究光照对豆芽生长的影响，一组放在有光处，另一组放在黑暗处。下列做法**不正确**的是", o: ["两组的温度、水分可以不一样", "两组绿豆的数量和品种相同", "每组用多粒绿豆", "每天定时观察并记录"], a: 0, e: "探究光照的影响，变量只能是光照，温度、水分等其他条件都应相同且适宜。", tags: ["跨学科", "实验"] },

  { id: "u4c3-004", t: "s", d: 2, kp: "呼吸道的作用", q: "鼻腔黏膜中分布着丰富的毛细血管，它的作用是", o: ["温暖吸入的空气", "湿润吸入的空气", "阻挡灰尘", "杀灭细菌"], a: 0, e: "毛细血管中的血液能温暖空气；黏膜分泌的黏液能湿润空气、粘住灰尘和细菌；鼻毛能阻挡灰尘。", tags: ["易错"] },
  { id: "u4c3-005", t: "s", d: 2, kp: "呼吸道的作用", q: "痰是在哪里形成的", o: ["气管和支气管", "鼻腔", "咽", "肺泡"], a: 0, e: "气管和支气管内表面的黏液粘住灰尘、细菌，纤毛向咽部摆动把它们送到咽部，通过咳嗽排出，这就是痰。痰中有病菌，不能随地吐痰。", tags: ["高频"] },
  { id: "u4c3-006", t: "s", d: 2, kp: "呼吸道的作用", q: "吃饭时大声说笑容易被呛到，是因为", o: ["会厌软骨来不及盖住喉口，食物进入气管", "食物进入了鼻腔", "食道收缩", "胃部痉挛"], a: 0, e: "咽是食物和气体的共同通道，吞咽时会厌软骨盖住喉口，若边吃边笑，会厌软骨来不及盖住喉口，食物易误入气管。", tags: ["情境"] },
  { id: "u4c3-007", t: "s", d: 1, kp: "呼吸系统的组成", q: "人体发声的器官是", o: ["喉", "咽", "气管", "鼻"], a: 0, e: "喉既是气体进出的通道，又是发声的器官，喉中有声带。" },
  { id: "u4c3-008", t: "s", d: 2, kp: "呼吸道的作用", q: "用鼻呼吸比用口呼吸好，主要原因是", o: ["鼻腔能使吸入的空气变得温暖、湿润、清洁", "鼻腔能进行气体交换", "用鼻呼吸吸入的氧气更多", "用口呼吸会损伤牙齿"], a: 0, e: "鼻腔内有鼻毛、黏膜和丰富的毛细血管，能清洁、湿润、温暖空气，减少对肺的刺激。" },
  { id: "u4c3-009", t: "s", d: 2, kp: "呼吸道的作用", q: "雾霾天气外出时最好戴口罩，这说明", o: ["呼吸道对空气的处理能力是有限的", "呼吸道不能处理空气", "肺能过滤所有颗粒物", "口罩能提供氧气"], a: 0, e: "呼吸道对空气的清洁能力有限，空气污染严重时仍会危害健康，所以要戴口罩并保护环境。", tags: ["情境"] },
  { id: "u4c3-010", t: "s", d: 2, kp: "呼吸道的作用", q: "呼吸道都有骨或软骨作支架，这能保证", o: ["气体顺畅通过", "空气被温暖", "空气被湿润", "灰尘被阻挡"], a: 0, e: "骨或软骨支架使呼吸道不会塌陷，保证气流通畅。" },

  /* —— 肺与气体交换 —— */
  { id: "u4c3-011", t: "s", d: 2, kp: "肺内的气体交换", q: "下列结构特点中，与肺泡进行气体交换**无关**的是", o: ["肺位于胸腔内", "肺泡数量多", "肺泡外面包绕着丰富的毛细血管", "肺泡壁和毛细血管壁都只由一层上皮细胞构成"], a: 0, e: "肺泡数量多增大了交换面积，毛细血管丰富、壁很薄都有利于气体交换；肺位于胸腔与气体交换功能无直接关系。", tags: ["高频"] },
  { id: "u4c3-012", t: "s", d: 2, kp: "肺内的气体交换", q: "肺泡与血液之间、血液与组织细胞之间的气体交换，都是通过什么实现的", o: ["气体的扩散作用", "呼吸运动", "血液循环", "肌肉收缩"], a: 0, e: "气体总是从浓度高的地方向浓度低的地方扩散，体内的气体交换都是通过扩散作用实现的；肺与外界的气体交换通过呼吸运动实现。", tags: ["易错"] },
  { id: "u4c3-013", t: "s", d: 2, kp: "肺内的气体交换", q: "血液流经肺泡周围的毛细血管后，血液成分的变化是", o: ["氧气增多，二氧化碳减少，由静脉血变成动脉血", "氧气减少，二氧化碳增多，由动脉血变成静脉血", "氧气和二氧化碳都增多", "成分没有变化"], a: 0, e: "肺泡中氧气浓度高，扩散进入血液；血液中二氧化碳浓度高，扩散进入肺泡。血液由含氧少的静脉血变成含氧丰富的动脉血。", tags: ["高频"] },
  { id: "u4c3-014", t: "s", d: 2, kp: "肺内的气体交换", q: "血液流经组织细胞周围的毛细血管后，变成了", o: ["含氧少、颜色暗红的静脉血", "含氧多、颜色鲜红的动脉血", "含氧多的静脉血", "成分不变的血液"], a: 0, e: "组织细胞不断消耗氧、产生二氧化碳，血液中的氧扩散进入细胞，细胞中的二氧化碳扩散进入血液，动脉血变成静脉血。" },
  { id: "u4c3-015", t: "s", d: 2, kp: "肺内的气体交换", q: "人体呼出的气体中二氧化碳增多，这些二氧化碳最终来自", o: ["组织细胞的呼吸作用", "肺泡", "血液", "气管"], a: 0, e: "二氧化碳是组织细胞进行呼吸作用（在线粒体中分解有机物）产生的，经血液运输到肺，再呼出体外。", tags: ["易错"] },
  { id: "u4c3-016", t: "s", d: 2, kp: "肺内的气体交换", q: "与吸入的气体相比，人体呼出的气体中", o: ["氧气减少，二氧化碳和水蒸气增多", "氧气增多，二氧化碳减少", "不含氧气", "只有二氧化碳"], a: 0, e: "呼出气体中氧气约16%、二氧化碳约4%，与吸入气体（氧气约21%、二氧化碳约0.03%）相比氧减少、二氧化碳和水增多，但仍含较多氧气。", tags: ["高频"] },
  { id: "u4c3-017", t: "s", d: 2, kp: "肺内的气体交换", q: "用吸管向澄清的石灰水中吹气，石灰水变浑浊，说明", o: ["呼出的气体中含有较多的二氧化碳", "呼出的气体中含有较多的氧气", "呼出的气体中只有二氧化碳", "石灰水变质了"], a: 0, e: "二氧化碳能使澄清石灰水变浑浊，呼出气体中二氧化碳含量较多。", tags: ["实验"] },

  /* —— 呼吸运动 —— */
  { id: "u4c3-018", t: "s", d: 2, kp: "呼吸运动", q: "吸气时，肋间肌和膈肌的状态以及胸廓、肺的变化是", o: ["收缩；胸廓扩大，肺扩张", "舒张；胸廓扩大，肺扩张", "收缩；胸廓缩小，肺回缩", "舒张；胸廓缩小，肺回缩"], a: 0, e: "吸气时肋间肌和膈肌收缩，膈顶部下降，胸廓容积扩大，肺随之扩张，肺内气压低于外界，气体进入肺。", tags: ["高频"] },
  { id: "u4c3-019", t: "s", d: 2, kp: "呼吸运动", q: "膈肌收缩时，膈顶部", o: ["下降，胸廓上下径增大", "上升，胸廓上下径缩小", "下降，胸廓上下径缩小", "上升，胸廓上下径增大"], a: 0, e: "膈肌收缩时膈顶部下降，胸廓上下径增大，完成吸气。" },
  { id: "u4c3-020", t: "s", d: 2, kp: "呼吸运动", q: "呼气时，肺内气压与外界大气压的关系是", o: ["肺内气压高于外界大气压", "肺内气压低于外界大气压", "两者相等", "无法比较"], a: 0, e: "呼气时胸廓缩小，肺回缩，肺内气压高于外界大气压，气体排出。" },
  { id: "u4c3-021", t: "s", d: 2, kp: "呼吸运动", q: "在模拟膈肌运动的模型中，气球、橡皮膜分别模拟", o: ["肺、膈", "气管、肺", "胸廓、膈", "肺、胸廓"], a: 0, e: "玻璃管模拟气管（和支气管），气球模拟肺，钟罩模拟胸廓，橡皮膜模拟膈。", fig: "belljar", tags: ["高频"] },
  { id: "u4c3-022", t: "s", d: 2, kp: "呼吸运动", q: "用手向下拉模型底部的橡皮膜，气球会胀大，这模拟的是", o: ["吸气过程，膈肌收缩", "呼气过程，膈肌收缩", "吸气过程，膈肌舒张", "呼气过程，膈肌舒张"], a: 0, e: "橡皮膜下拉模拟膈肌收缩、膈顶部下降，胸廓容积扩大，气球（肺）扩张，模拟吸气。", tags: ["实验"] },
  { id: "u4c3-023", t: "s", d: 3, kp: "呼吸运动", q: "模拟膈肌运动的模型**不能**模拟的是", o: ["胸廓前后、左右径的变化", "膈顶部的升降", "肺的扩张和回缩", "气体进出肺"], a: 0, e: "钟罩是硬的，不能改变前后、左右径，只能模拟膈的运动引起的上下径变化。", tags: ["易错"] },
  { id: "u4c3-024", t: "s", d: 2, kp: "呼吸运动", q: "肺与外界进行气体交换（肺的通气）是通过什么实现的", o: ["呼吸运动", "气体扩散", "血液循环", "细胞的呼吸作用"], a: 0, e: "肺与外界的气体交换是通过呼吸运动实现的；肺泡与血液、血液与组织细胞之间的气体交换通过扩散实现。" },
  { id: "u4c3-025", t: "s", d: 3, kp: "呼吸运动", q: "图中曲线表示一次呼吸过程中肺内气压与外界气压的差。曲线AB段表示的过程和膈肌状态是", o: ["吸气，膈肌收缩", "呼气，膈肌收缩", "吸气，膈肌舒张", "呼气，膈肌舒张"], a: 0, fig: "lungpress", e: "AB段气压差小于0，肺内气压低于外界气压，表示吸气，此时肋间肌和膈肌收缩。BC段表示呼气。", tags: ["识图"] },
  { id: "u4c3-026", t: "s", d: 2, kp: "呼吸运动", q: "人在平静状态下，每分钟呼吸的次数叫呼吸频率。下列做法能提高肺活量的是", o: ["经常进行体育锻炼", "长期卧床休息", "吸烟", "经常熬夜"], a: 0, e: "体育锻炼能使呼吸肌更发达，提高肺活量。" },
  { id: "u4c3-027", t: "s", d: 3, kp: "呼吸运动", q: "测量胸围差和肺活量时都要测三次，对数据的处理分别是", o: ["胸围差取平均值，肺活量取最大值", "都取平均值", "都取最大值", "胸围差取最大值，肺活量取平均值"], a: 0, e: "胸围差是深吸气与深呼气时胸围长度之差，测三次取平均值；肺活量是尽力吸气后再尽力呼出的气体量，测三次取最大值。", tags: ["易错"] },
  { id: "u4c3-028", t: "s", d: 2, kp: "呼吸运动", q: "溺水的人呼吸困难甚至死亡，主要是因为", o: ["肺与外界的气体交换受阻", "肺泡与血液的气体交换受阻", "血液与组织细胞的气体交换受阻", "水进入了胃"], a: 0, e: "溺水时水进入呼吸道，阻碍了肺与外界的气体交换。" },
  { id: "u4c3-029", t: "s", d: 3, kp: "肺内的气体交换", q: "煤气中毒（一氧化碳中毒）使人缺氧，原因是一氧化碳", o: ["与血红蛋白结合，使血液运输氧的能力降低", "阻塞了呼吸道", "使肺泡破裂", "使膈肌不能收缩"], a: 0, e: "一氧化碳与血红蛋白的结合能力比氧强得多，使血红蛋白失去运输氧的能力，造成组织缺氧。", tags: ["情境"] },
  { id: "u4c3-030", t: "s", d: 2, kp: "呼吸运动", q: "人体呼吸的全过程依次是：①肺泡与血液的气体交换　②肺与外界的气体交换　③血液与组织细胞的气体交换　④气体在血液中的运输", o: ["②①④③", "①②③④", "②④①③", "①④②③"], a: 0, e: "外界空气经呼吸运动进入肺（肺的通气）→肺泡与血液进行气体交换→氧随血液运输到组织→血液与组织细胞进行气体交换。" },
  { id: "u4c3-031", t: "s", d: 2, kp: "呼吸系统的组成", q: "吸气时，外界空气进入肺的途径是", o: ["鼻→咽→喉→气管→支气管→肺", "鼻→喉→咽→气管→支气管→肺", "鼻→咽→气管→喉→支气管→肺", "口→食道→气管→支气管→肺"], a: 0, e: "呼吸道依次为鼻、咽、喉、气管、支气管。", tags: ["高频"] },
  { id: "u4c3-032", t: "s", d: 2, kp: "呼吸道的作用", q: "长期吸烟容易引发慢性支气管炎甚至肺癌，下列说法正确的是", o: ["烟草烟雾中的尼古丁、焦油等有害物质会损伤呼吸道和肺", "吸烟能使肺活量增大", "吸烟只危害自己，不危害他人", "偶尔吸烟没有任何危害"], a: 0, e: "烟草烟雾含尼古丁、焦油等多种有害物质，损伤呼吸系统；吸二手烟同样有害。", tags: ["情境"] },

  /* 判断题 */
  { id: "u4c3-j01", t: "j", d: 1, kp: "呼吸系统的组成", q: "呼吸道是气体交换的场所。", a: false, e: "气体交换的场所是肺（肺泡）。" },
  { id: "u4c3-j02", t: "j", d: 2, kp: "呼吸道的作用", q: "呼吸道对空气的处理能力是无限的。", a: false, e: "处理能力是有限的。" },
  { id: "u4c3-j03", t: "j", d: 1, kp: "呼吸道的作用", q: "痰是在气管和支气管中形成的。", a: true, e: "由黏液、灰尘和细菌等组成。" },
  { id: "u4c3-j04", t: "j", d: 2, kp: "肺内的气体交换", q: "人体呼出的气体中不含氧气。", a: false, e: "呼出气体中仍含有约16%的氧气。" },
  { id: "u4c3-j05", t: "j", d: 2, kp: "呼吸运动", q: "吸气时，膈肌收缩，膈顶部上升。", a: false, e: "膈肌收缩时膈顶部下降。" },
  { id: "u4c3-j06", t: "j", d: 2, kp: "肺内的气体交换", q: "血液流经肺泡后，由静脉血变成动脉血。", a: true, e: "氧气扩散进入血液。" },
  { id: "u4c3-j07", t: "j", d: 2, kp: "肺内的气体交换", q: "肺泡壁和毛细血管壁都只由一层上皮细胞构成，有利于气体交换。", a: true, e: "结构与功能相适应。" },
  { id: "u4c3-j08", t: "j", d: 2, kp: "呼吸运动", q: "测肺活量时应取三次测量的平均值。", a: false, e: "肺活量取最大值。" },
  { id: "u4c3-j09", t: "j", d: 1, kp: "呼吸系统的组成", q: "咽是食物和气体的共同通道。", a: true, e: "吞咽时会厌软骨盖住喉口。" },
  { id: "u4c3-j10", t: "j", d: 2, kp: "肺内的气体交换", q: "人体内的气体交换是通过气体的扩散作用完成的。", a: true, e: "气体从浓度高处向浓度低处扩散。" },

  /* 非选择题 */
  {
    id: "u4c3-c01", t: "c", ct: "识图", d: 1, kp: "呼吸系统的组成", fig: "respsys",
    title: "下图是人体呼吸系统示意图，请据图回答。",
    subs: [

      { t: "f", q: "既是气体通道，又是发声器官的是图中的____（填序号）。", a: ["③", "3", "③喉", "喉"], p: 2 },
      { t: "s", q: "食物和气体的共同通道是", o: ["②咽", "③喉", "④气管", "⑤支气管"], a: 0, p: 2 },
      { t: "s", q: "痰形成的部位是", o: ["④和⑤", "①和②", "⑥", "③"], a: 0, p: 2 },
      { t: "o", q: "图中①～⑤合称呼吸道，它对吸入的空气有什么作用？", a: "使吸入的空气变得温暖、湿润、清洁。", kw: ["温暖", "湿润", "清洁"], p: 2 }
    ],
    e: "呼吸系统由呼吸道（鼻、咽、喉、气管、支气管）和肺组成。呼吸道使空气温暖、湿润、清洁，肺是气体交换的场所。"
  },
  {
    id: "u4c3-c02", t: "c", ct: "识图", d: 2, kp: "呼吸运动", fig: "belljar",
    title: "下图是模拟膈肌运动的模型，请据图回答。",
    subs: [

  { id: "u4c6-004", t: "s", d: 2, kp: "眼与视觉", q: "从明亮的室外走进较暗的电影院，瞳孔的变化是", o: ["由小变大", "由大变小", "不变", "先变大后变小"], a: 0, e: "瞳孔能调节进入眼内的光量：光线强时瞳孔缩小，光线弱时瞳孔扩大。", tags: ["情境"] },
  { id: "u4c6-005", t: "s", d: 2, kp: "眼与视觉", q: "“黑眼球”和“白眼球”分别指的是", o: ["虹膜、巩膜", "瞳孔、角膜", "虹膜、角膜", "视网膜、巩膜"], a: 0, e: "虹膜含色素，决定眼睛的颜色（黄种人多为黑色）；巩膜白色坚韧，是“白眼球”。" },
  { id: "u4c6-006", t: "s", d: 2, kp: "眼与视觉", q: "能够调节晶状体曲度，使人看清远近不同物体的结构是", o: ["睫状体", "虹膜", "脉络膜", "巩膜"], a: 0, e: "睫状体内有平滑肌，能调节晶状体的曲度。看近处物体时晶状体曲度变大，看远处时变小。" },
  { id: "u4c6-007", t: "s", d: 2, kp: "眼与视觉", q: "近视眼的成像特点和矫正方法是", o: ["物像落在视网膜前方，配戴凹透镜", "物像落在视网膜后方，配戴凹透镜", "物像落在视网膜前方，配戴凸透镜", "物像落在视网膜后方，配戴凸透镜"], a: 0, e: "近视眼的晶状体曲度过大或眼球前后径过长，远处物体的物像落在视网膜前方，需配戴凹透镜矫正。", tags: ["高频"] },
  { id: "u4c6-008", t: "s", d: 2, kp: "眼与视觉", q: "下列做法中，**不利于**预防近视的是", o: ["躺在床上看手机", "读写时眼与书本保持约33厘米", "看书40分钟左右远眺几分钟", "认真做眼保健操"], a: 0, e: "预防近视要做到“三要”和“四不要”：不在直射强光下看书，不在光线暗处看书，不躺卧看书，不走路看书。", tags: ["情境"] },
  { id: "u4c6-009", t: "s", d: 3, kp: "眼与视觉", q: "某人眼球结构完好，却看不见东西，可能发生病变的部位是", o: ["视神经或大脑皮层的视觉中枢", "角膜", "晶状体", "瞳孔"], a: 0, e: "眼球结构完好，说明能在视网膜上形成物像，看不见可能是视神经或视觉中枢出了问题。", tags: ["易错"] },
  { id: "u4c6-010", t: "s", d: 2, kp: "眼与视觉", q: "眼球中对光线起主要折射作用、相当于照相机镜头的是", o: ["晶状体", "角膜", "玻璃体", "瞳孔"], a: 0, e: "晶状体透明、有弹性，像双凸透镜，对光线起主要折射作用。" },

  /* —— 耳与听觉 —— */
  { id: "u4c6-011", t: "s", d: 1, kp: "耳与听觉", q: "听觉形成的部位是", o: ["大脑皮层的听觉中枢", "耳蜗", "鼓膜", "听小骨"], a: 0, e: "耳蜗内有听觉感受器，产生神经冲动；听觉在大脑皮层的听觉中枢形成。", tags: ["高频"] },
  { id: "u4c6-012", t: "s", d: 2, kp: "耳与听觉", q: "能接受声波刺激、产生神经冲动的听觉感受器位于", o: ["耳蜗", "鼓膜", "半规管", "前庭"], a: 0, e: "耳蜗内有对声波敏感的感觉细胞，能产生神经冲动。", tags: ["高频"] },
  { id: "u4c6-013", t: "s", d: 2, kp: "耳与听觉", q: "听觉形成过程中，声波传导的正确途径是", o: ["外耳道→鼓膜→听小骨→耳蜗→听神经→听觉中枢", "外耳道→听小骨→鼓膜→耳蜗→听神经→听觉中枢", "鼓膜→外耳道→听小骨→耳蜗→听觉中枢→听神经", "外耳道→鼓膜→耳蜗→听小骨→听神经→听觉中枢"], a: 0, e: "声波经外耳道使鼓膜振动，听小骨把振动传到内耳，刺激耳蜗内的感觉细胞产生神经冲动，经听神经传到大脑皮层的听觉中枢。" },
  { id: "u4c6-014", t: "s", d: 2, kp: "耳与听觉", q: "有的人乘车、乘船时会晕车、晕船，与之有关的结构是", o: ["前庭和半规管", "耳蜗", "鼓膜", "外耳道"], a: 0, e: "前庭和半规管内有感受头部位置变动的感受器，过于敏感的人容易晕车晕船。" },
  { id: "u4c6-015", t: "s", d: 2, kp: "耳与听觉", q: "遇到巨大声响时，要迅速张开口，或闭嘴同时双手堵耳，目的是", o: ["使鼓膜内外气压平衡，保护鼓膜", "保护耳蜗", "保护听小骨", "防止声波进入"], a: 0, e: "张口可以使咽鼓管张开，鼓膜内外气压平衡，避免鼓膜被震破。", tags: ["情境"] },
  { id: "u4c6-016", t: "s", d: 2, kp: "耳与听觉", q: "患感冒时如果不及时治疗，病菌可能通过哪个结构进入中耳，引起中耳炎", o: ["咽鼓管", "外耳道", "听神经", "半规管"], a: 0, e: "咽鼓管连通咽和鼓室，咽部的病菌可以经咽鼓管进入中耳。" },

  /* —— 神经系统的组成 —— */
  { id: "u4c6-017", t: "s", d: 1, kp: "神经系统的组成", q: "人体神经系统的组成是", o: ["脑、脊髓和它们发出的神经", "大脑、小脑和脑干", "脑和脊髓", "脑神经和脊神经"], a: 0, e: "神经系统由脑、脊髓和它们发出的神经组成。脑和脊髓是中枢神经系统，脑神经和脊神经是周围神经系统。", tags: ["高频"] },
  { id: "u4c6-018", t: "s", d: 1, kp: "神经系统的组成", q: "神经系统结构和功能的基本单位是", o: ["神经元", "神经", "反射弧", "神经纤维"], a: 0, e: "神经元（神经细胞）是神经系统结构和功能的基本单位，由细胞体和突起组成。", tags: ["高频"] },
  { id: "u4c6-019", t: "s", d: 2, kp: "神经系统的组成", q: "神经元的功能是", o: ["接受刺激，产生并传导兴奋（神经冲动）", "收缩和舒张", "保护和分泌", "运输氧气"], a: 0, e: "神经元能接受刺激，产生并传导神经冲动。" },
  { id: "u4c6-020", t: "s", d: 1, kp: "神经系统的组成", q: "调节人体生命活动的最高级中枢位于", o: ["大脑皮层", "小脑", "脑干", "脊髓"], a: 0, e: "大脑皮层上有许多重要的神经中枢，如躯体运动中枢、躯体感觉中枢、语言中枢、视觉中枢、听觉中枢等，是最高级中枢。" },
  { id: "u4c6-021", t: "s", d: 2, kp: "神经系统的组成", q: "醉酒的人走路摇晃、站立不稳，主要是因为酒精麻痹了", o: ["小脑", "大脑", "脑干", "脊髓"], a: 0, e: "小脑能使运动协调、准确，维持身体平衡。", tags: ["高频"] },
  { id: "u4c6-022", t: "s", d: 2, kp: "神经系统的组成", q: "脑干受到损伤会危及生命，因为脑干中有", o: ["调节心跳、呼吸、血压等的中枢", "语言中枢", "视觉中枢", "维持平衡的中枢"], a: 0, e: "脑干中有调节心跳、呼吸、血压等基本生命活动的中枢。", tags: ["高频"] },
  { id: "u4c6-023", t: "s", d: 2, kp: "神经系统的组成", q: "脊髓的功能是", o: ["反射和传导", "只有反射", "只有传导", "形成感觉"], a: 0, e: "脊髓中有一些低级的神经中枢，能完成一些基本反射；白质能把神经冲动传到脑，并把脑的指令传到身体各部分。" },
  { id: "u4c6-024", t: "s", d: 2, kp: "神经系统的组成", q: "“植物人”有心跳、呼吸，但不能自主活动、没有意识，他的脑中没有受到损伤的部位可能是", o: ["脑干", "大脑", "小脑", "大脑和小脑"], a: 0, e: "“植物人”的心跳、呼吸等基本生命活动正常，说明调节这些活动的脑干没有受损。" },

  /* —— 反射与反射弧 —— */
  { id: "u4c6-025", t: "s", d: 1, kp: "反射与反射弧", q: "神经调节的基本方式是", o: ["反射", "反射弧", "神经冲动", "激素调节"], a: 0, e: "神经调节的基本方式是反射，完成反射的结构基础是反射弧。", tags: ["高频"] },
  { id: "u4c6-026", t: "s", d: 1, kp: "反射与反射弧", q: "完成反射的结构基础是", o: ["反射弧", "神经元", "脊髓", "大脑"], a: 0, e: "反射弧包括感受器、传入神经、神经中枢、传出神经和效应器五部分。" },
  { id: "u4c6-027", t: "s", d: 2, kp: "反射与反射弧", q: "反射弧中神经冲动传导的正确途径是", o: ["感受器→传入神经→神经中枢→传出神经→效应器", "效应器→传出神经→神经中枢→传入神经→感受器", "感受器→传出神经→神经中枢→传入神经→效应器", "神经中枢→传入神经→感受器→传出神经→效应器"], a: 0, e: "神经冲动沿感受器→传入神经→神经中枢→传出神经→效应器的方向传导。", tags: ["高频"] },
  { id: "u4c6-028", t: "s", d: 3, kp: "反射与反射弧", q: "某人的传出神经受损，但反射弧的其他部分正常。当他的手被针刺时，会", o: ["有感觉，但不能缩手", "没有感觉，能缩手", "既有感觉，又能缩手", "既没有感觉，也不能缩手"], a: 0, e: "传出神经受损，神经冲动不能传到效应器，不能缩手；但冲动能沿脊髓的白质上传到大脑皮层，所以有感觉。", tags: ["易错"] },
  { id: "u4c6-029", t: "s", d: 2, kp: "反射与反射弧", q: "下列反射中，属于非条件反射（简单反射）的是", o: ["膝跳反射", "望梅止渴", "谈虎色变", "听到上课铃声走进教室"], a: 0, e: "膝跳反射、眨眼反射、缩手反射、排尿反射等是生来就有的非条件反射；望梅止渴、谈虎色变等是后天形成的条件反射。", tags: ["高频"] },
  { id: "u4c6-030", t: "s", d: 2, kp: "反射与反射弧", q: "人类特有的条件反射是", o: ["谈虎色变", "望梅止渴", "膝跳反射", "老马识途"], a: 0, e: "与语言、文字有关的条件反射是人类特有的，如谈虎色变、听故事流泪。望梅止渴是看到梅子，动物也能形成类似的条件反射。", tags: ["易错"] },
  { id: "u4c6-031", t: "s", d: 2, kp: "反射与反射弧", q: "条件反射与非条件反射的主要区别是", o: ["条件反射是后天形成的，需要大脑皮层参与", "条件反射是生来就有的", "非条件反射需要大脑皮层参与", "两者的神经中枢都在脊髓"], a: 0, e: "非条件反射生来就有，神经中枢在大脑皮层以下；条件反射在生活中逐渐形成，需要大脑皮层的参与。" },
  { id: "u4c6-032", t: "s", d: 2, kp: "反射与反射弧", q: "膝跳反射的神经中枢位于", o: ["脊髓", "大脑皮层", "小脑", "脑干"], a: 0, e: "膝跳反射是非条件反射，神经中枢位于脊髓。", tags: ["实验"] },
  { id: "u4c6-033", t: "s", d: 3, kp: "反射与反射弧", q: "某人因车祸腰部脊髓受伤，导致下肢瘫痪、小便失禁，原因是", o: ["脊髓的传导功能被破坏，大脑不能控制下肢运动和排尿", "排尿反射的反射弧被破坏", "膀胱受损", "大脑皮层受损"], a: 0, e: "腰部以下的排尿反射弧仍完整，能排尿，但脊髓传导功能受损，大脑不能控制，因此小便失禁、下肢不能自主运动。", tags: ["易错"] },
  { id: "u4c6-034", t: "s", d: 2, kp: "反射与反射弧", q: "手指被针扎后迅速缩回，然后才感到疼痛。这说明", o: ["缩手反射的中枢在脊髓，痛觉在大脑皮层形成", "缩手反射的中枢在大脑", "痛觉在脊髓形成", "缩手和痛觉同时由大脑控制"], a: 0, e: "缩手反射是由脊髓完成的简单反射，路径短；痛觉要传到大脑皮层才形成，所以先缩手后感到疼。" },

  /* —— 运动 —— */
  { id: "u4c6-035", t: "s", d: 1, kp: "运动系统", q: "人体的运动系统主要由哪几部分组成", o: ["骨、关节和骨骼肌", "骨、骨骼肌和神经", "骨、关节和血管", "肌肉、神经和关节"], a: 0, e: "运动系统主要由骨、关节和骨骼肌组成。", tags: ["高频"] },
  { id: "u4c6-036", t: "s", d: 2, kp: "运动系统", q: "关节中能减少骨与骨之间的摩擦、使关节灵活的结构是", o: ["关节软骨和关节腔中的滑液", "关节囊", "关节头和关节窝", "韧带"], a: 0, e: "关节软骨减少摩擦、缓冲震动，关节腔中的滑液也能减少摩擦，使关节灵活；关节囊使关节牢固。", tags: ["高频"] },
  { id: "u4c6-037", t: "s", d: 2, kp: "运动系统", q: "使关节牢固的结构是", o: ["关节囊", "关节软骨", "关节腔", "滑液"], a: 0, e: "关节囊由结缔组织构成，包绕着整个关节，把相邻两骨牢固地联系起来，囊外还有韧带。" },
  { id: "u4c6-038", t: "s", d: 2, kp: "运动系统", q: "“脱臼”是指", o: ["关节头从关节窝里滑脱出来", "骨折", "关节软骨磨损", "肌肉拉伤"], a: 0, e: "进行剧烈运动时，关节头可能从关节窝中滑脱，这就是脱臼。" },
  { id: "u4c6-039", t: "s", d: 2, kp: "运动系统", q: "屈肘时，肱二头肌和肱三头肌的状态分别是", o: ["收缩、舒张", "舒张、收缩", "都收缩", "都舒张"], a: 0, fig: "elbow", e: "屈肘时肱二头肌收缩、肱三头肌舒张；伸肘时肱三头肌收缩、肱二头肌舒张。", tags: ["高频"] },
  { id: "u4c6-040", t: "s", d: 3, kp: "运动系统", q: "手提重物时，手臂自然下垂，此时肱二头肌和肱三头肌的状态是", o: ["都收缩", "都舒张", "肱二头肌收缩，肱三头肌舒张", "肱二头肌舒张，肱三头肌收缩"], a: 0, e: "提重物时两组肌肉都要收缩才能维持姿势；双臂自然下垂（不提物体）时两者都舒张。", tags: ["易错"] },
  { id: "u4c6-041", t: "s", d: 2, kp: "运动系统", q: "一块骨骼肌两端的肌腱一般附着在", o: ["不同的骨上", "同一块骨上", "关节上", "神经上"], a: 0, e: "骨骼肌两端的肌腱跨过关节，分别附着在不同的骨上，收缩时才能牵动骨绕关节活动。" },
  { id: "u4c6-042", t: "s", d: 2, kp: "运动系统", q: "在运动中，骨、关节和骨骼肌分别起的作用是", o: ["杠杆、支点、动力", "支点、杠杆、动力", "动力、支点、杠杆", "杠杆、动力、支点"], a: 0, e: "骨骼肌收缩提供动力，牵动骨（杠杆）绕关节（支点）活动。" },
  { id: "u4c6-043", t: "s", d: 2, kp: "运动系统", q: "关于人体运动的叙述，**错误**的是", o: ["只要运动系统完好，就能完成各种运动", "运动需要神经系统的控制和调节", "运动所需能量来自肌肉细胞的呼吸作用", "运动需要消化、呼吸、循环等系统的配合"], a: 0, e: "运动不仅靠运动系统，还需要神经系统的调节以及消化、呼吸、循环等系统提供能量。" },

  /* —— 激素调节 —— */
  { id: "u4c6-044", t: "s", d: 2, kp: "激素调节", q: "内分泌腺与外分泌腺的主要区别是", o: ["内分泌腺没有导管，分泌物直接进入腺体内的毛细血管", "内分泌腺有导管", "内分泌腺分泌的是消化液", "外分泌腺分泌激素"], a: 0, e: "内分泌腺没有导管，分泌的激素直接进入血液；外分泌腺（如汗腺、唾液腺、肝脏）的分泌物通过导管排出。", tags: ["高频"] },
  { id: "u4c6-045", t: "s", d: 2, kp: "激素调节", q: "下列腺体中，属于内分泌腺的是", o: ["甲状腺", "汗腺", "唾液腺", "肝脏"], a: 0, e: "垂体、甲状腺、肾上腺、胰岛、性腺等是内分泌腺；汗腺、唾液腺、肝脏等是外分泌腺。" },
  { id: "u4c6-046", t: "s", d: 2, kp: "激素调节", q: "某人身材矮小但智力正常，可能是幼年时期哪种激素分泌不足", o: ["生长激素", "甲状腺激素", "胰岛素", "性激素"], a: 0, e: "幼年生长激素分泌不足会患侏儒症（身材矮小、智力正常）；幼年甲状腺激素不足会患呆小症（身材矮小、智力低下）。", tags: ["高频", "易错"] },

  { id: "u4c7-001", t: "s", d: 1, kp: "传染病及其预防", q: "传染病是由什么引起的", o: ["病原体", "遗传物质改变", "营养缺乏", "激素分泌异常"], a: 0, e: "传染病是由病原体（细菌、病毒、真菌、寄生虫等）引起的，能在人与人之间或人与动物之间传播的疾病。", tags: ["高频"] },
  { id: "u4c7-002", t: "s", d: 1, kp: "传染病及其预防", q: "传染病具有的特点是", o: ["传染性和流行性", "遗传性和传染性", "流行性和遗传性", "免疫性和遗传性"], a: 0, e: "传染病具有传染性和流行性的特点。" },
  { id: "u4c7-003", t: "s", d: 1, kp: "传染病及其预防", q: "传染病能够流行，必须同时具备的三个基本环节是", o: ["传染源、传播途径、易感人群", "病原体、传染源、传播途径", "病原体、传播途径、易感人群", "传染源、病原体、易感人群"], a: 0, e: "传染病流行必须同时具备传染源、传播途径和易感人群三个基本环节，缺少任何一个环节，传染病就流行不起来。", tags: ["高频"] },
  { id: "u4c7-004", t: "s", d: 2, kp: "传染病及其预防", q: "流行性感冒期间，从传染病的角度分析，流感患者和流感病毒分别属于", o: ["传染源、病原体", "病原体、传染源", "易感人群、病原体", "传染源、传播途径"], a: 0, e: "能够散播病原体的人或动物是传染源；引起传染病的细菌、病毒等是病原体。", tags: ["易错", "高频"] },
  { id: "u4c7-005", t: "s", d: 2, kp: "传染病及其预防", q: "将传染病患者隔离治疗，属于预防传染病措施中的", o: ["控制传染源", "切断传播途径", "保护易感人群", "消灭病原体"], a: 0, e: "对患者早发现、早报告、早隔离、早治疗，属于控制传染源。", tags: ["高频"] },
  { id: "u4c7-006", t: "s", d: 2, kp: "传染病及其预防", q: "在流感高发季节，教室经常开窗通风、喷洒消毒液，这属于预防措施中的", o: ["切断传播途径", "控制传染源", "保护易感人群", "消灭病原体"], a: 0, e: "通风、消毒、戴口罩、勤洗手、消灭蚊蝇等都属于切断传播途径。" },
  { id: "u4c7-007", t: "s", d: 2, kp: "传染病及其预防", q: "给儿童接种疫苗、加强体育锻炼，属于预防传染病措施中的", o: ["保护易感人群", "控制传染源", "切断传播途径", "治疗患者"], a: 0, e: "预防接种、锻炼身体增强免疫力，都属于保护易感人群。" },
  { id: "u4c7-008", t: "s", d: 2, kp: "传染病及其预防", q: "下列疾病中，属于传染病的是", o: ["肺结核", "糖尿病", "近视", "坏血病"], a: 0, e: "肺结核由结核杆菌引起，能传播，是传染病；糖尿病、近视、坏血病都不是由病原体引起的。", tags: ["高频"] },
  { id: "u4c7-009", t: "s", d: 2, kp: "传染病及其预防", q: "下列传染病中，主要通过饮食传播的是", o: ["细菌性痢疾", "流行性感冒", "疟疾", "狂犬病"], a: 0, e: "细菌性痢疾、甲型肝炎、蛔虫病等主要通过饮食传播；流感通过空气飞沫传播；疟疾通过蚊虫叮咬传播；狂犬病通过动物咬伤传播。" },
  { id: "u4c7-010", t: "s", d: 2, kp: "传染病及其预防", q: "艾滋病是由人类免疫缺陷病毒（HIV）引起的，下列行为**不会**传播艾滋病的是", o: ["与艾滋病患者握手、共同进餐", "共用注射器", "输入带病毒的血液", "母婴传播"], a: 0, e: "艾滋病主要通过血液、性接触和母婴传播，日常的握手、拥抱、共同进餐、共用浴室一般不会传播。", tags: ["高频"] },
  { id: "u4c7-011", t: "s", d: 2, kp: "传染病及其预防", q: "艾滋病病毒主要攻击和破坏人体的", o: ["免疫系统（淋巴细胞）", "消化系统", "运动系统", "生殖系统"], a: 0, e: "HIV主要攻击人体的淋巴细胞，使免疫功能严重缺陷，患者容易被多种病原体感染。" },
  { id: "u4c7-012", t: "s", d: 2, kp: "传染病及其预防", q: "某地暴发诺如病毒感染，患者出现呕吐、腹泻。为防止扩散，学校采取了下列措施，其中属于切断传播途径的是", o: ["对餐具和呕吐物进行消毒，要求饭前便后洗手", "让患病学生居家隔离治疗", "教育学生加强锻炼", "给全体学生检测体温"], a: 0, e: "消毒、洗手阻断了病原体经饮食或接触传播的途径；隔离治疗是控制传染源；加强锻炼是保护易感人群。", tags: ["情境"] },
  { id: "u4c7-013", t: "s", d: 3, kp: "传染病及其预防", q: "对于传染病的预防，下列说法正确的是", o: ["切断任何一个基本环节，就能阻止传染病的流行", "必须同时切断三个环节才能预防", "只要接种疫苗就不会患任何传染病", "病原体就是传染源"], a: 0, e: "传染病流行必须三个环节同时具备，切断其中任意一个环节，传染病就流行不起来。疫苗只对相应的传染病有效。" },

  /* —— 免疫与免疫规划 —— */
  { id: "u4c7-014", t: "s", d: 1, kp: "免疫", q: "人体的第一道防线是", o: ["皮肤和黏膜", "体液中的杀菌物质和吞噬细胞", "免疫器官和免疫细胞", "淋巴细胞产生的抗体"], a: 0, e: "皮肤和黏膜是第一道防线；体液中的杀菌物质和吞噬细胞是第二道防线；免疫器官和免疫细胞是第三道防线。", tags: ["高频"] },
  { id: "u4c7-015", t: "s", d: 2, kp: "免疫", q: "吞噬细胞吞噬侵入人体的病菌，属于", o: ["第二道防线，非特异性免疫", "第一道防线，非特异性免疫", "第三道防线，特异性免疫", "第二道防线，特异性免疫"], a: 0, e: "体液中的杀菌物质和吞噬细胞构成第二道防线，生来就有，对多种病原体都有防御作用，属于非特异性免疫。", tags: ["高频"] },
  { id: "u4c7-016", t: "s", d: 2, kp: "免疫", q: "特异性免疫的特点是", o: ["出生后才产生，只针对某一特定的病原体或异物起作用", "生来就有，对多种病原体都起作用", "由皮肤和黏膜完成", "由吞噬细胞完成"], a: 0, e: "特异性免疫是第三道防线，出生以后接触病原体等才逐渐建立，具有特异性。", tags: ["高频"] },
  { id: "u4c7-017", t: "s", d: 2, kp: "免疫", q: "注射乙肝疫苗后，人体会产生抵抗乙肝病毒的抗体。从免疫的角度看，乙肝疫苗属于", o: ["抗原", "抗体", "病原体", "传染源"], a: 0, e: "疫苗是用减毒、灭活的病原体等制成的，进入人体后能刺激淋巴细胞产生抗体，属于抗原。", tags: ["易错", "高频"] },
  { id: "u4c7-018", t: "s", d: 2, kp: "免疫", q: "抗体是由哪种细胞产生的", o: ["淋巴细胞", "吞噬细胞", "红细胞", "血小板"], a: 0, e: "病原体（抗原）刺激淋巴细胞产生抵抗该病原体的特殊蛋白质，即抗体。" },
  { id: "u4c7-019", t: "s", d: 2, kp: "免疫", q: "得过麻疹的人一般不会再得麻疹，但仍可能患流感，原因是", o: ["体内产生的麻疹抗体只能抵抗麻疹病毒", "麻疹病毒已经全部消失", "流感病毒更厉害", "得过麻疹后免疫力下降"], a: 0, e: "抗体具有特异性，麻疹病毒刺激产生的抗体只对麻疹病毒有作用，对流感病毒无效。" },
  { id: "u4c7-020", t: "s", d: 2, kp: "免疫", q: "有的人吃了鱼虾后会出现皮肤瘙痒、起红疹等症状，这是", o: ["过敏反应，免疫功能过强", "免疫功能过弱", "传染病", "遗传病"], a: 0, e: "过敏反应是免疫的防御功能过强造成的，引起过敏反应的物质叫过敏原。" },
  { id: "u4c7-021", t: "s", d: 3, kp: "免疫", q: "进行器官移植后，病人需要长期使用免疫抑制药物，原因是", o: ["移植的器官相当于抗原，会被免疫系统排斥", "移植的器官相当于抗体", "免疫抑制药物能提供营养", "防止病人患传染病"], a: 0, e: "移植的器官对受者来说是“非己”的抗原，会引起免疫排斥反应，需要用免疫抑制药物抑制排斥。", tags: ["易错"] },
  { id: "u4c7-022", t: "s", d: 2, kp: "免疫", q: "人体免疫的功能**不包括**", o: ["为细胞提供营养", "抵抗抗原侵入，防止疾病发生", "清除体内衰老、死亡和损伤的细胞", "识别和清除体内产生的异常细胞（如肿瘤细胞）"], a: 0, e: "免疫的功能有防御、自我稳定和免疫监视三方面。" },
  { id: "u4c7-023", t: "s", d: 2, kp: "免疫规划", q: "我国对适龄儿童有计划地进行预防接种，现在称为", o: ["免疫规划", "器官移植", "抗生素治疗", "隔离治疗"], a: 0, e: "根据传染病发生规律，按照科学的免疫程序，有计划地给人群接种疫苗，新教材称为免疫规划（旧称计划免疫）。", tags: ["高频"] },
  { id: "u4c7-024", t: "s", d: 2, kp: "免疫规划", q: "新生儿接种卡介苗，可以预防", o: ["肺结核", "乙肝", "麻疹", "小儿麻痹症"], a: 0, e: "卡介苗用于预防结核病（肺结核）。" },
  { id: "u4c7-025", t: "s", d: 2, kp: "免疫规划", q: "通过接种疫苗获得的免疫，属于", o: ["特异性免疫", "非特异性免疫", "第一道防线", "第二道防线"], a: 0, e: "疫苗刺激淋巴细胞产生相应抗体，只对特定病原体起作用，属于特异性免疫。" },
  { id: "u4c7-026", t: "s", d: 3, kp: "免疫", q: "下列免疫现象中，属于非特异性免疫的是", o: ["呼吸道黏膜上的纤毛清扫异物", "接种麻疹疫苗预防麻疹", "患过水痘的人不再患水痘", "注射破伤风抗毒素"], a: 0, e: "黏膜上的纤毛属于第一道防线，是非特异性免疫；其余都是针对特定病原体的特异性免疫。" },

  /* —— 用药与急救 —— */
  { id: "u4c7-027", t: "s", d: 1, kp: "用药与急救", q: "药品包装上标有“OTC”字样，表示", o: ["非处方药", "处方药", "进口药", "过期药"], a: 0, e: "OTC是非处方药的标志，不需要医师处方即可购买，按说明书服用；Rx表示处方药。", tags: ["高频"] },
  { id: "u4c7-028", t: "s", d: 2, kp: "用药与急救", q: "下列关于安全用药的说法，正确的是", o: ["用药前要仔细阅读药品说明书", "药吃得越多，病好得越快", "感冒了就要吃抗生素", "别人用过效果好的药，自己也可以随便吃"], a: 0, e: "安全用药要根据病情恰当选药，按说明书或医嘱确定剂量和时间；抗生素只对细菌有效，不能滥用。", tags: ["情境"] },
  { id: "u4c7-029", t: "s", d: 2, kp: "用药与急救", q: "遇到有人突然晕倒、心跳骤停时，应首先拨打的急救电话是", o: ["120", "110", "119", "122"], a: 0, e: "120是急救电话，拨打时要说清楚地点和病人情况。" },
  { id: "u4c7-030", t: "s", d: 2, kp: "用药与急救", q: "某人受伤后，伤口流出的血呈鲜红色，并从伤口喷射而出。他受伤的血管是", o: ["动脉", "静脉", "毛细血管", "无法判断"], a: 0, e: "动脉出血颜色鲜红、血流速度快，呈喷射状；静脉出血颜色暗红，连续不断地流出；毛细血管出血呈红色，慢慢渗出。", tags: ["高频"] },
  { id: "u4c7-031", t: "s", d: 2, kp: "用药与急救", q: "动脉出血时，正确的止血部位是", o: ["伤口的近心端", "伤口的远心端", "伤口处", "任意部位"], a: 0, e: "动脉中的血液从心脏流向全身，压迫伤口的近心端才能阻止血液流向伤口；静脉出血则压迫远心端。", tags: ["高频", "易错"] },
  { id: "u4c7-032", t: "s", d: 2, kp: "用药与急救", q: "手指不小心被划破，有少量血液慢慢渗出，正确的处理方法是", o: ["清洗、消毒后用创可贴包扎", "在近心端用止血带扎紧", "在远心端用止血带扎紧", "立即送医院输血"], a: 0, e: "这是毛细血管出血，一般会自行凝固，消毒后贴创可贴即可。" },
  { id: "u4c7-033", t: "s", d: 2, kp: "用药与急救", q: "进行心肺复苏时，胸外按压与人工呼吸的次数比一般是", o: ["30∶2", "2∶30", "15∶1", "1∶1"], a: 0, e: "心肺复苏时每按压30次，进行2次人工呼吸。" },
  { id: "u4c7-034", t: "s", d: 2, kp: "用药与急救", q: "进行口对口人工呼吸前，首先要做的是", o: ["清除病人口鼻内的异物和污物，保持呼吸道畅通", "让病人坐起来", "给病人喝水", "给病人吃药"], a: 0, e: "人工呼吸前要先清除口鼻中的异物，使病人仰卧、头后仰，保持呼吸道畅通。" },
  { id: "u4c7-035", t: "s", d: 3, kp: "用药与急救", q: "有人吃东西时被食物卡住气道，不能说话、呼吸困难，可采用的急救方法是", o: ["海姆立克急救法", "胸外按压", "让他平躺休息", "给他大量喝水"], a: 0, e: "气道异物梗阻时可用海姆立克急救法：从背后抱住患者，一手握拳顶住其肚脐上方，另一手包住拳头，快速向内上方冲击。" },
  { id: "u4c7-036", t: "s", d: 2, kp: "用药与急救", q: "静脉出血时，正确的止血方法是", o: ["在伤口的远心端压迫止血", "在伤口的近心端压迫止血", "不需要处理", "用热水冲洗伤口"], a: 0, e: "静脉中的血液从全身流回心脏，压迫伤口的远心端可以止血。" },

  /* —— 选择健康的生活方式 —— */
  { id: "u4c7-037", t: "s", d: 1, kp: "健康的生活方式", q: "按照世界卫生组织的定义，健康是指", o: ["身体上、心理上和社会适应方面的良好状态", "身体没有疾病", "身体强壮", "心情愉快"], a: 0, e: "健康不仅仅是没有疾病或不虚弱，而是身体上、心理上和社会适应方面的良好状态。" },
  { id: "u4c7-038", t: "s", d: 2, kp: "健康的生活方式", q: "青少年心理健康的核心是", o: ["心情愉快", "身体强壮", "学习成绩好", "朋友多"], a: 0, e: "心情愉快是儿童青少年心理健康的核心。" },
  { id: "u4c7-039", t: "s", d: 2, kp: "健康的生活方式", q: "遇到不顺心的事情时，下列调节情绪的方法**不恰当**的是", o: ["摔东西、打人发泄", "转移注意力，做自己喜欢的事", "向亲友倾诉", "自我安慰"], a: 0, e: "调节情绪的方法有转移注意力、宣泄（找合适的对象和方法）、自我安慰等，摔东西、打人是不恰当的宣泄方式。" },
  { id: "u4c7-040", t: "s", d: 2, kp: "健康的生活方式", q: "吸烟有害健康，烟草燃烧产生的有害物质中，能致癌的主要是", o: ["焦油", "氧气", "水蒸气", "二氧化碳"], a: 0, e: "烟草燃烧产生尼古丁、焦油、一氧化碳等有害物质，焦油中含有多种致癌物质。" },
  { id: "u4c7-041", t: "s", d: 2, kp: "健康的生活方式", q: "长期酗酒对人体危害很大，酒精会麻醉神经系统，还主要损伤", o: ["肝脏", "骨骼", "皮肤", "毛发"], a: 0, e: "酒精主要在肝脏中分解，长期酗酒会导致酒精性肝炎、肝硬化等。" },
  { id: "u4c7-042", t: "s", d: 2, kp: "健康的生活方式", q: "下列关于毒品的说法，**错误**的是", o: ["吸食一次毒品不会成瘾", "毒品会严重损害神经系统", "吸毒会降低人体免疫力", "我们要坚决拒绝毒品"], a: 0, e: "毒品极易成瘾，即使只吸一次也可能成瘾，要坚决拒绝。" },

  { id: "u5c1-014", t: "s", d: 2, kp: "生物与环境的关系", q: "在“光对鼠妇分布的影响”实验中，用10只鼠妇而不用1只，是为了", o: ["避免偶然性，减小误差", "让实验更有趣", "便于观察鼠妇的形态结构", "让鼠妇繁殖后代"], a: 0, e: "只用1只鼠妇，结果可能受偶然因素影响，用多只可以减小误差，使结论更可靠。", tags: ["实验"] },
  { id: "u5c1-015", t: "s", d: 1, kp: "生物与环境的关系", q: "鼠妇适宜生活的环境是", o: ["阴暗、潮湿的地方", "明亮、干燥的地方", "明亮、潮湿的地方", "阴暗、干燥的地方"], a: 0, e: "鼠妇常生活在石块、花盆下等阴暗潮湿的地方。" },
  { id: "u5c1-016", t: "s", d: 3, kp: "生物与环境的关系", q: "某同学要探究“水分对鼠妇分布的影响”，他设置的实验变量应该是", o: ["土壤的干湿程度", "光照的强弱", "温度的高低", "鼠妇的数量"], a: 0, e: "探究水分的影响，变量就是水分（土壤的干与湿），光照、温度、鼠妇数量等都要相同。", tags: ["实验"] },

  /* —— 生态系统的组成 —— */
  { id: "u5c1-017", t: "s", d: 1, kp: "生态系统的组成", q: "在一定的空间范围内，生物与环境所形成的统一整体叫做", o: ["生态系统", "食物链", "食物网", "生物因素"], a: 0, e: "生态系统是在一定空间范围内，生物与环境所形成的统一整体。" },
  { id: "u5c1-018", t: "s", d: 2, kp: "生态系统的组成", q: "下列可以看作一个生态系统的是", o: ["一片农田", "一群羊", "池塘中所有的鱼", "森林中所有的树"], a: 0, e: "生态系统既包括全部生物，也包括非生物环境。一片农田包含了其中的生物和环境；其余选项只有部分生物。", tags: ["高频", "易错"] },
  { id: "u5c1-019", t: "s", d: 1, kp: "生态系统的组成", q: "生态系统中的生产者主要是", o: ["绿色植物", "动物", "细菌和真菌", "病毒"], a: 0, e: "绿色植物能通过光合作用制造有机物，是生态系统中的生产者。" },
  { id: "u5c1-020", t: "s", d: 1, kp: "生态系统的组成", q: "生态系统中的分解者主要是", o: ["细菌和真菌", "绿色植物", "植食性动物", "肉食性动物"], a: 0, e: "营腐生生活的细菌和真菌是生态系统中的分解者。" },
  { id: "u5c1-021", t: "s", d: 2, kp: "生态系统的组成", q: "分解者在生态系统中的作用是", o: ["把动植物遗体中的有机物分解成无机物，供植物重新利用", "制造有机物，为其他生物提供食物", "帮助植物传粉、传播种子", "为生态系统提供太阳能"], a: 0, e: "分解者把动植物遗体、遗物中的有机物分解为二氧化碳、水和无机盐，归还到环境中，促进物质循环。" },
  { id: "u5c1-022", t: "s", d: 2, kp: "生态系统的组成", q: "在生态系统中，能把无机物合成有机物并储存能量的成分是", o: ["生产者", "消费者", "分解者", "非生物部分"], a: 0, e: "生产者通过光合作用把二氧化碳和水合成有机物，把光能转化为化学能储存在有机物中。" },
  { id: "u5c1-023", t: "s", d: 2, kp: "生态系统的组成", q: "一个完整的生态系统包括", o: ["生物部分和非生物部分", "生产者、消费者和分解者", "所有的动物和植物", "食物链和食物网"], a: 0, e: "生态系统由生物部分（生产者、消费者、分解者）和非生物部分（阳光、空气、水等）组成，只有生物部分不能构成生态系统。", tags: ["高频", "易错"] },
  { id: "u5c1-024", t: "s", d: 2, kp: "生态系统的组成", q: "关于动物在生态系统中的作用，下列说法正确的是", o: ["动物作为消费者，能促进生态系统的物质循环", "动物能利用光能制造有机物", "动物都是分解者", "动物对植物的生长有害无益"], a: 0, e: "动物是消费者，能促进物质循环，还能帮助植物传粉、传播种子，在维持生态平衡中起重要作用。" },
  { id: "u5c1-025", t: "s", d: 2, kp: "生态系统的组成", q: "下列生物中，属于分解者的是", o: ["蘑菇", "水稻", "蝗虫", "青蛙"], a: 0, e: "蘑菇是营腐生生活的真菌，属于分解者；水稻是生产者；蝗虫、青蛙是消费者。" },
  { id: "u5c1-026", t: "s", d: 3, kp: "生态系统的组成", q: "蚯蚓以土壤中的腐烂落叶等为食，它在生态系统中扮演的角色是", o: ["分解者", "生产者", "消费者", "非生物部分"], a: 0, e: "蚯蚓、蜣螂等以动植物遗体、遗物为食的腐生动物，能把有机物分解成无机物，属于分解者。", tags: ["易错"] },

  /* —— 食物链和食物网 —— */
  { id: "u5c1-027", t: "s", d: 2, kp: "食物链和食物网", q: "下列能正确表示一条食物链的是", o: ["草→兔→鹰", "阳光→草→兔→鹰", "草←兔←鹰", "兔→鹰→细菌"], a: 0, e: "食物链从生产者开始，箭头指向吃它的生物，不包括非生物部分（阳光）和分解者（细菌）。", tags: ["高频"] },
  { id: "u5c1-028", t: "s", d: 1, kp: "食物链和食物网", q: "食物链的起点是", o: ["生产者", "消费者", "分解者", "太阳"], a: 0, e: "食物链的起点是生产者（绿色植物），终点是不被其他动物捕食的消费者。" },
  { id: "u5c1-029", t: "s", d: 2, kp: "食物链和食物网", q: "在食物链“水稻→蝗虫→青蛙→蛇”中，如果青蛙被大量捕杀，短时间内数量会明显增加的是", o: ["蝗虫", "蛇", "水稻", "青蛙"], a: 0, e: "青蛙减少，蝗虫失去天敌，数量会增加；蛇因食物减少而减少，水稻因被蝗虫大量取食而减少。", tags: ["高频"] },
  { id: "u5c1-030", t: "s", d: 1, kp: "食物链和食物网", q: "食物链和食物网中，各种生物之间主要存在的是", o: ["吃与被吃的关系", "互相帮助的关系", "共同生活的关系", "寄生关系"], a: 0, e: "食物链是生产者和消费者之间因吃与被吃而形成的关系。" },
  { id: "u5c1-031", t: "s", d: 3, kp: "食物链和食物网", q: "在“草→鼠→蛇→鹰”这条食物链中，如果鹰的数量增加，短时间内", o: ["蛇的数量会减少", "鼠的数量会减少", "草的数量会增加", "蛇的数量会增加"], a: 0, e: "鹰捕食蛇，鹰增多会使蛇减少；蛇减少后鼠因天敌减少而增多，草被鼠大量取食而减少。" },
  { id: "u5c1-032", t: "s", d: 2, kp: "食物链和食物网", q: "根据“螳螂捕蝉，黄雀在后”，下列食物链书写正确的是", o: ["树→蝉→螳螂→黄雀", "蝉→螳螂→黄雀", "黄雀→螳螂→蝉→树", "树←蝉←螳螂←黄雀"], a: 0, e: "食物链必须从生产者（树）开始，箭头指向捕食者：树→蝉→螳螂→黄雀。", tags: ["高频"] },
  { id: "u5c1-033", t: "s", d: 2, kp: "食物链和食物网", q: "某湖泊被难以分解的有毒物质DDT污染，在“浮游植物→浮游动物→小鱼→大鱼”这条食物链中，体内DDT含量最高的是", o: ["大鱼", "小鱼", "浮游动物", "浮游植物"], a: 0, e: "有毒物质沿食物链逐级积累（生物富集），位于食物链末端的大鱼体内含量最高。", tags: ["高频"] },
  { id: "u5c1-034", t: "s", d: 2, kp: "食物链和食物网", q: "有毒物质会通过食物链不断积累，其原因是", o: ["有毒物质在生物体内难以分解，也不易排出", "有毒物质能被生物迅速分解", "越高级的消费者吃的食物越少", "有毒物质只存在于水中"], a: 0, e: "DDT、重金属等有毒物质性质稳定，在生物体内难以分解、不易排出，随着取食逐级积累。" },
  { id: "u5c1-035", t: "s", d: 3, kp: "食物链和食物网", q: "在一个食物网中，鹰既吃蛇又吃鼠，蛇也吃鼠。鹰和蛇之间的关系是", o: ["捕食和竞争", "只有捕食", "只有竞争", "合作"], a: 0, e: "鹰吃蛇是捕食关系；鹰和蛇都吃鼠，又是竞争关系。", tags: ["易错"] },

  /* —— 能量流动和物质循环 —— */
  { id: "u5c1-036", t: "s", d: 1, kp: "能量流动和物质循环", q: "生态系统中能量的最终来源是", o: ["太阳能", "绿色植物", "食物", "土壤"], a: 0, e: "生产者通过光合作用固定太阳能，太阳能是生态系统能量的最终来源。", tags: ["高频"] },
  { id: "u5c1-037", t: "s", d: 2, kp: "能量流动和物质循环", q: "生态系统中能量流动的特点是", o: ["沿食物链单向流动，逐级递减", "循环流动，逐级递增", "单向流动，逐级递增", "循环流动，逐级递减"], a: 0, e: "能量沿着食物链单向流动、逐级递减，一般只有10%～20%传递到下一个环节。", tags: ["高频"] },
  { id: "u5c1-038", t: "s", d: 2, kp: "能量流动和物质循环", q: "在食物链“草→兔→狐”中，所含能量最多的生物是", o: ["草", "兔", "狐", "三者一样多"], a: 0, e: "能量逐级递减，位于食物链起点的生产者（草）所含能量最多。" },
  { id: "u5c1-039", t: "s", d: 2, kp: "能量流动和物质循环", q: "生态系统中物质循环的特点是", o: ["物质在生物与无机环境之间反复循环", "物质只能从无机环境流向生物", "物质沿食物链单向流动，不能循环", "物质只在生物之间循环"], a: 0, e: "组成生物体的碳、氢、氧、氮等元素，在生物与无机环境之间反复循环。" },
  { id: "u5c1-040", t: "s", d: 2, kp: "能量流动和物质循环", q: "绿色植物在生态系统的物质循环中起重要作用，是因为它能", o: ["通过光合作用把无机物转变成有机物", "把有机物分解成无机物", "吸收氧气，释放二氧化碳", "分解动植物的遗体"], a: 0, e: "绿色植物通过光合作用把二氧化碳和水等无机物转变为有机物，使无机环境中的物质进入生物体。" },
  { id: "u5c1-041", t: "s", d: 2, kp: "能量流动和物质循环", q: "如果一个生态系统中没有分解者，将会出现的情况是", o: ["动植物遗体堆积如山，物质循环受阻", "生产者会大量增加", "消费者会大量增加", "生态系统不受任何影响"], a: 0, e: "没有分解者，动植物遗体中的有机物不能分解为无机物回归环境，物质循环无法进行。" },
  { id: "u5c1-042", t: "s", d: 3, kp: "能量流动和物质循环", q: "一般来说，食物链越往后，生物的数量越少，主要原因是", o: ["能量沿食物链逐级递减", "后面的生物繁殖能力强", "后面的生物寿命长", "物质沿食物链循环"], a: 0, e: "每一环节都有大量能量通过呼吸作用散失，传到下一环节的能量越来越少，能养活的生物也越来越少。" },

  /* —— 生态系统的自我调节 —— */
  { id: "u5c1-043", t: "s", d: 2, kp: "生态系统的自我调节", q: "在生态系统中，各种生物的数量和所占的比例总是维持在相对稳定的状态，这说明生态系统具有", o: ["一定的自我调节能力", "无限的自我调节能力", "很强的繁殖能力", "固定不变的结构"], a: 0, e: "生态系统具有一定的自我调节能力，使生物的数量和比例保持相对稳定（生态平衡）。" },
  { id: "u5c1-044", t: "s", d: 2, kp: "生态系统的自我调节", q: "下列生态系统中，自我调节能力最强的是", o: ["热带雨林生态系统", "农田生态系统", "草原生态系统", "城市生态系统"], a: 0, e: "热带雨林生物种类最多，营养结构最复杂，自我调节能力最强。", tags: ["高频"] },
  { id: "u5c1-045", t: "s", d: 2, kp: "生态系统的自我调节", q: "生态系统自我调节能力的大小主要取决于", o: ["生物的种类和数量多少、营养结构的复杂程度", "生产者的高矮", "非生物因素的多少", "消费者体形的大小"], a: 0, e: "生物种类越多，食物链和食物网越复杂，自我调节能力就越强。" },
  { id: "u5c1-046", t: "s", d: 3, kp: "生态系统的自我调节", q: "某草原为保护鹿群而大量捕杀狼，结果鹿的数量先迅速增多，后又急剧减少。鹿急剧减少的主要原因是", o: ["鹿过多，植被被破坏，食物严重缺乏", "鹿的繁殖能力突然下降", "气候突然变化", "狼的数量迅速增加"], a: 0, e: "失去天敌后鹿大量繁殖，过度啃食使植被遭到破坏，鹿因缺乏食物而大量死亡，说明自我调节能力是有限度的。", tags: ["情境"] },
  { id: "u5c1-047", t: "s", d: 2, kp: "生态系统的自我调节", q: "下列关于生态平衡的说法，正确的是", o: ["生态平衡是一种动态的、相对的平衡", "生态平衡时各种生物的数量恒定不变", "生态系统的自我调节能力是无限的", "外界的干扰不会破坏生态平衡"], a: 0, e: "生态平衡是动态的、相对的平衡；当外界干扰超过一定限度时，生态平衡就会被破坏。" },

  /* —— 生态系统的类型和生物圈 —— */
  { id: "u5c1-048", t: "s", d: 1, kp: "生态系统的类型", q: "被称为“地球之肾”的生态系统是", o: ["湿地生态系统", "森林生态系统", "海洋生态系统", "草原生态系统"], a: 0, e: "湿地具有净化水质、蓄洪抗旱的作用，被称为“地球之肾”。", tags: ["高频"] },
  { id: "u5c1-049", t: "s", d: 1, kp: "生态系统的类型", q: "有“绿色水库”“地球之肺”之称的生态系统是", o: ["森林生态系统", "湿地生态系统", "农田生态系统", "城市生态系统"], a: 0, e: "森林能涵养水源、保持水土，还能吸收二氧化碳、释放氧气，有“绿色水库”“地球之肺”之称。" },
  { id: "u5c1-050", t: "s", d: 2, kp: "生态系统的类型", q: "下列生态系统中，人起主导作用、受人类活动影响最大的是", o: ["城市生态系统", "森林生态系统", "海洋生态系统", "草原生态系统"], a: 0, e: "城市生态系统中人类起主导作用，植物种类和数量少，消费者主要是人类。" },
  { id: "u5c1-051", t: "s", d: 1, kp: "生物圈", q: "地球上最大的生态系统是", o: ["生物圈", "海洋生态系统", "森林生态系统", "草原生态系统"], a: 0, e: "生物圈是地球上所有生物与其环境的总和，是最大的生态系统，是所有生物共同的家园。", tags: ["高频"] },
  { id: "u5c1-052", t: "s", d: 2, kp: "生物圈", q: "生物圈的范围包括", o: ["大气圈的底部、水圈的大部和岩石圈的表面", "整个大气圈、水圈和岩石圈", "大气圈的上部、水圈的表层和岩石圈的深处", "地球上所有的陆地和海洋"], a: 0, e: "生物圈包括大气圈的底部、水圈的大部和岩石圈的表面。", tags: ["高频"] },
  { id: "u5c1-053", t: "s", d: 2, kp: "生物圈", q: "长江发源于青藏高原，沿途流经森林、农田、湿地、城市等多种生态系统，最后注入东海。这说明", o: ["各种生态系统之间是相互联系的", "各种生态系统是彼此孤立的", "生物圈中只有一种生态系统", "生态系统之间没有物质交流"], a: 0, e: "各类生态系统通过河流、大气、生物迁移等相互关联，生物圈是一个统一的整体。" },
  { id: "u5c1-054", t: "s", d: 2, kp: "生态系统的类型", q: "娄底新化紫鹊界梯田所在的山上森林、竹林茂密，梯田虽然没有修建水库，却常年有水灌溉。这主要体现了森林的哪项作用", o: ["涵养水源", "防风固沙", "调节气温", "提供木材"], a: 0, e: "森林植被和土壤能蓄积雨水、缓慢释放，起到涵养水源、保持水土的作用，为梯田持续供水。", tags: ["情境"] },
  { id: "u5c1-055", t: "s", d: 2, kp: "制作生态瓶", q: "制作生态瓶时，下列做法正确的是", o: ["把生态瓶放在有散射光的地方", "把生态瓶放在黑暗的柜子里", "瓶内放入尽可能多的小鱼", "瓶内只放小鱼不放水草"], a: 0, e: "生态瓶应放在有散射光处，使水草能进行光合作用；动物不宜过多，生产者、消费者、分解者要搭配合理。", tags: ["实验"] },

  { id: "u5c2-002", t: "s", d: 2, kp: "生态安全", q: "关于人与自然的关系，下列说法正确的是", o: ["人类是生物圈中的一员，应与自然和谐共生", "人类可以随意改造自然", "自然资源取之不尽、用之不竭", "人类活动对生物圈没有影响"], a: 0, e: "人类生活在生物圈中，依赖生物圈提供的资源和环境，应尊重自然、顺应自然、保护自然。" },
  { id: "u5c2-003", t: "s", d: 2, kp: "人类活动对环境的影响", q: "形成酸雨的主要原因是大气中含有过多的", o: ["二氧化硫、氮氧化物等", "二氧化碳", "氧气", "氮气"], a: 0, e: "煤、石油等燃料燃烧时会排放二氧化硫和氮氧化物，它们与水结合形成酸性物质随雨水降落，形成酸雨。", tags: ["高频"] },
  { id: "u5c2-004", t: "s", d: 2, kp: "人类活动对环境的影响", q: "下列**不属于**酸雨危害的是", o: ["使土壤中的营养物质增加", "使河流、湖泊酸化，影响鱼虾生长", "直接伤害植物的芽和叶", "腐蚀建筑物和金属制品"], a: 0, e: "酸雨会使土壤中的养分流失、土壤酸化，而不是使营养物质增加。", tags: ["易错"] },
  { id: "u5c2-005", t: "s", d: 2, kp: "人类活动对环境的影响", q: "控制酸雨的根本措施是", o: ["减少煤、石油等燃料燃烧时污染物的排放", "向河流中撒石灰", "禁止使用塑料袋", "多建造高大建筑物"], a: 0, e: "酸雨主要来自燃料燃烧排放的污染物，通过使用脱硫技术、开发清洁能源等减少排放是根本措施。" },
  { id: "u5c2-006", t: "s", d: 2, kp: "人类活动对环境的影响", q: "导致温室效应加剧、全球气候变暖的主要气体是", o: ["二氧化碳", "二氧化硫", "氧气", "氮气"], a: 0, e: "大量燃烧化石燃料、砍伐森林使大气中二氧化碳增多，温室效应加剧。", tags: ["高频"] },
  { id: "u5c2-007", t: "s", d: 2, kp: "保护生态环境", q: "我国提出二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现", o: ["碳中和", "零排放", "碳循环", "无碳生活"], a: 0, e: "这就是“碳达峰、碳中和”目标。碳中和是指通过植树造林、节能减排等，抵消自身产生的二氧化碳排放。", tags: ["时事"] },
  { id: "u5c2-008", t: "s", d: 2, kp: "保护生态环境", q: "下列做法与“低碳生活”理念**不相符**的是", o: ["经常使用一次性筷子和餐盒", "步行或骑自行车上学", "随手关灯，节约用电", "纸张双面使用"], a: 0, e: "一次性筷子和餐盒消耗大量木材和资源，不符合低碳生活理念。" },
  { id: "u5c2-009", t: "s", d: 2, kp: "人类活动对环境的影响", q: "含氮、磷的生活污水和农田化肥大量流入湖泊，使藻类等大量繁殖，水质恶化。这种现象称为", o: ["水体富营养化", "酸雨", "温室效应", "生物富集"], a: 0, e: "氮、磷等营养物质过多使藻类疯长，发生在淡水中叫水华，发生在海洋中叫赤潮。" },
  { id: "u5c2-010", t: "s", d: 3, kp: "人类活动对环境的影响", q: "水体富营养化后，水中鱼类常大量死亡，主要原因是", o: ["大量藻类死亡后被分解，消耗了水中大量的氧气", "藻类会捕食鱼类", "水中的二氧化碳减少", "鱼类的食物增多"], a: 0, e: "藻类大量繁殖后又大量死亡，细菌分解遗体时消耗大量氧气，导致水中缺氧，鱼类窒息死亡。" },
  { id: "u5c2-011", t: "s", d: 1, kp: "人类活动对环境的影响", q: "“白色污染”是指", o: ["废弃塑料造成的污染", "白色粉尘造成的污染", "白色建筑造成的光污染", "石灰造成的污染"], a: 0, e: "废弃塑料难以降解，造成的环境污染称为白色污染。" },
  { id: "u5c2-012", t: "s", d: 2, kp: "人类活动对环境的影响", q: "下列人类活动中，容易导致草原沙漠化的是", o: ["过度放牧", "合理轮牧", "种草固沙", "建立自然保护区"], a: 0, e: "过度放牧使草场植被被破坏，土地裸露，容易引起沙漠化。" },
  { id: "u5c2-013", t: "s", d: 2, kp: "人类活动对环境的影响", q: "大量砍伐森林可能导致的后果中，**不包括**", o: ["空气中氧气含量明显增加", "水土流失加剧", "野生动物失去栖息地", "调节气候的能力下降"], a: 0, e: "森林能通过光合作用释放氧气，砍伐森林只会减少氧气的产生。", tags: ["易错"] },
  { id: "u5c2-014", t: "s", d: 2, kp: "人类活动对环境的影响", q: "下列污染问题中，主要由氟利昂等物质引起的是", o: ["臭氧层被破坏", "酸雨", "温室效应", "水体富营养化"], a: 0, e: "氟利昂等会破坏臭氧层，使到达地面的紫外线增强，危害人体健康。" },
  { id: "u5c2-015", t: "s", d: 2, kp: "人类活动对环境的影响", q: "某地农田长期大量使用杀虫剂，害虫天敌（如鸟类、青蛙）的数量明显减少。这说明", o: ["滥用农药会破坏生态平衡", "农药对生态系统没有影响", "农药只对害虫起作用", "应该继续加大农药用量"], a: 0, e: "农药会杀死害虫天敌，还会通过食物链积累，破坏生态平衡，因此要科学合理使用农药。" },

  /* —— 生物入侵 —— */
  { id: "u5c2-016", t: "s", d: 2, kp: "生物入侵", q: "外来物种入侵会威胁当地的生态安全，主要原因是", o: ["入侵物种在新环境中缺少天敌，大量繁殖，排挤本地物种", "入侵物种都有剧毒", "入侵物种能增加当地生物种类", "入侵物种无法在当地生存"], a: 0, e: "入侵物种在新环境中往往缺少天敌和竞争者，迅速繁殖蔓延，挤占本地物种的生存空间，破坏生态平衡。", tags: ["高频"] },
  { id: "u5c2-017", t: "s", d: 1, kp: "生物入侵", q: "下列物种中，属于我国外来入侵物种的是", o: ["福寿螺", "大熊猫", "扬子鳄", "朱鹮"], a: 0, e: "福寿螺原产南美洲，被引入我国后成为入侵物种；大熊猫、扬子鳄、朱鹮都是我国特有的珍稀动物。" },
  { id: "u5c2-018", t: "s", d: 2, kp: "生物入侵", q: "凤眼蓝（俗称“水葫芦”）引入我国后，在许多水域疯长，堵塞河道，导致水中其他生物大量死亡。这说明", o: ["盲目引进外来物种可能破坏生态平衡", "引进外来物种都能增加生物多样性", "凤眼蓝是我国的本地物种", "凤眼蓝对生态系统没有影响"], a: 0, e: "引进外来物种要慎重，否则可能造成生物入侵，威胁本地物种，破坏生态平衡。" },
  { id: "u5c2-019", t: "s", d: 2, kp: "生物入侵", q: "小明想把家里养的红耳彩龟（巴西龟）放生到附近的河里，你认为", o: ["不应该，它可能成为入侵物种，威胁本地生物", "应该，放生是保护动物的行为", "应该，能增加河流中的生物种类", "无所谓，对环境没有影响"], a: 0, e: "红耳彩龟适应能力强，放生后可能与本地龟类争夺食物和空间，造成生物入侵。不能随意放生外来物种。", tags: ["情境"] },
  { id: "u5c2-020", t: "s", d: 2, kp: "生物入侵", q: "为防止外来物种入侵，下列做法**错误**的是", o: ["从境外网购活体昆虫当宠物", "出入境时对动植物进行检疫", "不随意放生来历不明的动物", "发现疑似入侵物种及时报告"], a: 0, e: "私自从境外购买活体动植物可能带入入侵物种，违反《中华人民共和国生物安全法》等法律法规。" },
  { id: "u5c2-021", t: "s", d: 2, kp: "生物入侵", q: "下列关于生物入侵的说法，正确的是", o: ["随意引进或放生外来物种可能导致生物入侵", "所有外来物种都会成为入侵物种", "生物入侵只会发生在海洋中", "生物入侵能使本地物种数量增加"], a: 0, e: "并非所有外来物种都会造成危害，但随意引进、放生可能导致生物入侵，造成本地物种减少。" },

  /* —— 保护生态环境 —— */
  { id: "u5c2-022", t: "s", d: 2, kp: "保护生态环境", q: "“绿水青山就是金山银山”蕴含的道理是", o: ["保护生态环境就是保护生产力", "经济发展比环境保护更重要", "为了保护环境要停止一切开发", "山水可以直接换成金银"], a: 0, e: "这一理念强调生态环境是宝贵的财富，保护生态环境就是保护生产力，改善生态环境就是发展生产力。" },
  { id: "u5c2-023", t: "s", d: 2, kp: "保护生态环境", q: "从2021年1月1日起，长江流域重点水域实行“十年禁渔”，其主要目的是", o: ["保护长江水生生物资源，修复长江生态", "增加渔民的收入", "方便船只航行", "防止发生洪水"], a: 0, e: "长江禁渔是为了让长江休养生息，恢复鱼类等水生生物资源，保护长江江豚等珍稀物种。", tags: ["时事"] },
  { id: "u5c2-024", t: "s", d: 2, kp: "保护生态环境", q: "我国实施退耕还林、还草、还湖等工程，主要目的是", o: ["恢复和保护生态环境", "增加粮食产量", "扩大城市面积", "开采地下矿产"], a: 0, e: "退耕还林、还草、还湖是为了恢复被破坏的森林、草原和湿地，保护生态环境。" },
  { id: "u5c2-025", t: "s", d: 2, kp: "保护生态环境", q: "生活垃圾分类中，废旧荧光灯管、过期药品属于", o: ["有害垃圾", "可回收物", "厨余垃圾", "其他垃圾"], a: 0, e: "废旧荧光灯管含汞，过期药品含有有害成分，都属于有害垃圾，需要单独收集、专门处理。", tags: ["情境"] },
  { id: "u5c2-026", t: "s", d: 1, kp: "保护生态环境", q: "下列垃圾中，属于可回收物的是", o: ["废旧报纸", "剩菜剩饭", "用过的餐巾纸", "过期药品"], a: 0, e: "废纸、塑料瓶、金属、玻璃等属于可回收物；剩菜剩饭是厨余垃圾；用过的餐巾纸是其他垃圾；过期药品是有害垃圾。" },
  { id: "u5c2-027", t: "s", d: 1, kp: "保护生态环境", q: "下列做法中，有利于保护生态环境的是", o: ["工业废水处理达标后再排放", "将生活污水直接排入河流", "露天焚烧农作物秸秆", "大量使用一次性塑料袋"], a: 0, e: "工业废水达标排放可以减少水体污染；其余做法都会污染环境。" },
  { id: "u5c2-028", t: "s", d: 2, kp: "保护生态环境", q: "城市污水处理厂常利用某些细菌净化污水，这主要是利用了细菌能够", o: ["分解污水中的有机物", "进行光合作用", "产生抗生素", "固定空气中的氮"], a: 0, e: "污水处理利用细菌把污水中的有机物分解成无机物，从而净化污水。" },
  { id: "u5c2-029", t: "s", d: 2, kp: "保护生态环境", q: "下列关于保护生态环境的说法，正确的是", o: ["保护生态环境需要每个人从身边小事做起", "保护环境只是政府的事", "环境污染对人体健康没有影响", "应该先发展经济，以后再治理环境"], a: 0, e: "保护生态环境人人有责，应从节约资源、垃圾分类、绿色出行等小事做起。" },
  { id: "u5c2-030", t: "s", d: 1, kp: "保护生态环境", q: "下列能源中，属于清洁能源的是", o: ["太阳能", "煤", "石油", "木柴"], a: 0, e: "太阳能、风能、水能等使用时几乎不产生污染物，属于清洁能源。" },
  { id: "u5c2-031", t: "s", d: 2, kp: "保护生态环境", q: "某地在废弃矿区覆土、种草、植树，几年后矿区重新披上绿装。这一做法属于", o: ["生态修复", "生物入侵", "围湖造田", "毁林开荒"], a: 0, e: "通过人工措施帮助受损的生态系统恢复，属于生态修复。", tags: ["情境"] },
  { id: "u5c2-032", t: "s", d: 2, kp: "保护生态环境", q: "洞庭湖是我国重要的湿地。下列做法中，有利于保护洞庭湖湿地生态系统的是", o: ["退田还湖，恢复湿地面积", "围湖造田，扩大耕地", "在湖区大量捕捞鱼类", "向湖中排放未经处理的污水"], a: 0, e: "退田还湖能恢复湿地面积，增强湿地蓄洪、净化水质的功能，保护湿地生物。", tags: ["情境"] },
  { id: "u5c2-033", t: "s", d: 2, kp: "保护生态环境", q: "生物防治是利用生物来防治病虫害。下列属于生物防治的是", o: ["利用赤眼蜂防治玉米螟", "喷洒化学农药杀灭害虫", "用黑光灯诱杀害虫", "人工捕捉害虫"], a: 0, e: "利用天敌（赤眼蜂寄生在玉米螟卵中）控制害虫属于生物防治；黑光灯诱杀属于物理防治，喷农药属于化学防治。" },
  { id: "u5c2-034", t: "s", d: 2, kp: "保护生态环境", q: "与使用化学农药相比，生物防治的优点是", o: ["减少农药使用，避免环境污染", "能在短时间内消灭所有害虫", "操作最简单，见效最快", "会使害虫天敌减少"], a: 0, e: "生物防治利用生物之间的关系控制害虫，不污染环境，有利于保持生态平衡。" },
  { id: "u5c2-035", t: "s", d: 3, kp: "模拟酸雨实验", q: "在“探究酸雨对种子萌发的影响”实验中，用食醋和清水配制“模拟酸雨”浇灌实验组，对照组应浇灌", o: ["等量的清水", "等量的食醋", "不浇任何液体", "等量的盐水"], a: 0, e: "对照组与实验组只能有一个变量（是否为酸性溶液），所以对照组浇等量的清水。", tags: ["实验"] },

  /* 判断题 */
  { id: "u5c2-j01", t: "j", d: 1, kp: "人类活动对环境的影响", q: "酸雨主要是由大气中二氧化碳过多引起的。", a: false, e: "酸雨主要由二氧化硫、氮氧化物引起；二氧化碳过多会加剧温室效应。" },
  { id: "u5c2-j02", t: "j", d: 1, kp: "生物入侵", q: "引进外来物种一定能增加当地的生物多样性。", a: false, e: "外来物种可能成为入侵物种，导致本地物种减少。" },
  { id: "u5c2-j03", t: "j", d: 1, kp: "保护生态环境", q: "植树造林可以吸收二氧化碳，有利于缓解温室效应。", a: true, e: "植物通过光合作用吸收二氧化碳。" },
  { id: "u5c2-j04", t: "j", d: 2, kp: "生物入侵", q: "把家里养的外来宠物放生到野外，是保护动物的行为。", a: false, e: "随意放生外来物种可能造成生物入侵。" },
  { id: "u5c2-j05", t: "j", d: 1, kp: "保护生态环境", q: "保护生态环境，人人有责。", a: true, e: "要从身边小事做起。" },
  { id: "u5c2-j06", t: "j", d: 2, kp: "人类活动对环境的影响", q: "废弃塑料难以降解，会造成“白色污染”。", a: true, e: "应减少使用一次性塑料制品。" },
  { id: "u5c2-j07", t: "j", d: 2, kp: "人类活动对环境的影响", q: "生活污水中的氮、磷等物质越多，越有利于湖泊中鱼类的生长。", a: false, e: "会造成水体富营养化，导致鱼类缺氧死亡。" },
  { id: "u5c2-j08", t: "j", d: 2, kp: "保护生态环境", q: "利用赤眼蜂防治玉米螟属于生物防治。", a: true, e: "利用天敌控制害虫。" },
  { id: "u5c2-j09", t: "j", d: 1, kp: "保护生态环境", q: "过期药品属于可回收物。", a: false, e: "过期药品属于有害垃圾。" },
  { id: "u5c2-j10", t: "j", d: 2, kp: "生态安全", q: "生态安全是国家安全的重要组成部分。", a: true, e: "维护生态安全关系到人类的生存和发展。" },
  { id: "u5c2-j11", t: "j", d: 2, kp: "人类活动对环境的影响", q: "过度放牧会导致草原退化甚至沙漠化。", a: true, e: "要合理放牧。" },
  { id: "u5c2-j12", t: "j", d: 2, kp: "保护生态环境", q: "为了发展经济，可以先污染环境，以后再治理。", a: false, e: "先污染后治理代价巨大，应坚持保护优先。" },

  /* 非选择题 */
  {
    id: "u5c2-c01", t: "c", ct: "资料", d: 2, kp: "生物入侵",
    title: "阅读资料，回答问题。",

  { id: "u6c1-027", t: "s", d: 2, kp: "两栖动物的生殖和发育", q: "青蛙的受精方式和发育方式分别是", o: ["体外受精、变态发育", "体内受精、变态发育", "体外受精、不经过变态", "体内受精、不经过变态"], a: 0, e: "青蛙的精子和卵细胞在水中结合（体外受精），幼体蝌蚪与成蛙差异很大，属于变态发育。", tags: ["高频"] },
  { id: "u6c1-028", t: "s", d: 2, kp: "两栖动物的生殖和发育", q: "繁殖季节，雌雄蛙会抱对，抱对的意义是", o: ["促使雌雄蛙同时排出卵细胞和精子，提高受精率", "进行体内受精", "保护受精卵", "相互取暖"], a: 0, e: "抱对能刺激雌蛙和雄蛙同时排出卵细胞和精子，提高受精率，但受精仍在水中进行。" },
  { id: "u6c1-029", t: "s", d: 1, kp: "两栖动物的生殖和发育", q: "蝌蚪生活在水中，它的呼吸器官是", o: ["鳃", "肺", "皮肤", "气管"], a: 0, e: "蝌蚪用鳃呼吸；成蛙用肺呼吸，皮肤辅助呼吸。" },
  { id: "u6c1-030", t: "s", d: 2, kp: "两栖动物的生殖和发育", q: "成蛙的呼吸方式是", o: ["用肺呼吸，皮肤辅助呼吸", "只用鳃呼吸", "只用皮肤呼吸", "用鳃和肺呼吸"], a: 0, e: "成蛙的肺结构简单，需要湿润的皮肤辅助呼吸。" },
  { id: "u6c1-031", t: "s", d: 2, kp: "两栖动物的生殖和发育", q: "两栖动物的生殖和幼体发育都必须在什么环境中进行", o: ["水中", "干燥的陆地上", "潮湿的土壤中", "树上"], a: 0, e: "两栖动物在水中受精，幼体在水中用鳃呼吸，生殖和幼体发育都离不开水。" },
  { id: "u6c1-032", t: "s", d: 2, kp: "两栖动物的生殖和发育", q: "近年来，许多地方的青蛙数量明显减少，主要原因可能是", o: ["水体污染和栖息地被破坏", "青蛙的繁殖能力增强", "害虫数量增多", "雨水增多"], a: 0, e: "青蛙的生殖和幼体发育离不开水，水体污染、湿地减少都会使青蛙数量减少。" },

  /* —— 鸟的生殖和发育 —— */
  { id: "u6c1-033", t: "s", d: 2, kp: "鸟的生殖和发育", q: "在鸟类的生殖和发育过程中，所有鸟类都必须经历的阶段是", o: ["求偶、交配、产卵", "筑巢、孵卵、育雏", "求偶、筑巢、育雏", "交配、孵卵、育雏"], a: 0, e: "求偶、交配、产卵是所有鸟类都要经历的；有些鸟（如杜鹃）不筑巢、不孵卵、不育雏。", tags: ["高频", "易错"] },
  { id: "u6c1-034", t: "s", d: 2, kp: "鸟的生殖和发育", q: "杜鹃自己不筑巢，把卵产在其他鸟的巢中，由其他鸟代为孵卵和育雏。这说明", o: ["筑巢、孵卵、育雏不是所有鸟类都要经历的", "杜鹃不进行有性生殖", "杜鹃的卵不需要孵化", "杜鹃不产卵"], a: 0, e: "杜鹃的行为说明，求偶、交配、产卵是必经阶段，而筑巢、孵卵、育雏并非所有鸟类都有。" },
  { id: "u6c1-035", t: "s", d: 1, kp: "鸟的生殖和发育", q: "鸟卵中，将来发育成雏鸟的结构是", o: ["胚盘", "卵黄", "卵白", "气室"], a: 0, e: "胚盘中含有细胞核，受精后的胚盘是胚胎发育的部位，将来发育成雏鸟。", tags: ["高频"] },
  { id: "u6c1-036", t: "s", d: 2, kp: "鸟的生殖和发育", q: "鸟卵中，为胚胎发育提供主要营养物质的结构是", o: ["卵黄", "卵白", "胚盘", "系带"], a: 0, e: "卵黄为胚胎发育提供主要营养；卵白提供营养和水分。" },
  { id: "u6c1-037", t: "s", d: 2, kp: "鸟的生殖和发育", q: "鸟卵中，能为胚胎发育提供营养物质和水分的结构是", o: ["卵白", "气室", "卵壳", "胚盘"], a: 0, e: "卵白含有营养物质和水分，供胚胎发育需要。" },
  { id: "u6c1-038", t: "s", d: 2, kp: "鸟的生殖和发育", q: "鸟卵中的卵细胞包括", o: ["卵黄膜、卵黄和胚盘", "卵壳、卵白和卵黄", "卵白、卵黄和胚盘", "壳膜、卵黄和系带"], a: 0, e: "鸟卵的卵细胞由卵黄膜、卵黄和胚盘构成。", tags: ["易错"] },
  { id: "u6c1-039", t: "s", d: 2, kp: "鸟的生殖和发育", q: "鸡卵钝端的气室，主要作用是", o: ["为胚胎发育提供氧气", "为胚胎发育提供营养", "固定卵黄", "将来发育成雏鸡"], a: 0, e: "气室储存空气，为胚胎发育提供氧气。" },
  { id: "u6c1-040", t: "s", d: 3, kp: "鸟的生殖和发育", q: "从超市买来的鸡蛋，即使放在适宜条件下也孵不出小鸡，最可能的原因是", o: ["鸡蛋没有受精", "鸡蛋太小", "卵壳太厚", "鸡蛋里没有气室"], a: 0, e: "只有受精的卵才能发育成雏鸡，超市出售的鸡蛋大多没有受精。", tags: ["易错"] },
  { id: "u6c1-041", t: "s", d: 2, kp: "鸟的生殖和发育", q: "与两栖动物相比，鸟类的生殖和发育摆脱了对水的依赖，主要原因是", o: ["体内受精，卵外有坚硬的卵壳保护", "体外受精", "卵生", "进行变态发育"], a: 0, e: "鸟类体内受精，卵有卵壳和壳膜保护，能减少水分散失，适于在陆地上发育。" },
  { id: "u6c1-042", t: "s", d: 1, kp: "鸟的生殖和发育", q: "家鸽的受精方式和生殖方式分别是", o: ["体内受精、卵生", "体内受精、胎生", "体外受精、卵生", "体外受精、胎生"], a: 0, e: "鸟类都是体内受精、卵生。" },

  { id: "u6c3-004", t: "s", d: 2, kp: "生命的起源", q: "一般认为，原始生命诞生的场所是", o: ["原始海洋", "原始大气", "原始陆地", "火山口"], a: 0, e: "原始大气中的物质形成的有机物随雨水进入原始海洋，经过漫长的岁月，在原始海洋中逐渐形成了原始生命。", tags: ["高频"] },
  { id: "u6c3-005", t: "s", d: 2, kp: "生命的起源", q: "下列关于生命起源的说法，正确的是", o: ["原始生命是由非生命物质经过漫长的化学进化形成的", "原始生命是在今天的地球上不断产生的", "原始大气中含有大量氧气", "米勒实验直接得到了原始生命"], a: 0, e: "化学进化学说认为，原始生命是由非生命物质经过极其漫长的时间逐渐演变而来的。" },

  /* —— 生物进化的证据 —— */
  { id: "u6c3-006", t: "s", d: 1, kp: "生物进化的证据", q: "研究生物进化最直接、最重要的证据是", o: ["化石", "比较解剖学", "胚胎学", "分子生物学"], a: 0, e: "化石是保存在地层中的古代生物的遗体、遗物或生活痕迹，是研究生物进化最直接的证据。", tags: ["高频"] },
  { id: "u6c3-007", t: "s", d: 2, kp: "生物进化的证据", q: "在越古老的地层中，形成化石的生物", o: ["越简单、越低等，水生的越多", "越复杂、越高等，陆生的越多", "越复杂、越低等，水生的越多", "越简单、越高等，陆生的越多"], a: 0, e: "越古老的地层中，化石生物越简单、低等，水生的较多；越晚近的地层中，化石生物越复杂、高等，陆生的较多。", tags: ["高频"] },
  { id: "u6c3-008", t: "s", d: 2, kp: "生物进化的证据", q: "始祖鸟化石既具有鸟类的特征，又具有爬行动物的特征，它可以作为哪两类动物之间具有亲缘关系的证据", o: ["鸟类和爬行类", "鸟类和哺乳类", "鱼类和两栖类", "两栖类和爬行类"], a: 0, e: "始祖鸟身体有羽毛、前肢变成翼（似鸟），又有牙齿、长尾和爪（似爬行动物），说明鸟类可能由古代爬行动物进化而来。" },
  { id: "u6c3-009", t: "s", d: 2, kp: "生物进化的证据", q: "比较人、猫、鲸、蝙蝠的前肢骨骼，发现它们的结构基本相似。这说明它们", o: ["可能有共同的祖先", "生活环境相同", "功能完全相同", "是同一种生物"], a: 0, e: "这些前肢外形和功能不同，但骨骼结构基本相同，说明它们可能是由共同的原始祖先进化来的（比较解剖学证据）。" },
  { id: "u6c3-010", t: "s", d: 3, kp: "生物进化的证据", q: "科学家比较了几种生物的细胞色素c的氨基酸组成，发现与人的差异越小的生物，与人的", o: ["亲缘关系越近", "亲缘关系越远", "体型越相似", "生活环境越相同"], a: 0, e: "分子生物学证据表明，细胞色素c的差异越小，生物之间的亲缘关系越近。" },
  { id: "u6c3-011", t: "s", d: 2, kp: "生物进化的证据", q: "下列关于化石的说法，**错误**的是", o: ["化石只能是古代生物的遗体", "化石是研究生物进化的直接证据", "化石可以是古代生物的遗物或生活痕迹", "化石是在地层中形成的"], a: 0, e: "化石包括古代生物的遗体、遗物（如蛋）和生活痕迹（如脚印）。", tags: ["易错"] },

  /* —— 生物进化的历程 —— */
  { id: "u6c3-012", t: "s", d: 1, kp: "生物进化的历程", q: "生物进化的总体趋势是", o: ["从简单到复杂，从低等到高等，从水生到陆生", "从复杂到简单，从高等到低等，从陆生到水生", "从简单到复杂，从低等到高等，从陆生到水生", "从单细胞到多细胞，从陆生到水生"], a: 0, e: "生物进化的总体趋势是由简单到复杂、由低等到高等、由水生到陆生。", tags: ["高频"] },
  { id: "u6c3-013", t: "s", d: 2, kp: "生物进化的历程", q: "植物进化的大致历程是", o: ["藻类→苔藓植物、蕨类植物→种子植物", "苔藓植物→藻类→蕨类植物→种子植物", "藻类→种子植物→蕨类植物", "蕨类植物→苔藓植物→藻类→种子植物"], a: 0, e: "原始藻类进化为原始苔藓植物和原始蕨类植物，原始蕨类植物进化为原始种子植物（裸子植物和被子植物）。", tags: ["高频"] },
  { id: "u6c3-014", t: "s", d: 2, kp: "生物进化的历程", q: "在脊椎动物的进化历程中，最先出现的是", o: ["鱼类", "两栖类", "爬行类", "哺乳类"], a: 0, e: "脊椎动物的进化顺序：鱼类→两栖类→爬行类→鸟类和哺乳类。" },
  { id: "u6c3-015", t: "s", d: 2, kp: "生物进化的历程", q: "鸟类和哺乳类都是由哪类动物进化来的", o: ["古代的爬行类", "古代的两栖类", "古代的鱼类", "古代的无脊椎动物"], a: 0, e: "古代爬行类的一些分支分别进化成了原始鸟类和原始哺乳类。" },
  { id: "u6c3-016", t: "s", d: 2, kp: "生物进化的历程", q: "下列植物类群中，最高等的是", o: ["被子植物", "裸子植物", "蕨类植物", "苔藓植物"], a: 0, e: "被子植物有真正的花和果实，种子外有果皮包被，是最高等的植物类群。" },
  { id: "u6c3-017", t: "s", d: 3, kp: "生物进化的历程", q: "下列动物中，进化地位最高的是", o: ["家兔", "家鸽", "青蛙", "鲫鱼"], a: 0, e: "家兔属于哺乳动物，是动物界中最高等的类群。" },

  /* —— 生物进化的原因：自然选择 —— */
  { id: "u6c3-018", t: "s", d: 1, kp: "自然选择", q: "提出自然选择学说的科学家是", o: ["达尔文", "孟德尔", "巴斯德", "米勒"], a: 0, e: "英国博物学家达尔文提出了以自然选择学说为核心的生物进化理论。" },
  { id: "u6c3-019", t: "s", d: 2, kp: "自然选择", q: "达尔文认为，生物进化的原因是", o: ["自然选择", "用进废退", "生物主动适应环境", "神创造万物"], a: 0, e: "自然选择学说认为，生物在生存斗争中适者生存、不适者被淘汰，这是生物进化的原因。" },
  { id: "u6c3-020", t: "s", d: 2, kp: "自然选择", q: "自然选择学说的主要内容**不包括**", o: ["环境改变使生物产生定向变异", "过度繁殖", "生存斗争", "遗传和变异、适者生存"], a: 0, e: "自然选择学说包括过度繁殖、生存斗争、遗传和变异、适者生存。变异是不定向的，环境只是对变异进行选择。", tags: ["易错"] },
  { id: "u6c3-021", t: "s", d: 3, kp: "自然选择", q: "长颈鹿的长颈形成的原因，用达尔文的观点解释正确的是", o: ["颈长的个体在生存斗争中更容易获得食物而生存下来，经过长期的自然选择形成", "长颈鹿为了吃到高处的树叶，经常伸长脖子，颈就变长了", "长颈鹿的颈是在环境影响下突然变长的", "上帝创造了长颈鹿"], a: 0, e: "古代长颈鹿颈有长有短（变异），颈长的能吃到高处树叶而生存并繁殖（适者生存），一代代积累就形成了长颈。“经常伸长脖子”是用进废退的观点。", tags: ["高频", "易错"] },
  { id: "u6c3-022", t: "s", d: 3, kp: "自然选择", q: "长期使用同一种杀虫剂，害虫的抗药性越来越强，原因是", o: ["杀虫剂选择了具有抗药性变异的害虫", "杀虫剂使害虫产生了抗药性变异", "害虫为了适应杀虫剂而主动产生抗药性", "杀虫剂的质量越来越差"], a: 0, e: "害虫中原本就存在抗药性强弱不同的变异，杀虫剂杀死了抗药性弱的个体，抗药性强的个体存活并繁殖，抗药性逐代增强。", tags: ["高频", "易错"] },
  { id: "u6c3-023", t: "s", d: 3, kp: "自然选择", q: "滥用抗生素会使细菌的耐药性增强。下列解释符合自然选择学说的是", o: ["抗生素对细菌的耐药性变异进行了选择", "抗生素使细菌产生了耐药性变异", "细菌接触抗生素后主动产生了耐药性", "细菌的耐药性与抗生素无关"], a: 0, e: "细菌中本来就有耐药性不同的个体，抗生素淘汰了不耐药的个体，耐药的个体生存下来并繁殖，耐药性逐渐增强。" },
  { id: "u6c3-024", t: "s", d: 2, kp: "自然选择", q: "某地的桦尺蛾原来多为浅色，工业污染使树干变黑后，深色桦尺蛾越来越多。这是因为", o: ["深色桦尺蛾在黑色树干上不易被鸟发现，生存机会更大", "浅色桦尺蛾被污染物染成了深色", "桦尺蛾为了躲避天敌而主动变成深色", "鸟类只喜欢吃深色桦尺蛾"], a: 0, e: "树干变黑后，深色个体不易被天敌发现，生存和繁殖的机会多，这是自然选择的结果。" },
  { id: "u6c3-025", t: "s", d: 2, kp: "自然选择", q: "生物的变异是不定向的，而自然选择是", o: ["定向的", "不定向的", "随机的", "没有方向的"], a: 0, e: "变异是不定向的，自然选择是定向的，决定了生物进化的方向。" },
  { id: "u6c3-026", t: "s", d: 2, kp: "自然选择", q: "达尔文认为，在生存斗争中，具有有利变异的个体容易生存下来，并繁殖后代；具有不利变异的个体则容易被淘汰。这一过程叫做", o: ["自然选择", "人工选择", "过度繁殖", "生存斗争"], a: 0, e: "在生存斗争中，适者生存、不适者被淘汰的过程叫做自然选择。" },
  { id: "u6c3-027", t: "s", d: 2, kp: "自然选择", q: "雷鸟的羽毛在冬季是白色，在夏季是灰褐色，与环境颜色基本一致。这是", o: ["长期自然选择的结果", "雷鸟主动适应环境的结果", "人工选择的结果", "环境直接改变了雷鸟的遗传物质"], a: 0, e: "雷鸟的保护色是在长期的生存斗争中，经过自然选择形成的对环境的适应。" },
  { id: "u6c3-028", t: "s", d: 2, kp: "自然选择", q: "人们培育出各种形态的金鱼，这是", o: ["人工选择的结果", "自然选择的结果", "金鱼主动适应环境的结果", "环境直接改变的结果"], a: 0, e: "金鱼的众多品种是人们根据自己的喜好，对金鱼的变异进行选择和培育的结果，属于人工选择。" },

  /* —— 人类的起源和发展 —— */
  { id: "u6c3-029", t: "s", d: 1, kp: "人类的起源和发展", q: "现代类人猿和人类的共同祖先是", o: ["森林古猿", "长臂猿", "黑猩猩", "大猩猩"], a: 0, e: "现代类人猿和人类都起源于森林古猿。", tags: ["高频"] },
  { id: "u6c3-030", t: "s", d: 2, kp: "人类的起源和发展", q: "在人类的进化过程中，最有决定意义的阶段是", o: ["能够直立行走", "能够使用工具", "产生了语言", "学会用火"], a: 0, e: "直立行走是人类进化过程中具有决定意义的一步，使前肢解放出来，能够使用和制造工具。" },
  { id: "u6c3-031", t: "s", d: 2, kp: "人类的起源和发展", q: "下列动物中，属于现代类人猿的是", o: ["黑猩猩", "猕猴", "金丝猴", "狒狒"], a: 0, e: "现代类人猿包括长臂猿、猩猩、黑猩猩和大猩猩；猕猴、金丝猴、狒狒属于猴类。" },
  { id: "u6c3-032", t: "s", d: 2, kp: "人类的起源和发展", q: "“露西”化石显示其髋骨较宽阔，下肢骨比上肢骨粗壮，据此推测“露西”", o: ["可能已经能够直立行走", "已经能够制造复杂的工具", "已经能够使用语言", "完全在树上生活"], a: 0, e: "髋骨宽阔、下肢骨粗壮，说明能够直立行走。" },
  { id: "u6c3-033", t: "s", d: 3, kp: "人类的起源和发展", q: "下列关于人类起源和发展的说法，**不正确**的是", o: ["人类是由现代类人猿进化来的", "森林古猿是人类和现代类人猿的共同祖先", "古人类在制造工具的过程中，脑越来越发达", "环境的变化是森林古猿向人类进化的外部条件"], a: 0, e: "人类和现代类人猿有共同的祖先森林古猿，人类不是由现代类人猿进化来的。", tags: ["易错"] },
  { id: "u6c3-034", t: "s", d: 2, kp: "人类的起源和发展", q: "部分森林古猿下到地面生活，主要原因是", o: ["森林大量消失，环境发生变化", "地面上食物更丰富", "树上天敌太多", "它们学会了直立行走"], a: 0, e: "地形和气候变化使森林大量消失，一部分森林古猿被迫下到地面生活，逐渐进化成人类。" },

  /* 判断题 */
  { id: "u6c3-j01", t: "j", d: 1, kp: "生命的起源", q: "原始大气中含有氧气。", a: false, e: "原始大气中没有氧气。" },
  { id: "u6c3-j02", t: "j", d: 2, kp: "生命的起源", q: "米勒实验证明了原始地球上能形成原始生命。", a: false, e: "只证明了无机物能形成有机小分子。" },
  { id: "u6c3-j03", t: "j", d: 1, kp: "生物进化的证据", q: "化石是研究生物进化最直接的证据。", a: true, e: "化石记录了生物的进化历程。" },
  { id: "u6c3-j04", t: "j", d: 2, kp: "生物进化的证据", q: "在越晚近的地层中，形成化石的生物越复杂、越高等。", a: true, e: "陆生生物也越多。" },
  { id: "u6c3-j05", t: "j", d: 1, kp: "生物进化的历程", q: "生物进化的总体趋势是从简单到复杂、从低等到高等、从水生到陆生。", a: true, e: "这是生物进化的总体趋势。" },
  { id: "u6c3-j06", t: "j", d: 2, kp: "生物进化的历程", q: "现在地球上已经没有低等生物了。", a: false, e: "低等生物与高等生物同时存在于今天的地球上。" },
  { id: "u6c3-j07", t: "j", d: 2, kp: "自然选择", q: "害虫的抗药性是在杀虫剂的作用下产生的。", a: false, e: "抗药性变异原本就存在，杀虫剂只起选择作用。" },
  { id: "u6c3-j08", t: "j", d: 2, kp: "自然选择", q: "生物的变异是不定向的，自然选择是定向的。", a: true, e: "自然选择决定生物进化的方向。" },
  { id: "u6c3-j09", t: "j", d: 1, kp: "人类的起源和发展", q: "人类是由现代类人猿进化而来的。", a: false, e: "人类和现代类人猿的共同祖先是森林古猿。" },
  { id: "u6c3-j10", t: "j", d: 1, kp: "人类的起源和发展", q: "直立行走是人类进化过程中具有决定意义的一步。", a: true, e: "前肢得到解放。" },
  { id: "u6c3-j11", t: "j", d: 2, kp: "生物进化的历程", q: "鸟类和哺乳类都是由古代的爬行类进化来的。", a: true, e: "它们分别由不同的古代爬行类进化而来。" },
  { id: "u6c3-j12", t: "j", d: 2, kp: "自然选择", q: "长颈鹿的长颈是因为经常伸长脖子吃高处的树叶而形成的。", a: false, e: "这是用进废退的观点，长颈是自然选择的结果。" },

      { t: "s", q: "图中①进行火花放电，是模拟原始地球上的", o: ["闪电", "降雨", "火山", "地震"], a: 0, p: 2 },
      { t: "f", q: "图中③冷凝器的作用是使水蒸气冷凝，模拟原始地球上的____。", a: ["降雨", "下雨"], p: 2 },
      { t: "s", q: "从⑤处取样检测，发现了氨基酸等物质，这说明", o: ["在原始地球条件下，无机物能形成有机小分子", "在原始地球条件下，能形成原始生命", "氨基酸能直接形成原始生命", "原始大气中含有氨基酸"], a: 0, p: 2 },
      { t: "s", q: "一般认为，原始生命诞生于", o: ["原始海洋", "原始大气", "原始陆地", "火山口"], a: 0, p: 2 }
    ],
    e: "米勒实验：①电极放电（模拟闪电）、②原始大气（甲烷、氨、氢、水蒸气，无氧气）、③冷凝器（模拟降雨）、④沸水（模拟原始海洋）、⑤取样处检测到氨基酸等有机小分子。"

  {
    id: "u6c3-c02", t: "c", ct: "识图", d: 2, kp: "生物进化的历程", fig: "evotree",

/* =========================================================
 * 界面小部件：提示条、弹窗、确认框（不使用浏览器自带 alert/confirm）
 * ========================================================= */
const UI = {
  _toastTimer: 0,
  toast(msg, kind) {
    let el = $("#toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      document.body.appendChild(el);
    }
    el.className = "toast show " + (kind || "");
    el.textContent = msg;
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { el.className = "toast " + (kind || ""); }, 2200);
  },

  _modalStack: [],
  modal(html, opts) {
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "modal-wrap" + (opts.wide ? " wide" : "") + (opts.full ? " full" : "");
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">` +
      `${opts.title ? `<div class="modal-h"><h3>${esc(opts.title)}</h3><button type="button" class="iconbtn" data-act="closeModal" aria-label="关闭">✕</button></div>` : ""}` +
      `<div class="modal-b">${html}</div></div>`;
    wrap.addEventListener("click", e => {
      if (e.target === wrap && opts.dismiss !== false) UI.closeModal();
    });
    document.body.appendChild(wrap);
    this._modalStack.push({ el: wrap, onClose: opts.onClose });
    requestAnimationFrame(() => wrap.classList.add("show"));
    const f = wrap.querySelector("[autofocus], input, textarea, button.primary");
    if (f) setTimeout(() => { try { f.focus(); } catch (e) { /* 忽略 */ } }, 30);
    return wrap;
  },
  closeModal() {
    const top = this._modalStack.pop();
    if (!top) return;
    top.el.remove();
    if (top.onClose) top.onClose();
  },
  closeAll() { while (this._modalStack.length) this.closeModal(); },

  /* 页面内确认框：cb 在点击确认后执行 */
  confirm(text, okLabel, cb, opts) {
    opts = opts || {};
    const id = "cf" + uid();
    UI._confirmCb = cb;
    UI.modal(`<p class="confirm-text">${text}</p>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">取消</button>
      <button type="button" class="btn ${opts.danger ? "danger" : "primary"}" id="${id}" data-act="confirmOk">${esc(okLabel || "确定")}</button></div>`,
      { title: opts.title || "请确认" });
  },
  _confirmCb: null,

  /* 输入框弹窗：cb(value) */
  prompt(title, label, def, cb) {
    UI._promptCb = cb;
    UI.modal(`<label class="field"><span>${esc(label)}</span><input id="promptInput" type="text" value="${esc(def || "")}" maxlength="30" autofocus></label>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">取消</button>
      <button type="button" class="btn primary" data-act="promptOk">确定</button></div>`, { title });
  },
  _promptCb: null,

  /* 复制文字：在点击事件里调用；失败时选中文字让用户手动复制 */
  copy(text, fallbackEl) {
    const done = () => UI.toast("已复制");
    const fail = () => {
      if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
      UI.toast("请长按或按 Ctrl+C 手动复制");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fail);
      } else fail();
    } catch (e) { fail(); }
  },

  /* 下载文件（离线版可用；网页预览版会退回复制） */
  download(name, text, mime) {
    if (IS_ARTIFACT) return false;
    try {
      const blob = new Blob([text], { type: mime || "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return true;
    } catch (e) { return false; }
  },

  canPrint() { return !IS_ARTIFACT && typeof window.print === "function"; }
};
